# nextest profiles for the library test suite.
# CI workers do not read this file directly: scripts/ci/nextest_ci.py plan copies it per worker,
# swaps profile.ci default-filter for the worker's exact IDs and sets retries: one retry for every
# test under --retry-mode all-once (PR, main), or the retry allowlist overrides under policy (nightly).

[profile.default]
retries = 0
fail-fast = false

[profile.default.junit]
path = "junit.xml"
report-skipped = "none"
store-success-output = false
store-failure-output = true
flaky-fail-status = "failure"

[test-groups]
shared-fixture = { max-threads = 1 }

[profile.ci]
default-filter = "all()"
retries = 0
# A retry pass outside the allowlist overrides fails the run; all-once plans set retries = 1 and pass.
flaky-result = "fail"
fail-fast = false
test-threads = 1
# Slow warning only; long PG tests legitimately pass two minutes.
slow-timeout = { period = "180s" }
# A child that keeps the output handles open after the parent exits is a failure, not a pass.
leak-timeout = { period = "2s", result = "fail" }

[[profile.ci.overrides]]
filter = "all()"
test-group = "shared-fixture"
