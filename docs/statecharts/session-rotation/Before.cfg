\* Design-1 behaviour with stop, clear and outside selections: every repair and the native gate off.
\* Input bypasses stay off for size; NativeUnsafe and DirectUngated show their cuts, NoRelease liveness.
SPECIFICATION Spec
CONSTANTS
  Ordinary = {o1}
  Req = req
  Seed = seed
  Direct = direct
  Fire = fire
  Native = native
  MaxCrashes = 0
  MaxKills = 1
  FixRelease = FALSE
  FixLatch = FALSE
  FixRecreate = FALSE
  FixDirect = FALSE
  FixSched = FALSE
  FixOwner = FALSE
  FixUnknown = FALSE
  FixHold = FALSE
  FixNotice = FALSE
  FixClear = FALSE
  FixSelf = FALSE
  FixCas = FALSE
  FixLatchKey = FALSE
  NativeGate = FALSE
  HostQueuesExit = FALSE
  EnvBypass = FALSE
  EnvControl = TRUE
INVARIANTS
  InputExactlyOneSession
  LatchDurable
  LatchOnlyIfAsked
  NoOverwriteExternal
  NoScheduleLoss
  NoStrayEffect
  NoUnflushedCut
  SingleExecution
  ClearedNotDelivered
CHECK_DEADLOCK FALSE
