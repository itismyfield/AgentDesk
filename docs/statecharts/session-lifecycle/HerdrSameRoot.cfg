\* S1 only: Q arrives after the first completed reader pass. Early-input/preclaim race is S2.
\* dcserver restart retains the exact W0/R0/provider and grant; no pane is created.
SPECIFICATION Spec
CONSTANTS
    PreclaimEnabled = FALSE
    WakeEnabled = FALSE
    HoldBeforeRecovery = FALSE
    InitialRowState = "bound"
    ReplaceServer = FALSE
    PrepareEnabled = TRUE
    OwnerInstalled = TRUE
    OldGrant = TRUE
    InputAfterFirstPass = TRUE
    PeerVerified = TRUE
    ConfigExplicitFalse = TRUE
    ConfigBeforeStart = TRUE
    SameDirectory = TRUE
    CacheReadable = TRUE
    LocalCurrent = TRUE
    OriginalGone = TRUE
    ReplacementProviderLive = FALSE
INVARIANTS
    SameRootNoCreate
    InputAtMostOnce
    NoRetireLiveExecution
    PreserveHeldInput
    NoUnverifiedServerTrust
    InputUsesCurrentExecution
    PendingBeforeCreate
    OldGrantUnchanged
PROPERTIES ReplacedInputProgress SameRootInputProgress
