\* Superseded contract: a close that keeps failing is retained once its budget is spent, with the
\* old pane kept under its journal (HerdrHandoffHeldPersistentClose). NoRetained is not checked here.
SPECIFICATION Spec
CONSTANTS
    Policy = "fixed"
    Entry = "idle"
    N = 1
    AlwaysFails = TRUE
    Failures = 0
    FirstRefusals = FALSE
    Blocked = FALSE
    HasDraft = FALSE
    Restarts = 0
    CrashPoint = "none"
    BootCase = "normal"
    IdentityRace = "none"
    Mutant = "None"
INVARIANTS
    TypeOK
    InputAtMostOnce
    NoSilentLoss
    NoOldKeys
    NoHumanDraftExecution
    NoForeignClose
    OneProvider
PROPERTIES
    HandoffProgress
    RetryProgress
