\* Retired row progress is gated by the runtime-kind marker seen by turn presence.
SPECIFICATION RetiredMarkerFixedSpec
CONSTANTS
    PreclaimEnabled = TRUE
    WakeEnabled = TRUE
    HoldBeforeRecovery = FALSE
    InitialRowState = "retired"
    ReplaceServer = TRUE
    PrepareEnabled = TRUE
    OwnerInstalled = TRUE
    OldGrant = TRUE
    InputAfterFirstPass = FALSE
    PeerVerified = TRUE
    ConfigExplicitFalse = TRUE
    ConfigBeforeStart = TRUE
    SameDirectory = TRUE
    CacheReadable = TRUE
    LocalCurrent = TRUE
    OriginalGone = TRUE
    ReplacementProviderLive = FALSE
INVARIANTS
    SameRootNoCreate
    InputAtMostOnce
    NoRetireLiveExecution
    PreserveHeldInput
    NoUnverifiedServerTrust
    PendingBeforeCreate
    OldGrantUnchanged
    NonApplicableNoPreclaimRead
    HealthyNoPreclaimRead
    CompletionWakeAtMostOnce
    OldRetiredNoWake
PROPERTY RetiredInputProgress
