\* Mutant: no source claim, so a periodic catch-up scan that took its evidence before a steer was saved enqueues it again.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 0
          SealScope = "nonce"
          NoticeMode = "hold"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
          ClaimMode = "none"
          Rewrites = 0
          ScanRaces = 1
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
