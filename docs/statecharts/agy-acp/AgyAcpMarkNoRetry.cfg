\* Mutant: a kept row whose mark could not be written waits for the mark; the next admission never retries it and the channel stays blocked.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "off"
          ReadFails = 1
          SealScope = "nonce"
          NoticeMode = "seal"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
