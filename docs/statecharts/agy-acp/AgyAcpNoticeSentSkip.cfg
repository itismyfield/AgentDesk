\* Mutant: notices go on the stream and the final body skips those already sent, so an error rewrite that replaced the body posts without them.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 0
          SealScope = "nonce"
          NoticeMode = "sent_skip"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
          ClaimMode = "handoff"
          Rewrites = 1
          ScanRaces = 0
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
