\* Alternative: one agy acp child per turn, resumed each time; steering inside the turn.
SPECIFICATION Spec
CONSTANTS Lifetime = "per_turn"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 1
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
