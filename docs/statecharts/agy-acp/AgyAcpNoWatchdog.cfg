\* Mutant: no inactivity/cancel deadline; a silent child holds the input.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          InputMode = "queue"
          BootMode = "fail"
          Watchdog = FALSE
          ClearMode = "detach"
          Fence = TRUE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
