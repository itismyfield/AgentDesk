\* Mutant: no inactivity/cancel deadline; a silent child holds the turn.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = FALSE
          ClearMode = "detach"
          Fence = TRUE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
