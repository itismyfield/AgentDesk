\* Mutant: /clear discards a rejected steer still being returned but leaves its Returning record, which brings it back.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "returns_old"
          Fence = TRUE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
