\* Mutant: responses are matched by JSON-RPC id alone across child incarnations.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          InputMode = "queue"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = FALSE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
