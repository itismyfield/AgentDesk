\* Mutant: a forced stop publishes its cancel before it records its intent.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "promote"
          RecordMode = "owner"
          ForceOrder = "cancel_first"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
PROPERTIES EveryInputSettles ForceEndsTurn ForceEndsChild
CHECK_DEADLOCK FALSE
