\* Mutant: the first input of a turn keeps only its Discord source ids; its origin is never written ahead, so neither the receipt nor boot names it.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "off"
          MarkRetry = "retry"
          ReadFails = 0
          SealScope = "nonce"
          NoticeMode = "hold"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
          ClaimMode = "handoff"
          Rewrites = 0
          ScanRaces = 0
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
