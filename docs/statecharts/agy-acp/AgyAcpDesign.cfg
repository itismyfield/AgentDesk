\* Chosen design: resident child, session/resume, a person input sent while a prompt is open steers that turn.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 1
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
