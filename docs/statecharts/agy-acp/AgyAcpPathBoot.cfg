\* The ACP switch is read at boot: a reload while the child is up leaves the path as it was.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "off"
          RecordMode = "off"
          ForceOrder = "intent_first"
          PathPick = "boot"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
    SessionKeepsPath
PROPERTIES EveryInputSettles ForceEndsTurn ForceEndsChild
CHECK_DEADLOCK FALSE
