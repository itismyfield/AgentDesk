\* Mutant: an input is steered into a turn whose last prompt already answered.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "after_close"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "off"
          RecordMode = "off"
          ForceOrder = "intent_first"
          PathPick = "off"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
