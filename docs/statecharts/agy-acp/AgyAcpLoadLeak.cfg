\* Mutant: session/load replay is forwarded to the channel.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "load_leak"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "promote"
          RecordMode = "owner"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
PROPERTIES EveryInputSettles ForceEndsTurn
CHECK_DEADLOCK FALSE
