\* The four session safety mutants together: one chart with every duplicate, foreign-answer and cleared-session path.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "load_leak"
          SteerMode = "steer"
          BootMode = "rerun_sent"
          Watchdog = TRUE
          ClearMode = "keep"
          Fence = FALSE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 0
          SealScope = "nonce"
          NoticeMode = "hold"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
          ClaimMode = "handoff"
          Rewrites = 0
          ScanRaces = 0
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
