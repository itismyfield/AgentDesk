\* The four session safety mutants together: one chart with every duplicate, foreign-answer and cleared-session path.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "load_leak"
          SteerMode = "steer"
          BootMode = "rerun_sent"
          Watchdog = TRUE
          ClearMode = "keep"
          Fence = FALSE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
