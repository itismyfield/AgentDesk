\* Mutant: held notices are joined once when the bridge leaves its loop, before the error or prompt-too-long rewrite replaces the body.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          SealMode = "seal"
          LeaderOrigin = "save"
          MarkRetry = "retry"
          ReadFails = 0
          SealScope = "nonce"
          NoticeMode = "pre_format"
          CatchUpMode = "skip"
          SwitchOffs = 0
          CkptFails = 0
          ClaimMode = "handoff"
          Rewrites = 1
          ScanRaces = 0
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
