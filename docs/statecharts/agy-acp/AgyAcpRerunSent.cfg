\* Mutant: boot re-sends inputs whose prompts were already written.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "rerun_sent"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "promote"
          RecordMode = "owner"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
PROPERTIES EveryInputSettles ForceEndsTurn
CHECK_DEADLOCK FALSE
