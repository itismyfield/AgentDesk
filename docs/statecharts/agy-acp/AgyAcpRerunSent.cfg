\* Mutant: boot re-sends an input whose prompt was already written.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          InputMode = "queue"
          BootMode = "rerun_sent"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
PROPERTY EveryInputSettles
CHECK_DEADLOCK FALSE
