\* Mutant: the ACP switch is read at every input, so a reload moves the next input to `-p`.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "resume"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "off"
          RecordMode = "off"
          ForceOrder = "intent_first"
          PathPick = "turn"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
    SessionKeepsPath
PROPERTIES EveryInputSettles ForceEndsTurn ForceEndsChild
CHECK_DEADLOCK FALSE
