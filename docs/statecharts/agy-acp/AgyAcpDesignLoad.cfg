\* Fallback when resume is not advertised: session/load with replay dropped until the load answer.
SPECIFICATION Spec
CONSTANTS Lifetime = "resident"
          AttachMode = "load_gated"
          SteerMode = "steer"
          BootMode = "fail"
          Watchdog = TRUE
          ClearMode = "detach"
          Fence = TRUE
          ReceiptMode = "merge"
          ForceMode = "promote"
          RecordMode = "owner"
INVARIANTS
    AtMostOnePost
    NoDuplicateExecution
    NoForeignResponse
    NoPromptToClearedSession
    PostOnlyWithDisposition
    AnswerCoversWholeSteer
    NoAnswerForRefusedSteer
    DurableOwner
    NoReviveAfterClear
    NoMissingOrigin
    ChildRecorded
PROPERTIES EveryInputSettles ForceEndsTurn
CHECK_DEADLOCK FALSE
