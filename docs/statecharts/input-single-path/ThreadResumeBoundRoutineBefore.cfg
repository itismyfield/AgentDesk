\* 검증 바인딩 있는 스레드에 루틴 process 실행이 지나간 뒤, 현재 코드. EXPECTED_LIVENESS=RPersonServed
CONSTANTS
    Target = "boundThread"
    InitialSession = "boundStored"
    ActualHost = "tmux"
    DesiredHost = "tmux"
    Mutation = "resumeCurrent"
    CanCrash = TRUE
SPECIFICATION ResumeSpec
INVARIANT RNoSilentLoss RNoSilentFailure RAnswerOnce RVerifiedResumeKept RVerifiedMeansObserved RFreshCarriesRecent
PROPERTY RPersonServed
