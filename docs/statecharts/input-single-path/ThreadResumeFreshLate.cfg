\* 변이: launch 층에서만 fresh로 바꿔 최근 맥락 없음. EXPECTED_SAFETY=RFreshCarriesRecent
CONSTANTS
    Target = "boundThread"
    InitialSession = "unboundStored"
    ActualHost = "tmux"
    DesiredHost = "tmux"
    Mutation = "resumeFreshLate"
    CanCrash = TRUE
SPECIFICATION ResumeSpec
INVARIANT RNoSilentLoss RNoSilentFailure RAnswerOnce RVerifiedResumeKept RVerifiedMeansObserved RFreshCarriesRecent
PROPERTY RPersonServed
