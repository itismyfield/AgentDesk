\* 수리안 (b), 배포 전 스레드, forged 기록 검사를 뺀 liveness 확인. EXPECTED_LIVENESS=RPersonServed
CONSTANTS
    Target = "boundThread"
    InitialSession = "unboundStored"
    ActualHost = "tmux"
    DesiredHost = "tmux"
    Mutation = "resumeRecordLegacy"
    CanCrash = TRUE
SPECIFICATION ResumeSpec
INVARIANT RNoSilentLoss RNoSilentFailure RAnswerOnce RVerifiedResumeKept RFreshCarriesRecent
PROPERTY RPersonServed
