<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentDesk Runner</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #030712; color: #f3f4f6; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
    main { max-width: 34rem; margin: 1.5rem; padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #111827; }
    h1 { margin: 0 0 1.25rem; font-size: 1.6rem; }
    p { line-height: 1.7; }
    .hint { color: #9ca3af; font-size: .9rem; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>AgentDesk Runner</h1>
    <p>이 장비는 에이전트 작업을 실행하는 Runner입니다.</p>
    <p>대시보드와 에이전트·프로바이더 설정은 <strong>Hub 장비의 주소</strong>로 접속해 관리하세요.</p>
    <p class="hint"><code>localhost</code>와 <code>127.0.0.1</code>은 현재 브라우저가 실행 중인 장비를 가리킵니다. 다른 장비의 Hub에 접속하려면 해당 Hub의 주소를 사용하세요.</p>
  </main>
</body>
</html>
