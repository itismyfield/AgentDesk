# 해소 지점: C10e-2 착지 뒤, M-KRX 착수 전 조각에서 layers.toml 재분류 + reclassify 승인으로 해소한다(이 파일은 그때까지 남긴다).
# 지우는 조건: C10e-1이 SessionTransitionLease의 host를 trait generic으로 바꾸고 SharedData용 구현을 DL discord/shared_state/g7_host.rs로 옮겨,
#   discord/session_transition.rs에서 `use super::SharedData`(:1)와 lease 인자의 SharedData가 없어지면
#   layers.toml에 prefix "services::discord::session_transition"을 adapter 층으로 넣는다. 남는 참조는 ChannelId·std·crate::db(adapter)뿐이라 새 역방향이 없다.
#   그러면 legacy_state(adapter) → session_transition(adapter)가 역방향이 아니게 되어 이 increase 행과 이 파일이 필요 없다.
