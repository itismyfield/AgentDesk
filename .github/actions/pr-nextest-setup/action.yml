name: Prepare a PR nextest worker
description: Start a dedicated test PostgreSQL service and install the worker tools.
outputs:
  herdr-bin:
    description: Path to the verified Herdr fixture executable
    value: ${{ steps.herdr.outputs.bin }}
runs:
  using: composite
  steps:
    - name: Start PostgreSQL service
      shell: bash
      run: ./scripts/ci/postgres-service.sh start
    # Rollback rehearsal executes the runbook's literal rg command.
    - name: Install ripgrep
      id: ripgrep
      continue-on-error: true
      uses: taiki-e/install-action@v2
      with:
        tool: ripgrep
    # A release download outage must not stop the workers; any packaged rg runs the runbook command.
    - name: Install ripgrep from the OS package manager
      if: steps.ripgrep.outcome != 'success'
      shell: bash
      run: |
        echo "::warning title=ripgrep download failed::installing ripgrep from the ${RUNNER_OS} package manager"
        case "$RUNNER_OS" in
          Linux) sudo apt-get install -y ripgrep || { sudo apt-get update && sudo apt-get install -y ripgrep; } ;;
          macOS) brew install ripgrep ;;
          Windows) choco install ripgrep --yes --no-progress ;;
        esac
    - name: Require ripgrep
      shell: bash
      run: rg --version
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.94.1"
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.149
    # The real-Herdr fixture tests read this pinned binary; the key carries version and digest.
    - name: Restore herdr test binary
      id: herdr_cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/herdr-test-bin
        key: herdr-0.9.5-14d9e8bc8b4a-linux-x86_64
    # A download outage fails here, before any test, with the line the infra rerun classifier matches.
    - name: Install herdr test binary
      id: herdr
      shell: bash
      env:
        HERDR_CACHE_HIT: ${{ steps.herdr_cache.outputs.cache-hit }}
      run: |
        expected=14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
        bin="$RUNNER_TEMP/herdr-test-bin/herdr-0.9.5"
        if [ "$HERDR_CACHE_HIT" != true ]; then
          mkdir -p "$RUNNER_TEMP/herdr-test-bin"
          code=$(curl --fail --location --retry 3 --silent --show-error --output "$bin" --write-out '%{http_code}' \
            https://github.com/herdrdev/herdr/releases/download/v0.9.5/herdr-linux-x86_64) || {
            echo "::error title=herdr download failed::herdr test binary download failed: HTTP ${code:-000}"
            exit 1
          }
        fi
        echo "$expected  $bin" | sha256sum --check
        chmod 700 "$bin"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
