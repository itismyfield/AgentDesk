name: PR 5926 repair objects
on:
  push:
    branches: [ci/5926-failure-extract-20260914]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 496d5d953ab0d2e5190f75a090197965ba8bc6e5
          persist-credentials: false
      - name: Apply exact test-only inventory repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 496d5d953ab0d2e5190f75a090197965ba8bc6e5
          mkdir evidence
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_delivery_journal_raw_writer.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('key type. The collector also has exactly ONE caller, in',
               'key type. The collector also has exactly ONE production caller, in'),
              ('            {"src/services/discord/tmux_watcher.rs": 1},\n'
               '            "the collector gained or lost a caller; the claim that pipe and TUI join on one "',
               '            {\n'
               '                "src/services/discord/tmux_watcher.rs": 1,\n'
               '                "src/services/discord/tmux_watcher/streaming_status_tick/native_collector_tests.rs": 1,\n'
               '            },\n'
               '            "the collector gained or lost a caller (one production caller plus the pinned "\n'
               '            "native regression); the claim that pipe and TUI join on one "'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, 'unexpected source; refuse approximate patch'
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_test_target_integrity.py --write-lib-inventory-manifest > evidence/inventory-generation.txt 2>&1
          python3 - <<'PY'
          import pathlib, subprocess
          path = 'scripts/lib_test_inventory_manifest.txt'
          before = set(subprocess.check_output(['git', 'show', 'HEAD:' + path], text=True).splitlines())
          after = set(pathlib.Path(path).read_text().splitlines())
          prefix = 'services::discord::tmux::tmux_watcher::streaming_status_tick::committed_progress_tests::'
          expected = {prefix + 'recovered_session_bound_codex_stream_tick_reaches_http',
                      prefix + 'native_collector_tests::recovered_native_preview_terminal_has_one_visible_copy'}
          assert after - before == expected and not before - after, 'inventory changed beyond the two executed tests'
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == {
              path, 'tests/test_delivery_journal_raw_writer.py'}
          PY
          python3 -m unittest tests.test_delivery_journal_raw_writer -v > evidence/caller-tests.txt 2>&1
          git diff --check
          git diff --stat
          git diff > evidence/repair.patch
          tail -5 evidence/caller-tests.txt
      - name: Export two blobs without modifying any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          result = {'base': '496d5d953ab0d2e5190f75a090197965ba8bc6e5', 'blobs': []}
          for path in ['scripts/lib_test_inventory_manifest.txt', 'tests/test_delivery_journal_raw_writer.py']:
              body = json.dumps({'content': pathlib.Path(path).read_text(encoding='utf-8'), 'encoding': 'utf-8'})
              response = subprocess.check_output(['gh', 'api', '--method', 'POST',
                  '/repos/itismyfield/AgentDesk/git/blobs', '--input', '-'], input=body, text=True)
              sha = json.loads(response)['sha']
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert sha == expected
              result['blobs'].append({'path': path, 'sha': sha})
          pathlib.Path('evidence/objects.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci5926-reviewed-repair
          path: evidence/
          retention-days: 3
