name: PR5927 receipt census
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-census.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '73fce0926f0248bda0558f42dec8008c20b61e58', persist-credentials: false}
      - name: Prepare and publish only two reviewed metadata blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,base64,hashlib,os
          p=pathlib.Path('scripts/check_durable_frontier_writer_call_sites.py')
          s=p.read_text()
          for name in ('record_current_pinned_delivery','record_pinned_delivery_metadata'):
              old='    "'+name+'": {'
              assert s.count(old)==1
              s=s.replace(old,old+'\n        "src/services/discord/session_relay_sink/delivery_frontier.rs": 1,')
          p.write_text(s)
          q=pathlib.Path('tests/test_durable_frontier_writer_call_sites.py');s=q.read_text()
          assert s.count('TOTAL_CALL_SITES = 48')==1
          s=s.replace('TOTAL_CALL_SITES = 48','TOTAL_CALL_SITES = 50')
          s=s.replace('directly pinned spellings for seven sites, reaching 48 sites over 29 symbols.', 'directly pinned spellings for seven sites. The cancelled-source sink adds two\n# reviewed pinned receipt/metadata sites, reaching 50 sites over 29 symbols.')
          q.write_text(s)
          entries=[];out=pathlib.Path(os.environ['RUNNER_TEMP'],'pins');out.mkdir()
          for p in (p,q):
              data=p.read_bytes();dest=out/p.name;dest.write_bytes(data)
              obj=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/itismyfield/AgentDesk/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()))
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert obj['sha']==sha
              entries.append({'path':str(p),'mode':'100644','type':'blob','sha':sha})
          (out/'entries.json').write_text(json.dumps(entries,indent=2))
          (out/'census.patch').write_bytes(subprocess.check_output(['git','diff','--',str(p),'scripts/check_durable_frontier_writer_call_sites.py']))
          subprocess.run(['git','diff','--check'],check=True)
          print(json.dumps(entries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr5927-receipt-census
          path: ${{ runner.temp }}/pins
          retention-days: 2
