name: PR5927 final script diagnostics
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-final-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture the actual failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/itismyfield/AgentDesk/actions/jobs/104246141545/logs > "$RUNNER_TEMP/scripts.log"
          tail -160 "$RUNNER_TEMP/scripts.log" > "$RUNNER_TEMP/tail.txt"
          python3 - <<'PY'
          import os,pathlib,re
          s=pathlib.Path(os.environ['RUNNER_TEMP'],'scripts.log').read_text(encoding='utf-8-sig')
          lines=s.splitlines()
          indices=[i for i,line in enumerate(lines) if '##[error]' in line or 'FAIL:' in line or 'FAIL ' in line or 'Error:' in line]
          chosen=set()
          for i in indices[-10:]: chosen.update(range(max(0,i-18),min(len(lines),i+5)))
          out='\n'.join(lines[i] for i in sorted(chosen))
          pathlib.Path(os.environ['RUNNER_TEMP'],'failure.txt').write_text(out)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr5927-final-script-diagnostics
          path: |
            ${{ runner.temp }}/scripts.log
            ${{ runner.temp }}/tail.txt
            ${{ runner.temp }}/failure.txt
          retention-days: 2
