name: PR5927 final script diagnostics
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-final-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture failed PostgreSQL job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/itismyfield/AgentDesk/actions/jobs/104246141614/logs > "$RUNNER_TEMP/postgres.log"
          python3 - <<'PY'
          import os,pathlib
          s=pathlib.Path(os.environ['RUNNER_TEMP'],'postgres.log').read_text(encoding='utf-8-sig')
          lines=s.splitlines()
          indices=[i for i,line in enumerate(lines) if '##[error]' in line or 'FAILED' in line or 'panicked' in line or 'failures:' in line]
          chosen=set()
          for i in indices[-15:]: chosen.update(range(max(0,i-12),min(len(lines),i+12)))
          out='\n'.join(lines[i] for i in sorted(chosen))
          pathlib.Path(os.environ['RUNNER_TEMP'],'failure.txt').write_text(out)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr5927-final-pg-diagnostics
          path: |
            ${{ runner.temp }}/postgres.log
            ${{ runner.temp }}/failure.txt
          retention-days: 2
