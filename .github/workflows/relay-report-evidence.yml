name: Relay report evidence

on:
  pull_request:
    paths:
      - 'scripts/relay_authority_rollout_report.py'
      - 'tests/test_relay_authority*report*.py'
      - '.github/workflows/relay-report-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/relay_authority_rollout_report.py'
      - 'tests/test_relay_authority*report*.py'
      - '.github/workflows/relay-report-evidence.yml'

permissions:
  contents: read

concurrency:
  group: relay-report-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Replay and counter evidence regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test the real report
        run: |
          python3 -m py_compile scripts/relay_authority_rollout_report.py
          python3 -m unittest tests.test_relay_authority_rollout_report tests.test_relay_authority_report_evidence -v
