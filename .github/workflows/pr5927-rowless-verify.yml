name: PR5927 rowless verification
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-rowless-verify.yml', '.github/rowless-*.py']
permissions:
  contents: write
  actions: read
concurrency:
  group: pr5927-rowless-candidate
  cancel-in-progress: true
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.94.1', components: 'rustfmt,clippy'}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with: {cache-targets: false, cache-bin: false, shared-key: cargo-dependencies-v2, save-if: false}
      - name: Prepare exact candidate
        run: |
          set -euo pipefail
          cp .github/rowless-fix.py "$RUNNER_TEMP/repair.py"
          cp .github/rowless-followup.py "$RUNNER_TEMP/followup.py"
          cp .github/rowless-sink.py "$RUNNER_TEMP/sink.py"
          git checkout --detach 73fce0926f0248bda0558f42dec8008c20b61e58
          python3 "$RUNNER_TEMP/repair.py"
          python3 "$RUNNER_TEMP/followup.py"
          python3 "$RUNNER_TEMP/sink.py"
          cargo fmt --all
          git add src/services/discord scripts/audit_maintainability_giant_baseline.toml scripts/lib_test_inventory_manifest.txt
          git diff --exit-code
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/evidence"
          git diff --cached > "$RUNNER_TEMP/evidence/candidate.patch"
          git diff --cached --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/evidence/changed-source.tar.gz"
          git write-tree > "$RUNNER_TEMP/evidence/tree.txt"
      - name: Publish content-addressed blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,subprocess,pathlib,hashlib
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==16, paths
          entries=[]
          for p in paths:
              assert p.startswith(('src/services/discord/','scripts/')),p
              data=pathlib.Path(p).read_bytes()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/itismyfield/AgentDesk/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()))
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert result['sha']==expected
              entries.append({'path':p,'mode':'100644','type':'blob','sha':expected})
          pathlib.Path(os.environ['RUNNER_TEMP'],'evidence','entries.json').write_text(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-rowless-candidate
          path: ${{ runner.temp }}/evidence
          retention-days: 2
      - name: Native regressions
        run: |
          set -euo pipefail
          cargo test --lib native_collector_tests -- --nocapture > "$RUNNER_TEMP/native.log" 2>&1 || { tail -160 "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F '7 passed; 0 failed' "$RUNNER_TEMP/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-native-immediate
          path: ${{ runner.temp }}/native.log
          retention-days: 2
      - name: Original sweep regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for target in site_a_emits_one_detailed_record_for_counter_read_failure relay_deliver_preserves_tail_anchor_and_observes_persisted_proof; do
            cargo test --lib "$target" -- --nocapture >> "$RUNNER_TEMP/failures.log" 2>&1 || { tail -120 "$RUNNER_TEMP/failures.log"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-rowless-test-results
          path: |
            ${{ runner.temp }}/native.log
            ${{ runner.temp }}/failures.log
          retention-days: 2
