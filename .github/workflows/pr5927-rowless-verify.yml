name: PR5927 rowless verification
on:
  push:
    branches: [review/pr5927-rowless-20260915]
permissions:
  contents: read
  actions: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.94.1', components: rustfmt}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with: {cache-targets: false, cache-bin: false, shared-key: cargo-dependencies-v2, save-if: false}
      - name: Export immutable investigation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence/base" "$RUNNER_TEMP/evidence/head"
          git show 23eb9bba132ad71f0336645705ab8597a59d1c1c:scripts/audit_maintainability_giant_baseline.toml > "$RUNNER_TEMP/evidence/base/audit_maintainability_giant_baseline.toml"
          git show 23eb9bba132ad71f0336645705ab8597a59d1c1c:src/services/discord/tmux_watcher.rs > "$RUNNER_TEMP/evidence/base/tmux_watcher.rs"
          git show 23eb9bba132ad71f0336645705ab8597a59d1c1c:src/services/discord/tmux_watcher/turn_stream_collector.rs > "$RUNNER_TEMP/evidence/base/turn_stream_collector.rs"
          git show 73fce0926f0248bda0558f42dec8008c20b61e58:scripts/destructive_call_site_baseline.json > "$RUNNER_TEMP/evidence/head/destructive_call_site_baseline.json"
          git show 73fce0926f0248bda0558f42dec8008c20b61e58:scripts/test_only_module_skip_pin.py > "$RUNNER_TEMP/evidence/head/test_only_module_skip_pin.py"
          gh api repos/itismyfield/AgentDesk/actions/jobs/104226626929/logs > "$RUNNER_TEMP/evidence/library-sweep.log"
          cp "$(rustup which rustfmt)" "$RUNNER_TEMP/evidence/rustfmt"
          ldd "$(rustup which rustfmt)" > "$RUNNER_TEMP/evidence/rustfmt-libraries.txt" || true
          git diff 23eb9bba132ad71f0336645705ab8597a59d1c1c 73fce0926f0248bda0558f42dec8008c20b61e58 > "$RUNNER_TEMP/evidence/original-pr.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: pr5927-investigation
          path: ${{ runner.temp }}/evidence
          retention-days: 2
      - name: Exact original native regressions
        run: |
          set -euo pipefail
          git checkout --detach 73fce0926f0248bda0558f42dec8008c20b61e58
          for trial in 1 2 3; do
            env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::tmux::tmux_watcher::streaming_status_tick::committed_progress_tests::native_collector_tests -- --nocapture > "$RUNNER_TEMP/native-$trial.log" 2>&1 || { tail -100 "$RUNNER_TEMP/native-$trial.log"; exit 1; }
            grep -F '4 passed; 0 failed' "$RUNNER_TEMP/native-$trial.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-original-native-runs
          path: ${{ runner.temp }}/native-*.log
          retention-days: 2
