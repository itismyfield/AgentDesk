name: CI Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      resource_diagnostics:
        description: Emit PostgreSQL lane memory samples every five seconds
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-main-${{ github.ref }}
  # Let the running main build finish so each merge can yield a green SHA for pinned deploys.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_WRITE
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  full_non_pg:
    # The whole non-PG library, adjudicated exactly as the PR `library_sweep`;
    # fmt/clippy/policy JS run in the separate `lint` job.
    name: Full tests (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      # The id filters miss PG-dependent tests that carry no pg substring, so the
      # sweep needs its own PostgreSQL and must fail rather than soft-skip.
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      # Test debuginfo pushes the lib test link past hosted-runner memory (exit 143).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Cache only cargo registry/git. `target/` is intentionally NOT cached
      # because sccache (GHA-backed) already caches compiled rustc output and
      # caching multi-GB `target/` directories starves the 10GB GHA cache
      # quota, causing constant LRU eviction of sccache shards (observed:
      # Rust hit-rate collapsed from 99.80% → 0.00% over a few hours of
      # merges). See PR description and docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Library sweep (selection-set gated)
        timeout-minutes: 45
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          python3 scripts/run_test_lane.py --lane non-pg-sweep --max-summaries 4 "${NON_PG_SKIP_ARGS[@]}" -- env -u AGENTDESK_ROOT_DIR cargo test --lib -- "${NON_PG_SKIP_ARGS[@]}"
          run_non_pg_filter_replay

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  lint:
    # The rest of `just check`: fmt, clippy (covers `cargo check`), policy JS, and
    # the non-lib `test-non-pg` lines. The env matches the PR `Lint runner`.
    name: Main lint and non-lib tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_non_pg` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy JS unit tests
        run: npm run test:policies

      - name: just fmt-check
        run: just fmt-check

      # Workspace clippy can exhaust hosted-runner memory; swap pages it instead of killing the runner.
      - name: Ensure swap for clippy
        uses: ./.github/actions/ensure-swap

      - name: just lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/clippy-observation
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -W clippy::all | tee target/clippy-observation/diagnostics.jsonl
          if ! python3 scripts/check_clippy_warning_count.py --input target/clippy-observation/diagnostics.jsonl --output target/clippy-observation/report.json; then
            echo '::warning::Clippy observation invalid; no warning baseline can be derived'
          fi

      - name: Upload Clippy observation
        uses: actions/upload-artifact@v4
        with:
          name: clippy-observation-${{ github.sha }}
          path: target/clippy-observation/
          if-no-files-found: error

      # The library sweep covers the lib side of the `--all-targets` filters; this
      # runs their non-lib side and the ClaudeBinary compile-fail doctests.
      - name: Non-lib tests and doctests
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          cargo test --bins --test '*' transition -- "${NON_PG_SKIP_ARGS[@]}" --test-threads=1
          cargo test --bins --test '*' auto_queue -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' cancel -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' review_decision -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' stall_recovery -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' routines -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test invariant --bins --test '*' -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --doc ClaudeBinary

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  postgres:
    name: PostgreSQL tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard runs one generated part of the PG selection on its own database;
    # the run stays green only if both shards succeed.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PG_INCLUDE_SHARD: ${{ matrix.shard }}
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See ci-main.yml `full_non_pg` for rationale: `target/` excluded so the
      # GHA cache quota is not starved out from under sccache.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: PostgreSQL lane resource diagnostics
        if: ${{ inputs.resource_diagnostics == true }}
        run: |
          resource_sample() {
            while true; do
              printf 'PG_RESOURCE_SAMPLE '
              date --iso-8601=seconds
              free -m | awk '/Mem:/ { printf "mem_total_mib=%s mem_used_mib=%s mem_available_mib=%s ", $2, $3, $7 }'
              docker stats --no-stream --format 'pg_mem={{.MemUsage}}' agentdesk-postgres || true
              sleep 5
            done
          }
          # No PID handoff: a later step runs in a different shell, so it cannot
          # `wait` on this sampler. The hosted VM reclaims it when the job ends.
          resource_sample > "$RUNNER_TEMP/pg-resource-samples.log" 2>&1 &

      - name: just test-postgres-shard
        # Same budget as ci-pr.yml; main hit 30 min at 25–27 min typical runtime.
        timeout-minutes: 40
        run: just test-postgres-shard
        env:
          # #4245: see Full tests lane — keep test debuginfo off so the build
          # and serial PostgreSQL suite retain headroom in the bounded step.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: Show PostgreSQL lane resource diagnostics
        if: always() && inputs.resource_diagnostics == true
        run: cat "$RUNNER_TEMP/pg-resource-samples.log" || true

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  high-risk-recovery:
    name: High-risk recovery (main)
    # Unconditional, unlike ci-pr.yml: the main library sweep skips
    # `high_risk_recovery`, so this lane is main's only runner for those tests.
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      # Full test debuginfo pushes the lib test link past the hosted runner's memory.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See ci-main.yml `full_non_pg` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: High-risk recovery lane
        run: "cargo test --lib high_risk_recovery:: -- --test-threads=1"

      # Serial runs of the watchdog forensics guards; the parallel library sweep
      # in `full_non_pg` also runs them.
      - name: Watchdog hang-forensics guards
        run: |
          cargo test --lib services::hang_forensics::tests -- --test-threads=1
          cargo test --lib services::health_diagnostics::tests -- --test-threads=1

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  scripts:
    # Distinct from the protected PR `Script checks` context. Main-push CI
    # cannot enforce pre-merge anti-growth after a commit has already landed.
    # Each job runs one ci-script-checks.sh shard, as in ci-pr.yml; only this
    # cargo shard provisions Rust and uploads the shard's evidence artifacts.
    name: Main script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --verify-lib-inventory invokes `cargo test --lib -- --list`; keep the
      # main-push aggregate job on the pinned Rust toolchain and shared cache.
      - name: Install Rust toolchain for lib inventory
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache for lib inventory
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies for lib inventory
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # See the matching step in ci-pr.yml: the PyYAML oracle in
      # `tests/test_check_pg_test_lane_membership.py` is not available on the
      # clean setup-python interpreter and must be installed explicitly.
      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          # Main-push CI verifies current coverage drift, but relative anti-growth
          # authority lives in the protected PR candidate's required context.
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: cargo
      - name: Upload giant-file progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: target/giant-file-progress/evidence.json

      - name: Upload maintainability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-audit-main
          path: target/maintainability-audit.yaml
          if-no-files-found: ignore
          retention-days: 14

  scripts_guards:
    name: Main script checks (guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: guards

  scripts_contracts:
    name: Main script checks (contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: contracts

  # Warms the shared cargo registry cache and the Windows sccache entries that
  # the ci-pr.yml `check_fast_cross_os*` jobs restore; main never ran Windows.
  windows_cache_warm:
    name: Windows cache warm (windows-latest)
    runs-on: windows-latest
    # Advisory: deploys pin on a green CI Main run, so a warm miss must not fail it.
    continue-on-error: true
    timeout-minutes: 60
    env:
      # rust-cache and sccache both hash CARGO_* env; keep the PR Windows job env.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Provision Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same compile as the PR `cargo check` job.
      - name: cargo check
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo check --workspace --all-targets

      # Builds the lib test binary the PR exact-targets runner filters; runs nothing.
      - name: Build lib test binary
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --lib --no-run

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
