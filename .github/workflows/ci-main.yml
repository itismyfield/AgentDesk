name: CI Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      resource_diagnostics:
        description: Emit PostgreSQL lane memory samples every five seconds
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_WRITE
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      high_risk_recovery: ${{ steps.filter.outputs.high_risk_recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            high_risk_recovery:
              - '.github/workflows/**'
              # #5147: mirrors ci-pr.yml. `[profile.release]` is guarded by a
              # test in this lane, so the manifest that test reads has to be
              # able to trigger it here too -- otherwise the guard is absent
              # from main entirely, which is the #5185 class of defect.
              #
              # NO-OP, same as in ci-pr.yml: the
              # `'!src/services/discord/placeholder_live_events/**'` line below
              # already makes this filter effectively always true, because
              # dorny/paths-filter@v3 ORs one picomatch matcher per pattern and
              # a leading `!` is just a matcher for "anything that is not
              # this". These patterns run nothing new; they record which files
              # the lane guards, and become load-bearing once that `!` line is
              # fixed (a separate change -- narrowing the filter would silently
              # stop running whatever relies on it being always-true).
              - 'Cargo.toml'
              - 'policies/auto-queue.js'
              - 'policies/kanban-rules.js'
              - 'policies/timeouts.js'
              - 'policies/timeouts/**'
              - 'policies/lib/**'
              - 'policies/__tests__/**'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/high_risk_recovery.rs'
              - 'src/kanban/**'
              - 'src/reconcile.rs'
              - 'src/server/routes/auto_queue.rs'
              - 'src/server/routes/dispatched_sessions.rs'
              - 'src/server/routes/dispatches/**'
              - 'src/server/routes/scheduled_messages.rs'
              - 'src/server/worker_registry.rs'
              - 'src/services/auto_queue.rs'
              - 'src/services/auto_queue/**'
              - 'src/services/scheduled_messages.rs'
              - 'src/services/discord/**'
              - '!src/services/discord/placeholder_live_events/**'
              # #5147: see ci-pr.yml. Inert today -- see the `!` note above.
              - 'src/cli/dcserver.rs'
              - 'src/services/hang_forensics.rs'
              - 'src/services/health_diagnostics.rs'
              - 'src/services/message_outbox.rs'
              - 'src/services/platform/tmux.rs'
              - 'src/services/tmux_common.rs'

  full_non_pg:
    name: Full tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Cache only cargo registry/git. `target/` is intentionally NOT cached
      # because sccache (GHA-backed) already caches compiled rustc output and
      # caching multi-GB `target/` directories starves the 10GB GHA cache
      # quota, causing constant LRU eviction of sccache shards (observed:
      # Rust hit-rate collapsed from 99.80% → 0.00% over a few hours of
      # merges). See PR description and docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Policy JS unit tests
        run: npm run test:policies

      # `just check` wraps fmt, staged clippy, cargo check, and the targeted
      # non-PG subset. PR CI runs only the compile/policy portion to keep its
      # critical path short; this main-push lane retains the test coverage.
      # The same non-PG filters apply to every cargo test command since this
      # lane has no Postgres service. PR #1306 (#1237) made production routes
      # PG-only, so an `--all-targets` non-PG sweep panics in 169 SQLite-fixture
      # tests that haven't been ported to PG fixtures yet. The PG migration is
      # tracked under #1238; once the bulk of the migration lands, this
      # lane can broaden again.
      - name: just check
        run: just check
        env:
          RUST_BACKTRACE: 1
          # #4245: both main test lanes die with SIGTERM (exit 143) during the
          # `--all-targets` test build/link phase — hosted-runner memory kill.
          # Strip debuginfo from test builds to cut link memory/time; symbol-less
          # backtraces are an accepted CI trade-off.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See ci-main.yml `full_non_pg` for rationale: `target/` excluded so the
      # GHA cache quota is not starved out from under sccache.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: PostgreSQL lane resource diagnostics
        if: ${{ inputs.resource_diagnostics == true }}
        run: |
          resource_sample() {
            while true; do
              printf 'PG_RESOURCE_SAMPLE '
              date --iso-8601=seconds
              free -m | awk '/Mem:/ { printf "mem_total_mib=%s mem_used_mib=%s mem_available_mib=%s ", $2, $3, $7 }'
              docker stats --no-stream --format 'pg_mem={{.MemUsage}}' agentdesk-postgres || true
              sleep 5
            done
          }
          # No PID handoff: a later step runs in a different shell, so it cannot
          # `wait` on this sampler. The hosted VM reclaims it when the job ends.
          resource_sample > "$RUNNER_TEMP/pg-resource-samples.log" 2>&1 &

      - name: just test-postgres
        timeout-minutes: 20
        run: just test-postgres
        env:
          # #4245: see Full tests lane — keep test debuginfo off so the build
          # and serial PostgreSQL suite retain headroom in the bounded step.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: Show PostgreSQL lane resource diagnostics
        if: always() && inputs.resource_diagnostics == true
        run: cat "$RUNNER_TEMP/pg-resource-samples.log" || true

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  high-risk-recovery:
    name: High-risk recovery
    needs: changes
    if: needs.changes.outputs.high_risk_recovery == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See ci-main.yml `full_non_pg` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: High-risk recovery lane
        run: "cargo test --lib high_risk_recovery:: -- --test-threads=1"

      # #5147: the self-watchdog forensics guards. Adding them to the path
      # filter alone would have changed nothing on main -- this job ran exactly
      # one target, so the filter had no test to select. `just check` does not
      # reach these either; `test-non-pg` is a curated list, not a lib sweep.
      - name: Watchdog hang-forensics guards
        run: |
          cargo test --lib services::hang_forensics::tests -- --test-threads=1
          cargo test --lib services::health_diagnostics::tests -- --test-threads=1

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  scripts:
    # Distinct from the protected PR `Script checks` context. Main-push CI
    # cannot enforce pre-merge anti-growth after a commit has already landed.
    name: Main script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --verify-lib-inventory invokes `cargo test --lib -- --list`; keep the
      # main-push aggregate job on the pinned Rust toolchain and shared cache.
      - name: Install Rust toolchain for lib inventory
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache for lib inventory
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies for lib inventory
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # See the matching step in ci-pr.yml: the PyYAML oracle in
      # `tests/test_check_pg_test_lane_membership.py` is not available on the
      # clean setup-python interpreter and must be installed explicitly.
      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          # Main-push CI verifies current coverage drift, but relative anti-growth
          # authority lives in the protected PR candidate's required context.
          TEST_LANE_BASELINE_REF: HEAD

      - name: Upload maintainability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-audit-main
          path: target/maintainability-audit.yaml
          if-no-files-found: ignore
          retention-days: 14
