name: CI Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  # Let the running main build finish so each merge can yield a green SHA for pinned deploys.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_WRITE
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  # The same nextest build, workers and audit as ci-pr.yml; hardening keeps the jobs equal.
  rust_build:
    name: Rust tests build and plan
    runs-on: ubuntu-latest
    # Timeout, permissions and checkout depth match ci-pr.yml, whose base comparison needs them.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap
      - name: Check Rust test source wiring
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: python3 scripts/ci/rust_test_sources.py check
      - name: Archive, list, compare and plan
        timeout-minutes: 45
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          mkdir -p "$NEXTEST_DIR"
          cargo nextest archive --lib --archive-file "$NEXTEST_DIR/lib-tests.tar.zst"
          cargo nextest list --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --ignore-default-filter --message-format json > "$NEXTEST_DIR/universe.json"
          python3 scripts/check_relay_authority_contract.py --nextest-list "$NEXTEST_DIR/universe.json"
          python3 scripts/ci/rust_test_sources.py compare --platform linux --list "$NEXTEST_DIR/universe.json" \
            --json-out "$NEXTEST_DIR/compare.json"
          python3 scripts/ci/nextest_ci.py plan --universe "$NEXTEST_DIR/universe.json" \
            --archive "$NEXTEST_DIR/lib-tests.tar.zst" --workers 6 --sha "$GITHUB_SHA" --scope linux-lib \
            --rust-version 1.94.1 --nextest-version "$(cargo nextest --version | awk 'NR==1 {print $2}')" \
            --target x86_64-unknown-linux-gnu --build-option CARGO_PROFILE_DEV_DEBUG=0 \
            --build-option CARGO_PROFILE_TEST_DEBUG=0 --output "$NEXTEST_DIR/plan"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$NEXTEST_DIR/plan/plan.json"
      - name: Upload nextest plan
        uses: actions/upload-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
          if-no-files-found: error
          retention-days: 1
      # Pull requests compare their plan with this one; the plan alone carries IDs, scope and build identity.
      - name: Upload nextest baseline
        uses: actions/upload-artifact@v4
        with:
          name: nextest-baseline
          path: ${{ runner.temp }}/nextest/plan/plan.json
          if-no-files-found: error
          retention-days: 14

  # Every worker runs its planned exact IDs once, serially, against its own PostgreSQL server.
  rust_tests:
    name: Rust tests (worker ${{ matrix.worker }})
    needs: rust_build
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5]
    env:
      RUST_BACKTRACE: 1
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start
      # Rollback rehearsal executes the runbook's literal rg command.
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Require ripgrep
        run: rg --version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Verify archive and plan
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: >-
          python3 scripts/ci/nextest_ci.py verify-archive --plan "$RUNNER_TEMP/nextest/plan/plan.json"
          --worker ${{ matrix.worker }} --archive "$RUNNER_TEMP/nextest/lib-tests.tar.zst"
          --config "$RUNNER_TEMP/nextest/plan/worker-${{ matrix.worker }}.toml" --sha "$GITHUB_SHA"
          --record "$RUNNER_TEMP/nextest-result"
      - name: Run planned tests
        timeout-minutes: 60
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set +e
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          RESULT_DIR="$RUNNER_TEMP/nextest-result"
          mkdir -p "$RUNNER_TEMP/nextest-extract"
          cargo nextest run --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --extract-to "$RUNNER_TEMP/nextest-extract" --extract-overwrite \
            --config-file "$NEXTEST_DIR/plan/worker-${{ matrix.worker }}.toml" --profile ci --no-tests fail
          code=$?
          echo "$code" > "$RESULT_DIR/exit-code"
          junit="$(find "$RUNNER_TEMP/nextest-extract" "$GITHUB_WORKSPACE/target" -path '*/nextest/ci/junit.xml' 2>/dev/null | head -n 1)"
          [ -n "$junit" ] && cp "$junit" "$RESULT_DIR/junit.xml"
          exit "$code"
      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop
      # The attempt is part of the name so a rerun never reads an older attempt's results.
      - name: Upload worker results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: nextest-worker-${{ matrix.worker }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-result
          if-no-files-found: warn
          retention-days: 7

  # Planned == executed per worker, retry policy, and the targeted selectors; any gap is red.
  test_evidence:
    name: Rust tests evidence
    needs: [rust_build, rust_tests]
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Download worker results
        uses: actions/download-artifact@v4
        with:
          pattern: nextest-worker-*
          path: ${{ runner.temp }}/nextest-artifacts
      - name: Audit worker results
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/nextest/plan/plan.json"
          python3 scripts/ci/nextest_ci.py collect-results --plan "$plan" --artifacts "$RUNNER_TEMP/nextest-artifacts" \
            --output "$RUNNER_TEMP/nextest-results"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$plan"
          status=0
          python3 scripts/ci/nextest_ci.py audit --plan "$plan" --results "$RUNNER_TEMP/nextest-results" \
            --json-out "$RUNNER_TEMP/verdict.json" --summary-out "$RUNNER_TEMP/summary.md" || status=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    # The rest of `just check`: fmt, clippy (covers `cargo check`), policy JS, and
    # the non-lib `test-non-pg` lines. The env matches the PR `Lint runner`.
    name: Main lint and non-lib tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is not cached: sccache holds compiled output (docs/ci/sccache-setup.md §4.2).
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy JS unit tests
        run: npm run test:policies

      - name: just fmt-check
        run: just fmt-check

      # Workspace clippy can exhaust hosted-runner memory; swap pages it instead of killing the runner.
      - name: Ensure swap for clippy
        uses: ./.github/actions/ensure-swap

      - name: just lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/clippy-observation
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -W clippy::all | tee target/clippy-observation/diagnostics.jsonl
          python3 scripts/check_clippy_warning_count.py --input target/clippy-observation/diagnostics.jsonl --output target/clippy-observation/report.json --baseline scripts/clippy_warning_baseline.json --base-ref HEAD^1

      - name: Upload Clippy observation
        uses: actions/upload-artifact@v4
        with:
          name: clippy-observation-${{ github.sha }}
          path: target/clippy-observation/
          if-no-files-found: error

      # The nextest workers run every lib test; this runs the non-lib side of the
      # `--all-targets` filters and the ClaudeBinary compile-fail doctests.
      - name: Non-lib tests and doctests
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          cargo test --bins --test '*' transition -- "${NON_PG_SKIP_ARGS[@]}" --test-threads=1
          cargo test --bins --test '*' auto_queue -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' cancel -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' review_decision -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' stall_recovery -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --bins --test '*' routines -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test invariant --bins --test '*' -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --doc ClaudeBinary

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  scripts:
    # Distinct from the protected PR `Script checks` context. Main-push CI
    # cannot enforce pre-merge anti-growth after a commit has already landed.
    # Each job runs one ci-script-checks.sh shard, as in ci-pr.yml; only this
    # cargo shard provisions Rust and uploads the shard's evidence artifacts.
    name: Main script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --verify-lib-inventory invokes `cargo test --lib -- --list`; keep the
      # main-push aggregate job on the pinned Rust toolchain and shared cache.
      - name: Install Rust toolchain for lib inventory
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache for lib inventory
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies for lib inventory
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # See the matching step in ci-pr.yml: the PyYAML oracle in
      # `tests/test_check_pg_test_lane_membership.py` is not available on the
      # clean setup-python interpreter and must be installed explicitly.
      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REF: ${{ github.ref }}
          GFP_REF_PROTECTED: ${{ github.ref_protected }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          # Main-push CI verifies current coverage drift, but relative anti-growth
          # authority lives in the protected PR candidate's required context.
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: cargo
      - name: Upload giant-file progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: target/giant-file-progress/evidence.json

      - name: Upload maintainability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-audit-main
          path: target/maintainability-audit.yaml
          if-no-files-found: ignore
          retention-days: 14

  scripts_guards:
    name: Main script checks (guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REF: ${{ github.ref }}
          GFP_REF_PROTECTED: ${{ github.ref_protected }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: guards

  scripts_contracts:
    name: Main script checks (contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        run: ./scripts/ci-script-checks.sh
        env:
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REF: ${{ github.ref }}
          GFP_REF_PROTECTED: ${{ github.ref_protected }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          TEST_LANE_BASELINE_REF: HEAD
          SCRIPT_CHECK_SHARD: contracts

  # Warms the shared cargo registry cache and the Windows sccache entries that
  # the ci-pr.yml `check_fast_cross_os*` jobs restore; main never ran Windows.
  windows_cache_warm:
    name: Windows cache warm (windows-latest)
    runs-on: windows-latest
    # Advisory: deploys pin on a green CI Main run, so a warm miss must not fail it.
    continue-on-error: true
    # Step deadlines fail with a timeout log; reserve setup/post time to avoid job cancellation.
    timeout-minutes: 120
    env:
      # rust-cache and sccache both hash CARGO_* env; keep the PR Windows job env.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Provision Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same compile as the PR `cargo check` job.
      - name: cargo check
        timeout-minutes: 40
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo check --workspace --all-targets

      # Builds the lib test binary the PR exact-targets runner filters; runs nothing.
      - name: Build lib test binary
        timeout-minutes: 40
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --lib --no-run

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
