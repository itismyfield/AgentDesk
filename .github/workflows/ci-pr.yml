name: CI PR

on:
  # PR-only: no push/dispatch run may publish `Script checks`. The judge uses !cancelled(): on run cancel
  # it never starts or is cancelled; a timed-out upstream still judges red.
  pull_request:

concurrency:
  # A PR number is unique inside the base repository, unlike `head_ref`: two
  # forks can use the same source branch name and must never cancel each other.
  # Manual dispatch has no PR payload, so isolate it by the selected ref.
  group: ci-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push makes every result from the older SHA stale, so release its
  # hosted runners immediately. The required-context judge remains
  # fail-closed: cancellation may leave failed/cancelled contexts on the OLD
  # SHA, while branch protection still requires fresh green contexts on the
  # newest exact HEAD SHA. Manual cancellation of the newest run therefore
  # remains blocking until that exact SHA is rerun successfully.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  # Pull requests may restore default-branch sccache entries but never write
  # branch-local shards into the repository-wide 10GB cache budget.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      # Verified docs/comment-only changes suppress heavy Rust jobs; the judge
      # reads the same effective outputs so expected skips still publish green.
      comment_only: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && 'true' || 'false' }}
      high_risk_recovery: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && 'false' || steps.filter.outputs.high_risk_recovery }}
      rust_tests_skip: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && steps.comment_only.outputs.rust_tests_skip == 'true' && 'true' || 'false' }}
      rust_or_policy: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && steps.comment_only.outputs.rust_lint_skip == 'true' && 'false' || steps.filter.outputs.rust_or_policy }}
      # Include readers retain the compile and library lanes.
      rust_tests: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && steps.comment_only.outputs.rust_tests_skip == 'true' && 'false' || steps.filter.outputs.rust_or_policy }}
      rust_compile: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && steps.comment_only.outputs.rust_lint_skip == 'true' && 'false' || steps.filter.outputs.rust_compile }}
      # True when a relay-state-contract anchor file, the contract doc, or the
      # sync gate itself changed. Used to run the compile-existence half
      # (`lint`, whose clippy compiles the `relay_state_contract_refs` blocks)
      # even for doc-only contract changes (#4268).
      relay_contract: ${{ steps.filter.outputs.relay_contract }}
      # True when a Rust-compile change touches a source surface that needs
      # native Windows verification. Most relay-only PRs leave this false, but
      # the cross-platform inflight lock primitive is an explicit exception.
      # The judge permits unrelated-path skips and rejects unexpected skips.
      cross_os_rust: ${{ steps.comment_only.outcome == 'success' && steps.comment_only.outputs.comment_only == 'true' && 'false' || steps.filter.outputs.cross_os_rust }}
      win32_build_token: ${{ steps.filter.outputs.win32_build_token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            dashboard:
              - '.nvmrc'
              - 'dashboard/**'
              - 'scripts/check-dashboard-install-state.mjs'
              - 'scripts/check-dashboard-toolchain.sh'
              - 'scripts/install-dashboard-dependencies.sh'
              - 'scripts/verify-dashboard.sh'
            high_risk_recovery:
              - '.github/workflows/**'
              # #5147: this lane owns the self-watchdog's kill-time forensics,
              # and one of those tests asserts on `[profile.release]` -- it is
              # what stops `strip = true` (which erased the Mach-O symbol table
              # and stalled #4756/#4770/#5147) from coming back. A guard whose
              # own subject cannot trigger it is the #5185 defect, so the files
              # under guard are listed here alongside the tests.
              #
              # The `'!src/services/discord/placeholder_live_events/**'` line
              # that used to sit below `src/services/discord/**` is GONE, and
              # with it the accident that made this filter always true.
              # dorny/paths-filter@v3 is NOT GitHub's native `paths:` -- it
              # compiles every pattern into its own picomatch matcher
              # (`{dot: true}`) and ORs them (`matchers.some(...)`; no
              # `predicate-quantifier` is set here, so the default `some`
              # applies), so a leading `!` was just another POSITIVE matcher
              # for "anything that is not this" and matched nearly every
              # changed file. Nothing below subtracts, so this list IS the
              # whole selection rule: a path no pattern matches silently skips
              # the lane; it is deliberately a superset of what the lane runs.
              #
              # STOPPED selecting when the `!` went: docs, `dashboard/**`,
              # `tests/**`, src this lane never executes. ADDED below, because
              # dropping the `!` would otherwise drop a real input:
              # `migrations/**` (these tests call
              # `connect_test_pool_and_migrate`; `build.rs` already has
              # `rerun-if-changed` over `migrations/postgres`); `policies/**`
              # replacing three named `.js` files, because
              # `test_engine_with_pg` aims `config.policies.dir` here while
              # `engine/loader.rs` loads EVERY root-level `*.js`,
              # `check_policy_tree_trust` walks subdirectories and
              # `pipeline::ensure_loaded` reads `default-pipeline.yaml`; and
              # the two scripts this job's own steps run. `Cargo.toml` stays --
              # `hang_forensics.rs` `include_str!`s it for the
              # `[profile.release]` assertion above.
              # `tests/test_high_risk_recovery_path_filter.py` pins the result
              # and fails if any pattern here starts with `!` again.
              - 'Cargo.toml'
              - 'migrations/**'
              - 'policies/**'
              - 'scripts/check_test_target_integrity.py'
              - 'scripts/ci/postgres-service.sh'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/services/codex_tmux_wrapper.rs'
              - 'src/services/gemini.rs'
              - 'src/services/qwen.rs'
              - 'src/services/qwen_tmux_wrapper.rs'
              # Provider launch trees and session-host boundaries used by recovery.
              - 'src/services/claude.rs'
              - 'src/services/claude/**'
              - 'src/services/codex.rs'
              - 'src/services/codex/**'
              - 'src/services/qwen/**'
              - 'src/services/session_host.rs'
              - 'src/services/session_host/**'
              - 'src/services/opencode.rs'
              - 'src/services/provider.rs'
              - 'src/services/provider_runtime.rs'
              - 'src/services/provider/**'
              - 'src/services/process.rs'
              - 'src/services/process/**'
              - 'src/services/stream_json_cli/**'
              - 'src/high_risk_recovery.rs'
              - 'src/kanban/**'
              - 'src/reconcile.rs'
              - 'src/server/routes/auto_queue.rs'
              - 'src/server/routes/dispatched_sessions.rs'
              - 'src/server/routes/dispatches/**'
              - 'src/server/outbox_actionable_delivery.rs'
              - 'src/server/outbox_worker.rs'
              - 'src/server/outbox_worker/**'
              - 'src/server/routes/message_outbox.rs'
              - 'src/server/routes/scheduled_messages.rs'
              - 'src/server/routes/scheduled_messages/**'
              - 'src/server/worker_registry.rs'
              - 'src/server/mod.rs'
              - 'src/server/policy_tick_logging.rs'
              - 'src/services/auto_queue.rs'
              - 'src/services/auto_queue/**'
              - 'src/services/scheduled_messages.rs'
              - 'src/services/scheduled_messages/**'
              - 'src/services/discord/outbound/source_registry.rs'
              - 'src/services/discord/**'
              - 'src/services/tui_prompt_dedupe/**'
              - 'src/services/tui_o/**'
              # #5147: the forensics module, the health-path DB awaits it
              # brackets, and the boot site that starts the self-watchdog (and
              # with it the runtime beacon). Load-bearing now that the `!`
              # line above is gone -- see the note above.
              - 'src/cli/dcserver.rs'
              - 'src/services/hang_forensics.rs'
              - 'src/services/hang_forensics/**'
              - 'src/services/health_diagnostics.rs'
              - 'src/services/message_outbox.rs'
              - 'src/services/message_outbox/**'
              # #5232 R3: these five, and `outbound/source_registry.rs` above
              # (already covered by `src/services/discord/**`), match no target
              # among this job's 21 `cargo test --lib` invocations. They stay as
              # part of the deliberate superset -- not, as previously claimed,
              # because a ci-pr-only target shadows them.
              - 'src/services/message_outbox_recovery.rs'
              - 'src/services/message_outbox_recovery_support.rs'
              - 'src/services/message_outbox_recovery_tests.rs'
              - 'src/services/platform/tmux.rs'
              - 'src/services/tmux_common.rs'
              # #5232 R2: 1-hop imports this list missed -- `src/pipeline.rs`
              # reads the tracked `policies/**`, `Config::default` is in
              # `src/config.rs` (`include_str!`s `defaults.json`), and
              # `platform::git_head_commit` re-exports `src/services/git/**`.
              - 'defaults.json'
              - 'src/config.rs'
              - 'src/pipeline.rs'
              - 'src/services/dispatches/**'
              - 'src/services/git/**'
              - 'src/services/observability/**'
              - 'Cargo.lock'
              - '.cargo/**'
              # #5232 R3: 1-hop imports of the lane's OTHER two SUTs. The list
              # above only ever tracked `src/high_risk_recovery.rs`, but this
              # job also runs `services::hang_forensics::tests` and
              # `services::health_diagnostics::tests`, and the latter reaches
              # all four of these from its production path
              # (`health_diagnostics.rs:65,311,448,469`). `platform/mod.rs` is
              # the re-export `high_risk_recovery.rs:992` goes through, and its
              # own comment declares itself temporary.
              - 'src/config_live_reload.rs'
              - 'src/services/dispatch_gate.rs'
              - 'src/services/platform/mod.rs'
              - 'src/services/session_activity.rs'
            rust_or_policy:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'justfile'
              - 'policies/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'package-lock.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              # defaults.json is embedded into the Rust binary via
              # `include_str!("../defaults.json")` in src/config.rs.
              - 'defaults.json'
              # routines/** is enumerated and executed by the
              # `bundled_sample_routines_load_and_validate` Rust test
              # (src/services/routines/loader.rs); adding/removing/renaming
              # a routine script can break the asserted file list.
              - 'routines/**'
            # relay_contract: the doc<->code binding surface for the #4268
            # contract symbol-ref gate. When any of these change, the
            # compile-existence half (lint, whose clippy compiles the
            # `relay_state_contract_refs` blocks so a renamed/removed contract
            # symbol fails to compile) MUST run even for doc-only changes.
            # Mirrors REFERENCE_SOURCE_MODULES in scripts/check_contract_symbol_refs.py;
            # RelayContractPathFilterTest fails when the two sets differ.
              # Was only in the retired pg_db filter; keeps that path set inside rust_tests.
              - 'sqlx-data.json'
            relay_contract:
              - 'docs/relay-state-contract.md'
              - 'scripts/check_contract_symbol_refs.py'
              - 'tests/test_contract_symbol_refs.py'
              - 'src/services/discord/inflight/store.rs'
              - 'src/services/discord/turn_bridge/terminal_delivery.rs'
              - 'src/services/discord/tmux_watcher/liveness.rs'
              - 'src/services/discord/router/message_handler/watchdog.rs'
              - 'src/services/discord/mailbox_finish.rs'
              - 'src/services/discord/session_relay_sink.rs'
              - 'src/services/discord/formatting.rs'
              - 'src/services/discord/outbound/delivery_record.rs'
            # rust_compile is a narrower subset of rust_or_policy: only paths
            # whose change can plausibly alter Rust binary output (and therefore
            # require cross-OS verification on macOS/Windows). Pure JS policy,
            # shell script, most CI metadata, and Node package changes are
            # excluded — those are still verified by the ubuntu Rust lane plus
            # Lint/Script checks, and the nightly workflow continues to run
            # the full macOS/Windows matrix daily. ci-pr.yml itself is included
            # so edits to this Rust CI lane exercise its own Windows job.
            #
            # Must include every compile-time Rust input. Audit before adding
            # new `include_str!`/`include_bytes!`/`sqlx::migrate!`/`build.rs`
            # tracked paths.
            rust_compile:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sqlx-data.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              - '.github/workflows/ci-pr.yml'
              - 'scripts/ci/run-writer-namespace-windows-targets.sh'
              - 'scripts/exact_rust_test_proof.py'
              # defaults.json is embedded into the Rust binary via
              # `include_str!("../defaults.json")` in src/config.rs.
              - 'defaults.json'
              # routines/** is enumerated and executed by the
              # `bundled_sample_routines_load_and_validate` Rust test
              # (src/services/routines/loader.rs); a routine asset change
              # can fail the test on any OS.
              - 'routines/**'
            # cross_os_rust selects compile-affecting surfaces that require
            # native Windows verification. Most relay-only changes remain out
            # of this positive list and rely on the nightly matrix, but owners
            # of cross-platform primitives may be listed explicitly below.
            # When selected, the stable required-context judge makes this
            # PR-time Windows lane fail closed. Keep the broad positive list in
            # sync with `rust_compile` and document every relay exception.
            cross_os_rust:
              - 'scripts/ci/run-writer-namespace-windows-targets.sh'
              - 'scripts/exact_rust_test_proof.py'
              - 'src/*'
              - 'src/cli/**'
              - 'src/compat/**'
              - 'src/config/**'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/github/**'
              - 'src/kanban/**'
              - 'src/runtime_layout/**'
              - 'src/server/**'
              - 'src/supervisor/**'
              - 'src/ui/**'
              - 'src/utils/**'
              - 'src/voice/**'
              - 'src/services/*'
              - 'src/services/agent_quality/**'
              - 'src/services/agents/**'
              - 'src/services/analytics/**'
              - 'src/services/api_friction/**'
              - 'src/services/auto_queue/**'
              - 'src/services/automation_candidate_materializer/**'
              - 'src/services/claude/**'
              - 'src/services/claude_e/**'
              - 'src/services/claude_tui/**'
              - 'src/services/cluster/**'
              - 'src/services/codex_tui/**'
              - 'src/services/codex/**'
              - 'src/services/dispatched_sessions/**'
              - 'src/services/dispatches/**'
              # queue/ and the cancel lookup wire the forced Herdr cancel behind cfg(unix).
              - 'src/services/queue/**'
              - 'src/services/session_forwarding/cancel_lookup.rs'
              # qwen/ (like claude/ above) carries cfg(unix) shims, and
              # session_host/'s TmuxHost has a not(unix) stub Windows compiles.
              - 'src/services/qwen/**'
              - 'src/services/session_host/**'
              # The Herdr close owner is unix-gated production code.
              - 'src/services/termination_audit/**'
              - 'src/services/turn_summary_line/quota_tests.rs'
              # DERIVED BLOCK (#5832) -- do not hand-edit. cross_os_rust does
              # not select 'src/services/discord/**' wholesale, so every file in
              # that subtree that carries a platform cfg shim (or names a
              # unix-gated module) is selected here instead. #5828 broke the
              # required Windows lane from exactly one such file, and hand
              # enumeration is what left its 21 siblings unselected. Regenerate
              # with `python3 scripts/cross_os_consumer_paths.py --format globs`;
              # tests/test_fast_check_ci_wiring.py fails when a derived consumer
              # stops matching. Unix-only trees (tmux.rs and its tmux_watcher/
              # watchers subtrees) are deliberately absent -- Windows never
              # compiles them, so they cannot break the lane. This block also
              # covers the inflight std::fs::File advisory-lock owners and the
              # restart-v2 per-platform fs backend, listed by hand until now.
              - 'src/services/discord/admin_host_guard.rs'
              - 'src/services/discord/busy_followup_retry_store/**'
              - 'src/services/discord/catch_up/**'
              - 'src/services/discord/codex_absence.rs'
              - 'src/services/discord/codex_absence/**'
              - 'src/services/discord/commands/**'
              - 'src/services/discord/delivery_lease_cell.rs'
              - 'src/services/discord/destructive_cancel_gate.rs'
              - 'src/services/discord/e2e_control.rs'
              - 'src/services/discord/health.rs'
              - 'src/services/discord/health/**'
              - 'src/services/discord/host_defer_gate.rs'
              - 'src/services/discord/host_teardown_gate/**'
              - 'src/services/discord/idle_relay_drift.rs'
              - 'src/services/discord/inflight.rs'
              - 'src/services/discord/inflight/**'
              - 'src/services/discord/inject_disposition_test_support.rs'
              - 'src/services/discord/inject_disposition_tests.rs'
              - 'src/services/discord/jsonl_watcher.rs'
              - 'src/services/discord/live_bridge.rs'
              - 'src/services/discord/mailbox_probe.rs'
              - 'src/services/discord/meeting_orchestrator/**'
              - 'src/services/discord/mod.rs'
              - 'src/services/discord/model_catalog/**'
              - 'src/services/discord/outbound/**'
              - 'src/services/discord/placeholder_live_events/**'
              - 'src/services/discord/placeholder_sweeper/**'
              - 'src/services/discord/queue_dispatch.rs'
              - 'src/services/discord/queue_dispatch/**'
              - 'src/services/discord/queue_io.rs'
              - 'src/services/discord/queue_io/**'
              - 'src/services/discord/recovery_engine.rs'
              - 'src/services/discord/recovery_engine/**'
              - 'src/services/discord/recovery_paths/**'
              - 'src/services/discord/relay_coord.rs'
              - 'src/services/discord/relay_health.rs'
              - 'src/services/discord/relay_health/**'
              - 'src/services/discord/relay_recovery.rs'
              - 'src/services/discord/relay_recovery/**'
              - 'src/services/discord/relay_recovery_circuit_breaker.rs'
              - 'src/services/discord/replace_outcome_policy.rs'
              - 'src/services/discord/replay_policy.rs'
              - 'src/services/discord/restart_mode/**'
              - 'src/services/discord/router/**'
              - 'src/services/discord/runtime_bootstrap.rs'
              - 'src/services/discord/runtime_bootstrap/**'
              - 'src/services/discord/runtime_store.rs'
              - 'src/services/discord/session_idle_cleanup.rs'
              - 'src/services/discord/settings/**'
              - 'src/services/discord/task_notification_delivery/**'
              - 'src/services/discord/task_supervisor.rs'
              - 'src/services/discord/terminal_delivery_custody/**'
              - 'src/services/discord/terminal_ui_obligation.rs'
              - 'src/services/discord/tmux_watcher_registry.rs'
              - 'src/services/discord/tmux_watcher_registry/**'
              - 'src/services/discord/tmux_watcher_registry_restore_tests.rs'
              - 'src/services/discord/tui_direct_abort_marker/**'
              - 'src/services/discord/tui_direct_pending_start/**'
              - 'src/services/discord/tui_prompt_relay.rs'
              - 'src/services/discord/tui_prompt_relay/bridge_completion.rs'
              - 'src/services/discord/tui_prompt_relay/headless.rs'
              - 'src/services/discord/tui_prompt_relay/relay_ownership.rs'
              - 'src/services/discord/tui_prompt_relay/session_rotation_settle.rs'
              - 'src/services/discord/tui_prompt_relay/synthetic_start.rs'
              - 'src/services/discord/tui_prompt_relay/synthetic_start/**'
              - 'src/services/discord/tui_prompt_relay/tests.rs'
              - 'src/services/discord/tui_prompt_relay/tests/scenario_census_e2e.rs'
              - 'src/services/discord/turn_bridge/**'
              - 'src/services/discord/turn_end_summary.rs'
              - 'src/services/discord/turn_end_summary_tests.rs'
              - 'src/services/discord/turn_finalizer.rs'
              - 'src/services/discord/turn_finalizer/**'
              - 'src/services/discord/turn_lease.rs'
              - 'src/services/discord/turn_lease_tests.rs'
              - 'src/services/discord/turn_presence/activity.rs'
              - 'src/services/discord/turn_presence/activity/tail.rs'
              - 'src/services/discord/turn_presence/supervisor_tests.rs'
              - 'src/services/discord/voice_barge_in/**'
              - 'src/services/discord/zombie_foreground_release.rs'
              - 'src/services/git/**'
              # Cover Windows-compiled cfg consumers outside the relay tree;
              # the source-wide derivation test rejects newly uncovered owners.
              - 'src/services/herdr_launch/**'
              - 'src/services/kakao/**'
              - 'src/services/maintenance/**'
              - 'src/services/memory/**'
              - 'src/services/observability/**'
              - 'src/services/onboarding/**'
              - 'src/services/platform/**'
              - 'src/services/process/**'
              - 'src/services/provider/**'
              - 'src/services/provider_cli/**'
              - 'src/services/review_decision/**'
              - 'src/services/routines/**'
              - 'src/services/session_backend/**'
              - 'src/services/slo/**'
              - 'src/services/stream_json_cli/**'
              - 'src/services/tui_input/**'
              - 'src/services/tui_o/**'
              - 'src/services/tui_prompt_dedupe/**'
              - 'src/services/tui_turn_state/**'
              - 'src/services/turn_orchestrator/**'
              - 'tests/*'
              - 'tests/fixtures/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sqlx-data.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              - '.github/workflows/ci-pr.yml'
              - 'defaults.json'
              - 'routines/**'
            win32_build_token: ['scripts/build_token.py', 'scripts/build_token_win32.py', 'tests/test_build_token_win32_5663.py', '.github/workflows/ci-pr.yml']

      - name: Comment-only gate
        id: comment_only
        continue-on-error: true
        shell: bash
        env:
          BASH_ENV: /dev/null
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: python3 scripts/ci/comment_only_gate.py

  # The required `Dashboard (Node 22)` context is published by dashboard_required_context.
  dashboard:
    name: Dashboard (Node 22) runner
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: dashboard build/test
        run: ./scripts/verify-dashboard.sh

  # Cross-OS Rust compile lane. The required-context judge makes this
  # conditionally required when `cross_os_rust` is true; unrelated paths may
  # skip it. Nightly retains the broader macOS/Windows test matrix.
  check_fast_cross_os:
    # Keep this job name stable: the infrastructure-failure classifier and
    # the required-context judge identify it by this exact context string.
    name: Fast check + non-PG tests (${{ matrix.os }})
    needs: changes
    # Run only when `cross_os_rust` selects a native Windows source surface.
    # Most relay-only PRs still skip it, while the inflight lock primitive is
    # explicitly selected and enforced through the required-context judge.
    if: needs.changes.outputs.rust_compile == 'true' && needs.changes.outputs.cross_os_rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Cross-OS failures need compiler/test diagnostics, not native debug
      # symbols. Windows spends most of this lane compiling and linking test
      # harnesses; stripping debuginfo preserves every target and test while
      # reducing the critical path and peak linker memory.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        # macOS PR lane temporarily disabled to unblock issue throughput
        # (2026-05-17). Agents run on macOS locally and verify
        # `cargo build --bin agentdesk` before pushing, so PR-time macOS
        # coverage is largely redundant. Nightly (`ci-nightly.yml`) still
        # exercises macOS daily so cross-OS Rust drift cannot land
        # silently for more than 24h. Restore by adding `macos-latest`
        # back to this matrix once issue backlog stabilises.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Provision Python 3.11 (tomllib owner for check_test_target_integrity, a2a-C PR-1)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Disable sccache on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      - name: Install Opus on macOS
        if: runner.os == 'macOS'
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — sccache (GHA-backed) handles
      # compiled rustc output, and caching multi-GB `target/` directories
      # starves the 10GB GHA cache quota, evicting sccache shards (observed
      # Rust hit-rate collapse: 99.80% → 0.00% within hours of merges). See
      # docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Keep Windows inline and default-feature-only instead of `just check`.
      # This PR lane provides broad compile signal; the bounded writer namespace
      # owner runs in `check_fast_cross_os_targets`, and main-push and
      # nightly retain the Windows runtime and non-PG test coverage outside the
      # PR critical path (#4747 option 2). Ubuntu fmt/staged clippy and full
      # workspace checks remain authoritative in the jobs above.
      - name: cargo check
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo check --workspace --all-targets

      - name: sccache stats
        if: always() && runner.os != 'macOS'
        shell: bash
        run: sccache --show-stats || true

  # The writer namespace test build runs on its own Windows runner so it
  # overlaps `cargo check`; the required-context judge waits for both jobs.
  check_fast_cross_os_targets:
    name: Windows exact targets (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust_compile == 'true' && needs.changes.outputs.cross_os_rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Provision Python 3.11 (tomllib owner for check_test_target_integrity, a2a-C PR-1)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Disable sccache on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      - name: Install Opus on macOS
        if: runner.os == 'macOS'
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Writer namespace exact Windows targets
        if: runner.os == 'Windows'
        # Healthy runs took 24-46 min on 2026-10-15/16 and three PRs were cut at 45.
        timeout-minutes: 60
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: ./scripts/ci/run-writer-namespace-windows-targets.sh

      - name: sccache stats
        if: always() && runner.os != 'macOS'
        shell: bash
        run: sccache --show-stats || true

  win32_build_token:
    needs: changes
    if: needs.changes.outputs.win32_build_token == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - shell: pwsh
        run: git cat-file -e "HEAD:scripts/build_token_win32.py" && git cat-file -e "HEAD:tests/test_build_token_win32_5663.py" && python -m unittest -v tests.test_build_token_win32_5663

  # One nextest archive, one unfiltered list and one LPT plan for every worker of this SHA.
  rust_build:
    name: Rust tests build and plan
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap
      - name: Check Rust test source wiring
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: python3 scripts/ci/rust_test_sources.py check
      - name: Archive, list, compare and plan
        timeout-minutes: 45
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          mkdir -p "$NEXTEST_DIR"
          cargo nextest archive --lib --archive-file "$NEXTEST_DIR/lib-tests.tar.zst"
          cargo nextest list --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --ignore-default-filter --message-format json > "$NEXTEST_DIR/universe.json"
          python3 scripts/ci/rust_test_sources.py compare --platform linux --list "$NEXTEST_DIR/universe.json" \
            --json-out "$NEXTEST_DIR/compare.json"
          python3 scripts/ci/nextest_ci.py plan --universe "$NEXTEST_DIR/universe.json" \
            --archive "$NEXTEST_DIR/lib-tests.tar.zst" --workers 6 --sha "$GITHUB_SHA" --scope linux-lib \
            --rust-version 1.94.1 --nextest-version "$(cargo nextest --version | awk 'NR==1 {print $2}')" \
            --target x86_64-unknown-linux-gnu --build-option CARGO_PROFILE_DEV_DEBUG=0 \
            --build-option CARGO_PROFILE_TEST_DEBUG=0 --output "$NEXTEST_DIR/plan"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$NEXTEST_DIR/plan/plan.json"
      - name: Upload nextest plan
        uses: actions/upload-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
          if-no-files-found: error
          retention-days: 1

  # Every worker runs its planned exact IDs once, serially, against its own PostgreSQL server.
  rust_tests:
    name: Rust tests (worker ${{ matrix.worker }})
    needs: [changes, rust_build]
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5]
    env:
      RUST_BACKTRACE: 1
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start
      # Rollback rehearsal executes the runbook's literal rg command.
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Verify archive and plan
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: >-
          python3 scripts/ci/nextest_ci.py verify-archive --plan "$RUNNER_TEMP/nextest/plan/plan.json"
          --worker ${{ matrix.worker }} --archive "$RUNNER_TEMP/nextest/lib-tests.tar.zst"
          --config "$RUNNER_TEMP/nextest/plan/worker-${{ matrix.worker }}.toml" --sha "$GITHUB_SHA"
          --record "$RUNNER_TEMP/nextest-result"
      - name: Run planned tests
        timeout-minutes: 60
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set +e
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          RESULT_DIR="$RUNNER_TEMP/nextest-result"
          mkdir -p "$RUNNER_TEMP/nextest-extract"
          cargo nextest run --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --extract-to "$RUNNER_TEMP/nextest-extract" --extract-overwrite \
            --config-file "$NEXTEST_DIR/plan/worker-${{ matrix.worker }}.toml" --profile ci --no-tests fail
          code=$?
          echo "$code" > "$RESULT_DIR/exit-code"
          junit="$(find "$RUNNER_TEMP/nextest-extract" "$GITHUB_WORKSPACE/target" -path '*/nextest/ci/junit.xml' 2>/dev/null | head -n 1)"
          [ -n "$junit" ] && cp "$junit" "$RESULT_DIR/junit.xml"
          exit "$code"
      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop
      # The attempt is part of the name so a rerun never reads an older attempt's results.
      - name: Upload worker results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: nextest-worker-${{ matrix.worker }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-result
          if-no-files-found: warn
          retention-days: 7

  # Planned == executed per worker, retry policy, and the targeted selectors; any gap is red.
  test_evidence:
    name: Rust tests evidence
    needs: [changes, rust_build, rust_tests]
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Download worker results
        uses: actions/download-artifact@v4
        with:
          pattern: nextest-worker-*
          path: ${{ runner.temp }}/nextest-artifacts
      - name: Audit worker results
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/nextest/plan/plan.json"
          python3 scripts/ci/nextest_ci.py collect-results --plan "$plan" --artifacts "$RUNNER_TEMP/nextest-artifacts" \
            --output "$RUNNER_TEMP/nextest-results"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$plan"
          status=0
          python3 scripts/ci/nextest_ci.py audit --plan "$plan" --results "$RUNNER_TEMP/nextest-results" \
            --json-out "$RUNNER_TEMP/verdict.json" --summary-out "$RUNNER_TEMP/summary.md" || status=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The nine branch-protection names; each is N AND its own checks, judged by nextest_required.py.
  required_contexts:
    name: ${{ matrix.context }}
    needs:
      - changes
      - rust_build
      - rust_tests
      - test_evidence
      - lint
      - scripts
      - scripts_guards
      - scripts_contracts
      - dashboard
      - pg15_owner_proof
      - relay_authority_targets
      - relay_authority_mutations
      - check_fast_cross_os
      - check_fast_cross_os_targets
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        context:
          - Lint
          - Script checks
          - Fast check (ubuntu-latest)
          - High-risk recovery
          - Dashboard (Node 22)
          - Fast targeted tests (ubuntu-latest)
          - relay-authority-contract
          - Library test sweep (ubuntu-latest)
          - Fast check cross OS required context (ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
      # Script checks and relay-authority-contract also re-verify the CI structure from pinned gate bytes.
      - name: Verify pinned judge and CI structure
        if: ${{ matrix.context == 'Script checks' || matrix.context == 'relay-authority-contract' }}
        env:
          BASH_ENV: /dev/null
        shell: bash
        run: |
          pin() {
            actual="$(sha256sum "$1" | cut -d ' ' -f 1)"
            if [ "$actual" != "$2" ]; then
              echo "::error file=$1::content hash mismatch: expected $2, found $actual; review it and update every pin together"
              exit 1
            fi
          }
          pin scripts/ci/nextest_required.py 83895afcf0cdaafb3948277ffb9b85389cd65f12d15b51ae57a4aad5b5bd9d8e
          pin scripts/check-ci-runner-hardening.sh 3489b5976ce694f0974d2dbea4bffbd0f752de4d2d3dae7274fd4801cf92aa7a
          scripts/check-ci-runner-hardening.sh
          python3 scripts/check_writer_gate_ci_wiring.py
      - name: Judge required context
        env:
          BASH_ENV: /dev/null
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/nextest_ci.py required-context "${{ matrix.context }}"

  pg15_owner_proof:
    name: PostgreSQL 15 owner proof
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUST_BACKTRACE: 1
      POSTGRES_SERVICE_IMAGE: postgres:15
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Require PostgreSQL 15 server
        shell: bash
        run: |
          version="$(docker exec "${POSTGRES_SERVICE_CONTAINER:-agentdesk-postgres}" psql -U postgres -tAc 'SHOW server_version_num' | tr -d '[:space:]')"
          echo "server_version_num=${version}"
          case "$version" in
            15[0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::expected PostgreSQL 15, got '${version}'"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      # The ids file and this exact list must match; run_test_lane fails a missing, extra or unexecuted id.
      - name: PostgreSQL 15 exact owner proof
        timeout-minutes: 40
        shell: bash
        env:
          ADK_LIB_TEST_ARTIFACT: ${{ runner.temp }}/lib-test-artifact
          BASH_ENV: /dev/null
        run: >-
          python3 scripts/run_test_lane.py --lane pg --max-summaries 4
          --expected-ids scripts/ci/pg15_required_ids.txt --
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run --
          cargo test --lib -- --exact
          db::auto_queue::run_owner_guard_pg_tests::cancel_rereads_dispatch_claimed_mid_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::concurrent_phase_gate_saves_serialize_on_dispatch_row_pg
          db::auto_queue::run_owner_guard_pg_tests::force_pause_cleanup_waits_for_run_token_pg
          db::auto_queue::run_owner_guard_pg_tests::legacy_context_only_retry_cannot_escape_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::legacy_context_only_retry_waits_on_run_token_not_origin_row_pg
          db::auto_queue::run_owner_guard_pg_tests::phase_gate_context_create_refused_after_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::phase_gate_transfer_foreign_to_target_refused_after_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::phase_gate_transfer_target_to_foreign_serializes_with_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::rest_revival_refused_for_cancelled_owner_pg
          db::auto_queue::run_owner_guard_pg_tests::review_recovery_cas_rejects_direct_cancel_pg
          db::auto_queue::run_owner_guard_pg_tests::review_recovery_refuses_failed_dispatch_of_cancelled_run_pg
          db::auto_queue::run_owner_guard_pg_tests::review_recovery_waits_for_run_cancel_and_refuses_pg
          db::auto_queue::run_owner_guard_pg_tests::verdict_rollback_revival_refused_for_cancelled_owner_pg
          db::postgres::tests::postgres_json_extract_0058_up_and_down_preserve_array_path_behavior
          dispatch::dispatch_cancel::pg_observability_tests::cancel_run_lookup_ignores_malformed_legacy_context
          services::auto_queue::cancel_run::malformed_context_pg_tests::owner_context_extract_matrix_pg
          services::auto_queue::cancel_run::malformed_context_pg_tests::public_cancel_census_failure_rolls_back_pg
          services::auto_queue::cancel_run::malformed_context_pg_tests::public_cancel_counts_surviving_associated_dispatch_pg
          services::auto_queue::cancel_run::malformed_context_pg_tests::public_cancel_ignores_unrelated_malformed_context_pg
          services::auto_queue::cancel_run::malformed_context_pg_tests::public_end_ignores_unrelated_malformed_context_pg
          --test-threads=1

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

  lint:
    name: Lint runner
    needs: changes
    # Relay-contract changes, doc-only included, run this job too: its clippy
    # compile is the existence proof for the `relay_state_contract_refs` blocks.
    if: needs.changes.outputs.rust_or_policy == 'true' || needs.changes.outputs.relay_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — sccache (GHA-backed) handles
      # compiled rustc output, and caching multi-GB `target/` directories
      # starves the 10GB GHA cache quota, evicting sccache shards (observed
      # Rust hit-rate collapse: 99.80% → 0.00% within hours of merges). See
      # docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: just fmt-check
        run: just fmt-check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy JS unit tests
        run: npm run test:policies

      # Workspace clippy can exhaust hosted-runner memory; swap pages it instead of killing the runner.
      - name: Ensure swap for clippy
        uses: ./.github/actions/ensure-swap

      - name: just lint
        shell: bash
        env:
          CLIPPY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          mkdir -p target/clippy-observation
          cargo clippy --workspace --all-targets --all-features --message-format=json -- -W clippy::all | tee target/clippy-observation/diagnostics.jsonl
          python3 scripts/check_clippy_warning_count.py --input target/clippy-observation/diagnostics.jsonl --output target/clippy-observation/report.json --baseline scripts/clippy_warning_baseline.json --base-ref "$CLIPPY_BASE_REF"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  win32_build_token_required_context:
    name: Win32 build-token required context
    needs: [changes, win32_build_token]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {CHANGED_PATHS_RESULT: '${{ needs.changes.result }}', FILTER_NAME: win32_build_token, FILTER_OUTPUT: '${{ needs.changes.outputs.win32_build_token }}', UPSTREAM_JOB_NAME: win32_build_token, UPSTREAM_RESULT: '${{ needs.win32_build_token.result }}'}
        run: ./scripts/required-check-mirror.sh

  scripts:
    name: Script checks runner
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep Rust available for inventory fallback and the H2 module-map driver.
      - name: Install Rust toolchain for lib inventory
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustc-dev, llvm-tools  # tools/modmap-driver links rustc_private; Linux needs libLLVM from llvm-tools

      - name: Setup sccache for lib inventory
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies for lib inventory
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install PyYAML for independent workflow-shape test oracles.
      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Large file guard
        shell: bash
        run: |
          set -euo pipefail
          limit=$((10 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' path; do
            [ -f "$path" ] || continue
            size=$(git cat-file -s "HEAD:$path")
            if [ "$size" -gt "$limit" ]; then
              printf 'ERROR: tracked file exceeds 10 MiB: %s (%s bytes)\n' "$path" "$size"
              failed=1
            fi
          done < <(git ls-files -z)
          exit "$failed"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      # Check aggregate wiring independently so deleting an aggregate gate still fails.
      - name: Protect writer gate aggregate wiring (#5308)
        timeout-minutes: 10
        shell: bash
        run: |
          python3 scripts/check_writer_gate_ci_wiring.py
          python3 -m unittest tests.test_writer_gate_ci_wiring
          scripts/check-ci-runner-hardening.sh

      - name: Run script checks
        shell: bash
        run: ./scripts/ci-script-checks.sh
        env:
          ADK_LIB_TEST_ARTIFACT: ${{ runner.temp }}/lib-test-artifact
          # Keep the aggregate interpreter and non-interactive Bash startup
          # behavior explicit at the protected step boundary.
          BASH_ENV: /dev/null
          PYTHON: python3
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          GFP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GFP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Required Script checks only run on protected PR candidates. Their
          # synthetic merge first parent is the exact immutable base snapshot.
          TEST_LANE_BASELINE_REF: HEAD^1
          SCRIPT_CHECK_SHARD: cargo
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

      - name: Production PR cap
        shell: bash
        run: bash scripts/pr_cap_check.sh
        env:
          PR_CAP_CI: "1"
          PR_CAP_MODE: ${{ vars.PR_CAP_MODE || 'enforce' }}
          BASH_ENV: /dev/null

      - name: Upload giant-file progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: target/giant-file-progress/evidence.json

      # Keep high-value relay ratchets as explicit named steps as well as in the
      # aggregate script suite so their failure surface is immediately visible.
      - name: Hotfile LOC ratchet (always, #3565)
        run: python3 scripts/check_hotfile_ratchet.py

      - name: Inflight blind-save ratchet (always, #4259)
        run: python3 scripts/check_inflight_blind_save_ratchet.py

      # Verify documented contract anchors against compiled symbol references.
      - name: Contract symbol-ref sync gate (always, #4268)
        run: |
          python3 scripts/check_contract_symbol_refs.py
          python3 -m unittest tests.test_contract_symbol_refs

      # H2 tmux boundary ratchet, Linux lane; inert (no-op / warn-only) until activation.
      - name: H2 tmux boundary measurement (linux, inert)
        run: bash scripts/ci/h2_measure.sh --lane linux --inert

      # H2 R-O module map: module/cfg driver self-tests are required; only the repo map stays inert until activation.
      - name: H2 module map (linux, inert)
        timeout-minutes: 30
        env:
          RUSTC_WRAPPER: ""
        run: python3 scripts/ci/h2_modmap.py --lane linux --inert --canary --suite tests.test_h2_session_driver --suite tests.test_h2_session_e2e

      - name: Upload maintainability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-audit
          path: target/maintainability-audit.yaml
          if-no-files-found: ignore
          retention-days: 14

  # Parallel Script checks shards without cargo. ci-script-checks.sh assigns
  # every check to one shard, and the required-context judge requires all of them.
  scripts_guards:
    name: Script checks runner (guards)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        shell: bash
        run: ./scripts/ci-script-checks.sh
        env:
          BASH_ENV: /dev/null
          PYTHON: python3
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          GFP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GFP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_LANE_BASELINE_REF: HEAD^1
          SCRIPT_CHECK_SHARD: guards

  scripts_contracts:
    name: Script checks runner (contracts)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck zsh

      - name: Run script checks
        shell: bash
        run: ./scripts/ci-script-checks.sh
        env:
          BASH_ENV: /dev/null
          PYTHON: python3
          GFP_EVENT_NAME: ${{ github.event_name }}
          GFP_REPOSITORY: ${{ github.repository }}
          GFP_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GFP_CANDIDATE_SHA: ${{ github.sha }}
          GFP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GFP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_LANE_BASELINE_REF: HEAD^1
          SCRIPT_CHECK_SHARD: contracts

  relay_authority_targets:
    name: Relay authority targets
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust_tests_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Verify named relay-authority targets and selection floors
        env:
          ADK_LIB_TEST_ARTIFACT: ${{ runner.temp }}/lib-test-artifact
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 30
        run: python3 scripts/check_relay_authority_contract.py

      - name: Run named relay-authority contract targets
        env:
          ADK_LIB_TEST_ARTIFACT: ${{ runner.temp }}/lib-test-artifact
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 30
        run: |
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::session_relay_sink -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::relay_recovery::tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::turn_bridge::stream_tick::guarded_persist::tests::a_vanished_row_suppresses_without_ending_stream_lifecycle -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::turn_bridge::stream_tick::guarded_persist::tests::same_authority_watcher_epoch_advance_keeps_bridge_lifecycle_authority -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::turn_bridge::bridge_entry_persist::tests::entry_gate_matrix_over_outcome_and_anchor -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::turn_bridge::bridge_entry_persist::tests::an_enforced_rowless_turn_without_an_anchor_sends_no_placeholder -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::turn_bridge::bridge_entry_persist::tests::a_rowless_entry_patch_keeps_its_pre_persist_detached_locals -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::tmux::tmux_watcher::terminal_relay_plan::soft_terminal_direct_send_authority_tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::tmux::tmux_watcher::streaming_status_tick::committed_progress_tests::native_collector_tests::recovered_native_preview_terminal -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::tui_prompt_relay::local_model_queue_wake_e2e -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR python3 scripts/ci/lib-test-artifact.py run -- cargo test --lib services::discord::tui_prompt_relay::tests::scenario_census_e2e -- --test-threads=1

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  relay_authority_mutations:
    name: Relay authority mutations (${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust_tests_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RELAY_AUTHORITY_MUTATION_SHARD_INDEX: ${{ matrix.shard }}
      RELAY_AUTHORITY_MUTATION_SHARD_TOTAL: "3"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # Depth 2 keeps HEAD^1, the base side the wiring digest compares against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Filter mutation setup and execution; a missing output still runs the gate.
      - name: Detect relay-authority mutation sources
        id: mutation_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mutation_sources:
              - 'src/services/discord/session_relay_sink.rs'
              - 'src/services/discord/session_relay_sink/terminal_handoff.rs'
              - 'src/services/discord/session_relay_sink/delivery_orchestration_tests.rs'
              - 'src/services/discord/session_relay_sink/tests.rs'
              - 'src/services/discord/tmux_watcher_registry/fences.rs'
              - 'src/services/discord/tmux_watcher_registry.rs'
              - 'src/services/discord/tmux_watcher_registry_restore_tests.rs'
              - 'src/services/discord/destructive_cancel_gate.rs'
              - 'src/services/discord/relay_recovery.rs'
              - 'src/services/discord/relay_recovery/tests.rs'
              - 'scripts/run_relay_authority_mutations.sh'
              - 'scripts/relay_mutation_wiring_digest.py'

      # ci-pr.yml counts only when the relay jobs' resolved YAML changed; doubt reports true.
      # PyYAML is installed only if missing, and a failed install leaves the digest to report true.
      - name: Detect relay-authority mutation wiring
        id: mutation_wiring
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyyaml || echo "::warning::PyYAML unavailable; the wiring digest reports true"
          python3 scripts/relay_mutation_wiring_digest.py

      - name: Install Rust toolchain
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        uses: ./.github/actions/ensure-swap

      - name: Fetch Cargo dependencies
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: Require relay-authority mutations to be killed
        if: steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false'
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 45
        run: bash scripts/run_relay_authority_mutations.sh

      - name: sccache stats
        if: always() && (steps.mutation_paths.outputs.mutation_sources != 'false' || steps.mutation_wiring.outputs.wiring_changed != 'false')
        run: sccache --show-stats || true
