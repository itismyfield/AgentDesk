name: CI PR

on:
  # PR-only triggers. The previous `push: branches-ignore: [main]` trigger ran
  # this whole workflow a SECOND time for every push that also had an open PR
  # (pull_request: synchronize already covers PR-branch pushes), doubling CI
  # compute. Deduping via the concurrency group instead would cancel the older
  # run, but the `*_required_context` mirrors run `if: always()` and FAIL CLOSED
  # on a `cancelled` upstream — so cancellation surfaces spurious required-check
  # failures. Dropping both the redundant push trigger and manual dispatch
  # prevents any non-candidate run from publishing the required `Script checks`
  # context. Branch CI is obtained by opening a PR; main is covered by ci-main.yml.
  pull_request:

concurrency:
  # A PR number is unique inside the base repository, unlike `head_ref`: two
  # forks can use the same source branch name and must never cancel each other.
  # Manual dispatch has no PR payload, so isolate it by the selected ref.
  group: ci-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push makes every result from the older SHA stale, so release its
  # hosted runners immediately. The `*_required_context` mirrors remain
  # fail-closed: cancellation may leave failed/cancelled contexts on the OLD
  # SHA, while branch protection still requires fresh green contexts on the
  # newest exact HEAD SHA. Manual cancellation of the newest run therefore
  # remains blocking until that exact SHA is rerun successfully.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  # Pull requests may restore default-branch sccache entries but never write
  # branch-local shards into the repository-wide 10GB cache budget.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      high_risk_recovery: ${{ steps.filter.outputs.high_risk_recovery }}
      pg_db: ${{ steps.filter.outputs.pg_db }}
      rust_or_policy: ${{ steps.filter.outputs.rust_or_policy }}
      rust_compile: ${{ steps.filter.outputs.rust_compile }}
      # True when a relay-state-contract anchor file, the contract doc, or the
      # sync gate itself changed. Used to run the compile-existence half
      # (`check_fast`, which compiles the `relay_state_contract_refs` blocks)
      # even for doc-only contract changes (#4268).
      relay_contract: ${{ steps.filter.outputs.relay_contract }}
      # True when a Rust-compile change touches paths OUTSIDE the relay
      # stabilization surface, i.e. it actually needs cross-OS verification.
      # Relay-only PRs (src/services/discord/**, tests/e2e/**) leave this
      # false so the ~22min PR-time Windows lane is skipped; the nightly
      # workflow still exercises the full macOS/Windows matrix within 24h.
      # NOTE: this gates ONLY the advisory Windows lane. Required ubuntu
      # Rust/PG/dashboard mirrors still verify every matching PR.
      cross_os_rust: ${{ steps.filter.outputs.cross_os_rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dashboard:
              - '.nvmrc'
              - 'dashboard/**'
              - 'scripts/check-dashboard-install-state.mjs'
              - 'scripts/check-dashboard-toolchain.sh'
              - 'scripts/install-dashboard-dependencies.sh'
              - 'scripts/verify-dashboard.sh'
            high_risk_recovery:
              - '.github/workflows/**'
              # #5147: this lane owns the self-watchdog's kill-time forensics,
              # and one of those tests asserts on `[profile.release]` -- it is
              # what stops `strip = true` (which erased the Mach-O symbol table
              # and stalled #4756/#4770/#5147) from coming back. A guard whose
              # own subject cannot trigger it is the #5185 defect, so the files
              # under guard are listed here alongside the tests.
              #
              # NO-OP, stated so nobody reads this filter as narrow: the
              # `'!src/services/discord/placeholder_live_events/**'` line below
              # already makes `high_risk_recovery` effectively always true.
              # dorny/paths-filter@v3 is NOT GitHub's native `paths:` -- it
              # compiles every pattern into its own picomatch matcher and ORs
              # them (`matchers.some(...)`), so a leading `!` is just another
              # positive matcher for "anything that is not this", and it matches
              # nearly every changed file. The patterns #5147 adds here and
              # below therefore change nothing about what runs; they are kept
              # as a statement of which files this lane is meant to guard, and
              # they become load-bearing the moment that `!` line is fixed.
              # Fixing it is a separate change: narrowing the filter would
              # silently stop running whatever has been relying on it.
              - 'Cargo.toml'
              - 'policies/auto-queue.js'
              - 'policies/kanban-rules.js'
              - 'policies/timeouts.js'
              - 'policies/timeouts/**'
              - 'policies/lib/**'
              - 'policies/__tests__/**'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/high_risk_recovery.rs'
              - 'src/kanban/**'
              - 'src/reconcile.rs'
              - 'src/server/routes/auto_queue.rs'
              - 'src/server/routes/dispatched_sessions.rs'
              - 'src/server/routes/dispatches/**'
              - 'src/server/outbox_actionable_delivery.rs'
              - 'src/server/routes/message_outbox.rs'
              - 'src/server/routes/scheduled_messages.rs'
              - 'src/server/worker_registry.rs'
              - 'src/services/auto_queue.rs'
              - 'src/services/auto_queue/**'
              - 'src/services/scheduled_messages.rs'
              - 'src/services/scheduled_messages/**'
              - 'src/services/discord/outbound/source_registry.rs'
              - 'src/services/discord/**'
              - '!src/services/discord/placeholder_live_events/**'
              # #5147: the forensics module, the health-path DB awaits it
              # brackets, and the boot site that starts the self-watchdog (and
              # with it the runtime beacon). Inert today -- see the `!` note
              # above.
              - 'src/cli/dcserver.rs'
              - 'src/services/hang_forensics.rs'
              - 'src/services/health_diagnostics.rs'
              - 'src/services/message_outbox.rs'
              - 'src/services/message_outbox_recovery.rs'
              - 'src/services/message_outbox_recovery_support.rs'
              - 'src/services/message_outbox_recovery_tests.rs'
              - 'src/services/platform/tmux.rs'
              - 'src/services/tmux_common.rs'
            pg_db:
              - '.github/workflows/**'
              - 'justfile'
              - 'migrations/**'
              - 'scripts/ci/postgres-service.sh'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/high_risk_recovery.rs'
              - 'src/kanban/**'
              - 'src/reconcile.rs'
              - 'src/server/routes/auto_queue.rs'
              - 'src/server/routes/auto_queue_lifecycle_pg_tests.rs'
              - 'src/server/routes/dispatched_sessions.rs'
              - 'src/server/routes/dispatches/**'
              - 'src/server/routes/message_outbox.rs'
              - 'src/server/routes/scheduled_messages.rs'
              - 'src/server/worker_registry.rs'
              - 'src/services/auto_queue.rs'
              - 'src/services/auto_queue/**'
              - 'src/services/dispatches/**'
              - 'src/services/queue.rs'
              - 'src/services/session_forwarding.rs'
              - 'src/services/session_forwarding/**'
              - 'src/server/routes/queue_api.rs'
              - 'src/server/resource_locks.rs'
              # #4460: recovery owns production-shaped PostgreSQL/outbox
              # tests; changes to the owner or its sidecars must run them.
              - 'src/services/discord/health/recovery.rs'
              - 'src/services/discord/health/recovery/**'
              - 'src/services/discord/watchers/lifecycle/restore_tests.rs'
              - 'src/services/maintenance/jobs/worktree_orphan_sweep.rs'
              - 'src/services/pipeline_override.rs'
              # #5025: terminal-delivery evidence routing and every local
              # producer/epilogue sibling run in `test_fast`, whose registered
              # required mirror is `Fast targeted tests (ubuntu-latest)`.
              - 'src/services/discord/inflight.rs'
              - 'src/services/discord/inflight/**'
              # #5071 T2-W S-W1: the bridge-handoff stamp and its PG-backed
              # sidecar tests must select the PostgreSQL lane together.
              - 'src/services/discord/router/message_handler/intake_turn.rs'
              - 'src/services/discord/router/message_handler/intake_turn/**'
              - 'src/services/discord/runtime_bootstrap/intake_delivery_capability.rs'
              - 'src/services/discord/runtime_bootstrap/intake_delivery_capability/**'
              - 'src/services/discord/runtime_bootstrap/**'
              - 'src/services/discord/tmux_watcher.rs'
              - 'src/services/discord/tmux_watcher/**'
              - 'src/services/discord/turn_bridge/terminal_outcome_delivery.rs'
              - 'src/services/discord/turn_bridge/terminal_outcome_delivery/**'
              - 'src/services/scheduled_messages.rs'
              - 'src/services/scheduled_messages/**'
              - 'src/services/discord/outbound/source_registry.rs'
              # #4985: footer marker changes require the protected targeted lane.
              # Glob rather than a file list: enumerating siblings silently drops
              # newly extracted modules (footer_only_marker.rs was created by this
              # PR and missed the list), which skips the lane for the very file
              # the change lives in.
              - 'src/services/discord/task_notification_delivery/**'
              - 'src/services/discord/tmux.rs'
              - 'src/services/discord/tmux_watcher/discrete_trigger_marker.rs'
              - 'src/services/discord/tui_prompt_relay/task_notification_prompt.rs'
              - 'src/services/message_outbox.rs'
              - 'src/services/message_outbox_recovery.rs'
              - 'src/services/message_outbox_recovery_support.rs'
              - 'src/services/message_outbox_recovery_tests.rs'
              - 'src/services/api_friction/**'
              - 'src/services/retrospectives.rs'
              - 'src/services/discord_dm_reply_store.rs'
              - 'src/server/cluster.rs'
              - 'src/server/task_dispatch_claims.rs'
              - 'src/services/dispatch_watchdog.rs'
              - 'src/services/cluster/intake_router_hook.rs'
              - 'src/services/cluster/intake_router_hook/**'
              - 'src/services/discord/router/intake_dispatch.rs'
              - 'src/services/discord/router/intake_dispatch/**'
              - 'src/services/observability/**'
              - 'src/config.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sqlx-data.json'
            rust_or_policy:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'justfile'
              - 'policies/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'package-lock.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              # defaults.json is embedded into the Rust binary via
              # `include_str!("../defaults.json")` in src/config.rs.
              - 'defaults.json'
              # routines/** is enumerated and executed by the
              # `bundled_sample_routines_load_and_validate` Rust test
              # (src/services/routines/loader.rs); adding/removing/renaming
              # a routine script can break the asserted file list.
              - 'routines/**'
            # relay_contract: the doc<->code binding surface for the #4268
            # contract symbol-ref gate. When any of these change, the
            # compile-existence half (check_fast, which compiles the
            # `relay_state_contract_refs` blocks so a renamed/removed contract
            # symbol fails to compile) MUST run even for doc-only changes.
            # Keep this list in sync with REFERENCE_SOURCE_MODULES in
            # scripts/check_contract_symbol_refs.py.
            relay_contract:
              - 'docs/relay-state-contract.md'
              - 'scripts/check_contract_symbol_refs.py'
              - 'tests/test_contract_symbol_refs.py'
              - 'src/services/discord/inflight/store.rs'
              - 'src/services/discord/turn_bridge/terminal_delivery.rs'
              - 'src/services/discord/tmux_watcher/liveness.rs'
              - 'src/services/discord/router/message_handler/watchdog.rs'
            # rust_compile is a narrower subset of rust_or_policy: only paths
            # whose change can plausibly alter Rust binary output (and therefore
            # require cross-OS verification on macOS/Windows). Pure JS policy,
            # shell script, most CI metadata, and Node package changes are
            # excluded — those are still verified by the ubuntu Rust lane plus
            # Lint/Script checks, and the nightly workflow continues to run
            # the full macOS/Windows matrix daily. ci-pr.yml itself is included
            # so edits to this Rust CI lane exercise its own Windows job.
            #
            # Must include every compile-time Rust input. Audit before adding
            # new `include_str!`/`include_bytes!`/`sqlx::migrate!`/`build.rs`
            # tracked paths.
            rust_compile:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sqlx-data.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              - '.github/workflows/ci-pr.yml'
              # defaults.json is embedded into the Rust binary via
              # `include_str!("../defaults.json")` in src/config.rs.
              - 'defaults.json'
              # routines/** is enumerated and executed by the
              # `bundled_sample_routines_load_and_validate` Rust test
              # (src/services/routines/loader.rs); a routine asset change
              # can fail the test on any OS.
              - 'routines/**'
            # cross_os_rust mirrors `rust_compile` MINUS the relay
            # stabilization surface. When false, the only compile-affecting
            # changes are confined to `src/services/discord/**` and/or
            # `tests/e2e/**`, which the nightly macOS/Windows matrix already
            # exercises daily — so the advisory PR-time Windows lane is
            # skipped to keep relay-only PRs fast. Any compile input outside
            # that surface (a different crate path, Cargo/toolchain/build.rs,
            # this CI file) flips it true and the Windows lane runs. Keep the
            # positive list in sync with `rust_compile`.
            cross_os_rust:
              - 'src/*'
              - 'src/cli/**'
              - 'src/compat/**'
              - 'src/db/**'
              - 'src/dispatch/**'
              - 'src/engine/**'
              - 'src/github/**'
              - 'src/kanban/**'
              - 'src/runtime_layout/**'
              - 'src/server/**'
              - 'src/supervisor/**'
              - 'src/ui/**'
              - 'src/utils/**'
              - 'src/voice/**'
              - 'src/services/*'
              - 'src/services/agent_quality/**'
              - 'src/services/agents/**'
              - 'src/services/analytics/**'
              - 'src/services/api_friction/**'
              - 'src/services/auto_queue/**'
              - 'src/services/automation_candidate_materializer/**'
              - 'src/services/claude_e/**'
              - 'src/services/claude_tui/**'
              - 'src/services/cluster/**'
              - 'src/services/codex_tui/**'
              - 'src/services/dispatches/**'
              - 'src/services/git/**'
              - 'src/services/maintenance/**'
              - 'src/services/memory/**'
              - 'src/services/observability/**'
              - 'src/services/onboarding/**'
              - 'src/services/platform/**'
              - 'src/services/provider_cli/**'
              - 'src/services/routines/**'
              - 'src/services/slo/**'
              - 'src/services/turn_orchestrator/**'
              - 'tests/*'
              - 'tests/fixtures/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sqlx-data.json'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'build.rs'
              - '.github/workflows/ci-pr.yml'
              - 'defaults.json'
              - 'routines/**'

  dashboard:
    name: Dashboard (Node 22)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: dashboard build/test
        run: ./scripts/verify-dashboard.sh

  # Ubuntu Rust lane: canonical fast compile check. Gated on the broad rust_or_policy
  # filter so a `policies/*.js`, `scripts/*.sh`, `.github/workflows/**`, or
  # Node package change still gets a Rust check on Linux.
  #
  # The `relay_contract == 'true'` OR-clause forces this lane for a #4268
  # contract anchor, doc, or sync-gate change, including doc-only changes. This
  # job compiles the `relay_state_contract_refs` blocks, which is the only proof
  # that each contract symbol still exists.
  check_fast:
    name: Fast compile check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust_or_policy == 'true' || needs.changes.outputs.relay_contract == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — sccache (GHA-backed) handles
      # compiled rustc output, and caching multi-GB `target/` directories
      # starves the 10GB GHA cache quota, evicting sccache shards (observed
      # Rust hit-rate collapse: 99.80% → 0.00% within hours of merges). See
      # docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy JS unit tests
        run: npm run test:policies

      # `lint` owns fmt/clippy in its independent required mirror. Keep this
      # required Ubuntu lane to compilation and policy tests; main and nightly
      # retain the longer non-PG test coverage outside the PR critical path.
      - name: cargo check
        run: just cargo-check

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  # Cross-OS Rust compile lane. Gated on the narrower rust_compile filter so
  # docs-only, dashboard-only, JS-policy-only, script-only, workflow-metadata-
  # only, and Node-package-only PRs skip Windows compilation. Nightly retains
  # the full macOS/Windows test matrix, so cross-OS Rust drift cannot land
  # silently.
  check_fast_cross_os:
    # Keep this advisory job name stable: the infrastructure-failure classifier
    # identifies its non-blocking diagnostics by this exact context string.
    name: Fast check + non-PG tests (${{ matrix.os }})
    needs: changes
    # Advisory (non-required) cross-OS lane. Run only when a Rust-compile
    # change reaches OUTSIDE the relay stabilization surface (cross_os_rust);
    # relay-only PRs (src/services/discord/**, tests/e2e/**) skip it and rely
    # on the nightly full macOS/Windows matrix.
    if: needs.changes.outputs.rust_compile == 'true' && needs.changes.outputs.cross_os_rust == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Cross-OS failures need compiler/test diagnostics, not native debug
      # symbols. Windows spends most of this lane compiling and linking test
      # harnesses; stripping debuginfo preserves every target and test while
      # reducing the critical path and peak linker memory.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        # macOS PR lane temporarily disabled to unblock issue throughput
        # (2026-05-17). Agents run on macOS locally and verify
        # `cargo build --bin agentdesk` before pushing, so PR-time macOS
        # coverage is largely redundant. Nightly (`ci-nightly.yml`) still
        # exercises macOS daily so cross-OS Rust drift cannot land
        # silently for more than 24h. Restore by adding `macos-latest`
        # back to this matrix once issue backlog stabilises.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Disable sccache on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      - name: Install Opus on macOS
        if: runner.os == 'macOS'
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — sccache (GHA-backed) handles
      # compiled rustc output, and caching multi-GB `target/` directories
      # starves the 10GB GHA cache quota, evicting sccache shards (observed
      # Rust hit-rate collapse: 99.80% → 0.00% within hours of merges). See
      # docs/ci/sccache-setup.md §4.2.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Keep Windows inline and default-feature-only instead of `just check`.
      # This PR lane provides cross-OS compile signal only; main-push and
      # nightly retain the Windows runtime and non-PG test coverage outside the
      # PR critical path (#4747 option 2). Ubuntu fmt/staged clippy and full
      # workspace checks remain authoritative in the jobs above.
      - name: cargo check
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo check --workspace --all-targets

      - name: sccache stats
        if: always() && runner.os != 'macOS'
        shell: bash
        run: sccache --show-stats || true

  fast_check_required_context:
    name: Fast check (ubuntu-latest)
    needs:
      - changes
      - check_fast
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror fast check result for branch protection
        if: ${{ needs.changes.outputs.relay_contract != 'true' }}
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: rust_or_policy
          FILTER_OUTPUT: ${{ needs.changes.outputs.rust_or_policy }}
          UPSTREAM_JOB_NAME: check_fast
          UPSTREAM_RESULT: ${{ needs.check_fast.result }}
        run: ./scripts/required-check-mirror.sh

      # Contract changes use their own filter identity so a doc-only contract
      # edit cannot make the required mirror treat the forced compile as an
      # expected skip (#4268).
      - name: Relay-contract fast check mirror (always, #4268)
        if: ${{ needs.changes.outputs.relay_contract == 'true' }}
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: relay_contract
          FILTER_OUTPUT: ${{ needs.changes.outputs.relay_contract }}
          UPSTREAM_JOB_NAME: check_fast
          UPSTREAM_RESULT: ${{ needs.check_fast.result }}
        run: ./scripts/required-check-mirror.sh

  fast_targeted_tests_required_context:
    name: Fast targeted tests (ubuntu-latest)
    needs:
      - changes
      - test_fast
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror targeted test result for branch protection
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: pg_db
          FILTER_OUTPUT: ${{ needs.changes.outputs.pg_db }}
          UPSTREAM_JOB_NAME: test_fast
          UPSTREAM_RESULT: ${{ needs.test_fast.result }}
        run: ./scripts/required-check-mirror.sh

  dashboard_required_context:
    name: Dashboard required context (ubuntu-latest)
    needs:
      - changes
      - dashboard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror dashboard result for branch protection
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: dashboard
          FILTER_OUTPUT: ${{ needs.changes.outputs.dashboard }}
          UPSTREAM_JOB_NAME: dashboard
          UPSTREAM_RESULT: ${{ needs.dashboard.result }}
        run: ./scripts/required-check-mirror.sh

  test_fast:
    name: PostgreSQL tests (ubuntu-postgres)
    needs: changes
    if: needs.changes.outputs.pg_db == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      # Preserve the full serial PostgreSQL suite while reducing cold-link
      # time and memory exposure on hosted runners. Assertions and panic text
      # remain available; only native debug symbols are omitted.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `check_fast` for rationale: `target/` excluded to protect sccache
      # GHA cache quota.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Observe curated lane selections
        timeout-minutes: 20
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -o pipefail
          python3 scripts/check_test_target_integrity.py --observe-selection --workflow .github/workflows/ci-pr.yml --job test_fast --job high-risk-recovery | tee "$RUNNER_TEMP/selection-evidence-test-fast.log"

      - name: Require observer summary
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          python3 scripts/check_test_target_integrity.py --verify-selection-evidence "$RUNNER_TEMP/selection-evidence-test-fast.log"

      - name: Footer-only marker regressions
        timeout-minutes: 10
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          cargo test --lib task_notification -- "${NON_PG_SKIP_ARGS[@]}"
          cargo test --lib services::discord::tmux::tmux_watcher::discrete_trigger_marker::tests -- "${NON_PG_SKIP_ARGS[@]}"

      - name: Trusted session forwarding tests
        timeout-minutes: 10
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::session_forwarding -- "${NON_PG_SKIP_ARGS[@]}"

      # #5040: `intake_dispatch::tests` predates the lane-coverage ratchet and is
      # baselined debt. Select the telemetry-only admission regressions explicitly
      # in this branch-protected lane so a zero-test filter cannot pass unnoticed.
      - name: Telemetry-only intake authority regressions
        timeout-minutes: 10
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::router::intake_dispatch::tests::telemetry_only_unopted -- "${NON_PG_SKIP_ARGS[@]}"

      # #5025: this job is mirrored by the branch-protected
      # `Fast targeted tests (ubuntu-latest)` context above. Keep the router test
      # and both real identity-gate producers together so a red WARN regression
      # blocks merge instead of remaining advisory.
      - name: Terminal delivery evidence regressions
        timeout-minutes: 10
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          env -u AGENTDESK_ROOT_DIR cargo test --lib inflight::terminal_delivery_evidence_loss::tests
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::turn_bridge::terminal_outcome_delivery::delivery_epilogue_tests
          env -u AGENTDESK_ROOT_DIR cargo test --lib watcher_terminal_commit_identity_mismatch_skips_without_clobbering_newer_row
          env -u AGENTDESK_ROOT_DIR cargo test --lib identity_guarded_save_rejects_stale_write_against_newer_turn

      - name: just test-postgres
        timeout-minutes: 20
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: just test-postgres

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  high-risk-recovery:
    name: High-risk recovery
    needs: changes
    if: needs.changes.outputs.high_risk_recovery == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `check_fast` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Observe curated lane selections
        timeout-minutes: 20
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -o pipefail
          python3 scripts/check_test_target_integrity.py --observe-selection --workflow .github/workflows/ci-pr.yml --job high-risk-recovery | tee "$RUNNER_TEMP/selection-evidence-high-risk.log"

      - name: Require observer summary
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          python3 scripts/check_test_target_integrity.py --verify-selection-evidence "$RUNNER_TEMP/selection-evidence-high-risk.log"

      - name: High-risk recovery lane
        run: |
          cargo test --lib high_risk_recovery:: -- --test-threads=1
          cargo test --lib services::discord::recovery_engine::state_extractors::tests -- --test-threads=1
          cargo test --lib services::discord::relay_health::tests -- --test-threads=1
          cargo test --lib services::discord::health::session_enrichment::tests -- --test-threads=1
          cargo test --lib services::discord::health::relay_dead_reattach::tests -- --test-threads=1
          cargo test --lib services::discord::relay_recovery::tests -- --test-threads=1
          cargo test --lib services::discord::terminal_ui_obligation::tests -- --test-threads=1
          # #5147: the self-watchdog's kill-time forensics. Belongs in the
          # high-risk recovery lane because these tests are what stop the
          # watchdog from silently regressing to a bare pass/fail probe — the
          # exact blind spot that stalled #4756, #4770 and #5147.
          cargo test --lib services::hang_forensics::tests -- --test-threads=1
          # The other half of the same guard: that every Postgres await on the
          # public /api/health path is still bracketed, so a kill line cannot
          # report db_in_flight=0 while the handler is stuck inside one.
          cargo test --lib services::health_diagnostics::tests -- --test-threads=1

      # #5034: watchdog/operational alerts are notifications, not queued turns;
      # run the sender-policy, attachment-delivery, catch-up, outbox-delivery,
      # watchdog, and intake-boundary regressions in the same path-filtered
      # required lane as the production change.
      - name: Operational alert intake admission regressions
        run: |
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::dispatch_policy::allowed_turn_sender_tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::formatting::delivery::attachment_delivery_tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::catch_up::classification_order_tests::catch_up_human_visible_marker_recovers_and_strips_but_bot_marker_is_rejected -- --exact --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::router::intake_gate::gate::tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib server::outbox_actionable_delivery::tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::router::message_handler::watchdog::timeout_notice_tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::message_outbox::dedupe_key_tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::router::intake_gate::live_intake_preserve_wiring_tests::one_admission_guard_precedes_all_soft_intervention_entrypoints -- --exact --test-threads=1

      # #5003: this production-path E2E previously ran only in main's broad
      # non-PG lane, so test-only fixes could merge without executing it on PRs.
      - name: Local model durable queue wake regression
        run: env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::tui_prompt_relay::local_model_queue_wake_e2e -- --test-threads=1

      # #5170: the transition-busy requeue oracles live in two modules that no
      # curated PR filter selected, so they would have been counted by the lib
      # inventory manifest and executed nowhere -- the #5046/#5041 defect. The
      # queue_io oracle was originally named exactly because the surrounding
      # `queue_io` module carried pre-existing #4270 failures that predated that
      # lane, and a module-wide filter would have imported them.
      #
      # #5181 removed that reason: the two #4270 pins were stale oracles calling
      # the lease-less `mailbox_requeue_intervention_front` after #4811 made the
      # promote-gate front-restore lease-AUTHORIZED, and the `_4893` capped-retry
      # test released the shared test env lock while still depending on
      # `AGENTDESK_ROOT_DIR`. With both fixed, the whole `queue_io` module is
      # wired here so the next regression in it cannot merge unexecuted. The two
      # named #5170 filters are kept deliberately: they pin the exact oracles
      # that lane added, independent of how the module filter later evolves.
      - name: Transition-busy requeue spin regressions
        run: |
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::router::message_handler::intake_turn::race_loss:: -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::queue_io::presleep_tests::race_loss_recheck_fences_on_transition_without_parking_a_waiter_5170 -- --exact --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::queue_io:: -- --test-threads=1

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  high_risk_recovery_required_context:
    name: High-risk recovery path-filter mirror (ubuntu-latest)
    needs:
      - changes
      - high-risk-recovery
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror high-risk recovery result across path-filter skips
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: high_risk_recovery
          FILTER_OUTPUT: ${{ needs.changes.outputs.high_risk_recovery }}
          UPSTREAM_JOB_NAME: high-risk-recovery
          UPSTREAM_RESULT: ${{ needs.high-risk-recovery.result }}
        run: ./scripts/required-check-mirror.sh

  # #5185: measured on b6b551627, the curated PR lanes select 971 of 7538
  # library tests (12.9%), and every curated lane is path-filtered. The one
  # job that EXECUTES library tests unconditionally is
  # `relay-authority-contract`: it carries no `if:` and no `needs:`, and this
  # workflow has no `paths:` trigger filter, so it runs on every PR. (The
  # `scripts` job is unconditional too, but its Rust step is
  # `cargo test --lib -- --list`, which compiles and enumerates without
  # running anything.) That is the real floor a PR missing `pg_db`,
  # `high_risk_recovery` and the relay-authority path filters used to land on:
  # 171 library tests -- 123 under `services::discord::session_relay_sink`,
  # 43 under `services::discord::relay_recovery::tests`, 5 under
  # `services::discord::tui_prompt_relay::local_model_queue_wake_e2e` -- i.e.
  # 2.3% of the harness, all of it relay-authority surface.
  #
  # Whole-harness-minus-filter plus 15 replays: `rust_or_policy` selects 7,025 tests, of which
  # 8 are `#[ignore]`d, so 7,017 execute. Those three figures are derived
  # from `scripts/lib_test_inventory_manifest.txt` at THIS commit. The newest
  # figures a real run of this lane has REPORTED are at `6c2c43634`, 14 commits
  # before `fb2357a66`: `expected=6971 ignored=8 executed=6963`. The Linux
  # `derive_expected_selection` difference between those SHAs with skips `_pg`, `pg_` and `postgres` is 54 added and none removed, under
  # `server::routes::health_api::tests` (4),
  # `server::worker_registry::leader_takeover_tests` (1) and
  # `services::health_diagnostics::tests` (4), `services::hang_forensics::tests` (30),
  # `services::discord::recovery_engine::terminal_text_idempotency::tests` (5),
  # `services::discord::session_relay_sink::journal::controller::controller_terminal_semantics_tests` (5) and
  # `services::discord::session_relay_sink::journal::recovery::recovery_terminal_semantics_tests` (5). They
  # track the manifest, so a later PR that adds or removes a library test dates
  # them; what enforces the set is `run_test_lane.py`, which recomputes it every
  # run and names the difference. Read these as orientation, not as a gate.
  # Measured wall time for the libtest run itself on an M4 Pro: 262-274 s
  # across five sweeps (an earlier
  # revision of this comment claimed "~1 min", which was never measured);
  # a two-core `ubuntu-latest` runner is slower still, which is what the
  # 45-minute step timeout is sized for. darwin derives 7,028 / 7,020 from the
  # same manifest because four macOS-only tests are `#[cfg]`-absent on Linux
  # while one Linux-only test is present; the wrapper resolves that through
  # `--platform`, which defaults to the host, so the runner derives the Linux
  # figures and a local reproduction on a Mac derives the darwin ones.
  #
  # THIS JOB NEEDS POSTGRESQL, even though its filters are named for excluding
  # it. The canonical non-PG filter is a substring filter over test
  # ids, and PostgreSQL dependence is a property of a test *body*. The two do
  # not coincide: `scripts/pg_test_lane_manifest.txt` classifies 625 library
  # tests as PG-dependent and 68 of them carry none of those three substrings
  # in their id, so this lane selects those 68. Both figures are what
  # `scripts/check_pg_test_lane_membership.py` prints at this commit (the
  # residual is its `rule2` count); rerun it rather than trusting this
  # sentence. The residual was 61 until #5218 renamed
  # `server::multinode_regression::tests` (5 ids) and the Postgres half of
  # `server::issue_specs::tests` (1 id) into `_pg_` modules, which handed
  # those 6 to the id-filtered `test_fast` lane, leaving 55; #5266 then
  # widened *discovery* (Rust-2018 sibling module paths, and `#[test]` items
  # that sit outside an inline `#[cfg(test)] mod`) and surfaced pre-existing
  # tests neither figure had been counting. The count moves again whenever a
  # module gains or loses a lane token, or whenever discovery widens.
  #
  # The two counts move independently, and #5142 is the worked example: it took
  # the PG-dependent total from 460 to 477 while leaving the residual at 55 --
  # the same 55 ids, not merely the same count. Its 17 new PG-dependent tests
  # all live in `services::auto_queue::cleanup_tasks::cleanup_tasks_pg_tests`
  # and every id ends in `_pg`, so the substring filter removes all of them and
  # this lane's selection is unchanged by them. Growth in the PG total is
  # therefore not evidence that this lane's PG obligation grew; only a test
  # whose id lacks all three tokens can change that.
  #
  # The three measurements below were taken against the 61-id set, before that
  # rename. They are kept rather than rerun because what they establish is
  # FIXTURE BEHAVIOUR -- a property of each test body, which the rename did not
  # touch. Measured with the fixture base pointed at a closed port, those ids
  # do not degrade to a skip -- `TestPostgresDb::create()` panics through
  # `.expect(...)` and the soft-skip variants stall on connect retries for
  # minutes each. Against a live server the 61 were measured
  # `61 passed; 0 failed` in 24.8 s, in parallel, with
  # `AGENTDESK_REQUIRE_PG=1` -- on ONE development machine, server version
  # unrecorded. Both numbers are conditional on that host, and neither is a
  # property of this lane:
  #   * `0 failed` is not a guarantee. A review on another machine measured
  #     60 passed / 1 failed, the loser being the `multinode_regression`
  #     dispatch/reclaim test that `scripts/known_test_failures.txt` carries as
  #     `flaky` -- an intra-test race that reproduces under `--exact` on an idle
  #     machine. That worked example no longer describes THIS lane: #5218 moved
  #     that id into `test_fast`, and its ledger entry now prints here as
  #     `ledger-note: ... selected no test in lane non-pg-sweep`. Measured at
  #     this commit, no `lane=non-pg-sweep` ledger entry matches any of the 55,
  #     so a failure among them is reported `unexpected` and turns this lane red
  #     instead of being held green by the ledger.
  #   * 24.8 s is not a budget. `POSTGRES_TEST_LIFECYCLE_LOCK`
  #     (`src/db/postgres.rs`) serialises every fixture database create/drop
  #     process-globally, so the elapsed time is whatever one
  #     create+migrate+drop costs on the host; a two-core `ubuntu-latest`
  #     runner is expected to be far slower, and that is not a regression.
  # What is host-independent is the direction, and that is all this evidence is
  # asked to carry: with a live server the 55 run and are adjudicated on the
  # change. With a closed port they still run -- one review measured `57 FAILED
  # / 4 ok` in 915.72 s, against the 61-id set of the time. What that red
  # reports can be listed, and the list is short: which of the two fixture
  # behaviours each id takes -- `create()`
  # panicking through `.expect(...)`, or a soft-skip variant burning its
  # connect-retry budget -- and that the port was closed. Which of the two a
  # given id does is a property of the test, not of the diff. What it does not
  # report is whether the assertions past the fixture call hold, and those are
  # where a change is normally adjudicated.
  #
  # It does not follow that such a run says nothing about a change, and an
  # earlier revision of this comment claimed exactly that. The lines before the
  # fixture call are diffable, and that branch diffed them: three of the 55 live
  # in `src/services/session_resume.rs`, which that branch edited, and
  # `resume_production_path_clears_stale_binding_and_rebinds_runtime` there now
  # takes its `TEST_LOCK` with `unwrap_or_else(|poison| poison.into_inner())`
  # before its own `TestPostgresDb::create()` call. A closed port is
  # what makes that `create()` panic, and that panic is what poisons the lock
  # the edit exists to survive -- so against a closed port the fixture, not the
  # assertion, decides what that edit is worth. State the harm that way: the
  # lane does not go unrun, it goes red slowly, and it answers a narrower
  # question than the pull request asked.
  #
  # So the service below is not defensive: without it
  # this required context can never be green, and with it ids that no PR lane
  # ran at all start running on every Rust PR against a real database. The
  # count, measured rather than asserted: `[rule1]` of
  # `scripts/pg_test_lane_baseline.txt` held 56 such ids at 31465b184, the last
  # commit before this lane emptied it, and 55 of the 55 residual ids above are
  # among those 56. The 56th is
  # `server::issue_specs::tests::upsert_issue_spec_persists_parsed_contract`,
  # which #5218 renamed into `issue_specs_pg_tests` and thereby handed to
  # `test_fast`; it is still run by a PR lane, which is why `[rule1]` stays
  # empty rather than regaining an entry.
  #
  # `scripts/check_pg_test_lane_membership.py` `[rule5]` is what keeps the
  # SELECTION honest -- the selection, and nothing beyond it. What the rule
  # actually decides is whether a job's YAML text references the PostgreSQL
  # service start script at all; a `cargo test` job whose text does not
  # reference it fails rule5, naming every PG-dependent id that job selects.
  # Being a substring test over job text, it does not evaluate `if:`
  # conditions, does not tell a live step from a commented-out one, and cannot
  # know whether the container came up. `docs/ci/release-gates.md` records the
  # same limit in its required-context procedure -- rule5 inspects the
  # selection set, not whether the service really started -- which is why that
  # procedure ALSO makes you confirm, in a real main run, that this job's
  # service step exists and succeeded. Within those limits the rule carries no
  # baseline tolerance, so deleting the service step below turns this into a
  # red script check rather than a red sweep discovered by every PR author at
  # once.
  #
  # Residual risk, recorded rather than closed because it is low-probability
  # and has no cheap guard: a container that FAILS TO START is already safe --
  # the start step polls `pg_isready` for its budget and fast-fails the job. A
  # container that starts and then DIES mid-sweep is not. Every PG-dependent
  # test still to run then burns its connect-retry budget (a review measured
  # ~45 s per test against a closed port) before failing, which on a two-core
  # runner adds far more than the 45-minute step timeout has left. That
  # surfaces as a TIMEOUT red with no named failure -- not as the clean,
  # id-naming red this lane is built to produce -- so read a timeout here as
  # "check the service", not as "the sweep got slower".
  #
  # Boundaries and why they are here rather than wider:
  #   * `--lib` only. `full_non_pg` in ci-main.yml documents that an
  #     `--all-targets` non-PG sweep panics in ~169 SQLite-fixture tests that
  #     still await the #1238 PostgreSQL migration; pulling them in would force
  #     either a huge isolation ledger or a re-narrowed filter.
  #   * The id-filtered PostgreSQL suite keeps its existing home in `test_fast`
  #     / `just test-postgres`: that lane runs it `--test-threads=1` under its
  #     own container. This lane provisions its own container for the 55
  #     residual ids only; the two jobs run on separate runners and share
  #     nothing.
  #   * `DATABASE_URL` is deliberately NOT exported here even though `test_fast`
  #     and `high-risk-recovery` export it. Those lanes select hundreds of tests;
  #     this one selects 7,025 and executes 7,017, and the fixture helpers read
  #     `POSTGRES_TEST_DATABASE_URL_BASE`/`PG*`, not `DATABASE_URL` -- the 55
  #     pass without it. Exporting a production connection string across the
  #     whole harness is a blast radius that was not measured, so it is not
  #     claimed.
  #   * Parallel, NOT `--test-threads=1`: serialising would hide the shared
  #     process-global state this sweep exposes instead of recording it.
  #
  # `scripts/run_test_lane.py` is what makes the green meaningful. It derives
  # the exact id set this lane must run and fails -- naming every id on either
  # side of the difference -- when the run reports a different one, and it
  # fails on any failure that is not carried in
  # `scripts/known_test_failures.txt` with a tracking issue and a reason.
  # There is deliberately no execution-count floor; the step comment below
  # records the two measured evasions that cleared one.
  library_sweep:
    name: Library test sweep
    needs: changes
    if: needs.changes.outputs.rust_or_policy == 'true'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      # Fixture-side PostgreSQL wiring, matching `test_fast` /
      # `high-risk-recovery` minus `DATABASE_URL` (see the job comment).
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # #4979 S2 contract, and rule4 of check_pg_test_lane_membership.py: any
      # job that starts the service must also hard-fail on an unreachable
      # database instead of soft-skipping to green. rule4 does not ENFORCE
      # that. A newly appearing rule4 debt entry prints as `WARN` and the check
      # still exits 0 -- only a *stale* baseline entry is `FAIL` -- so deleting
      # this line turns no gate red; it quietly returns the PG-dependent tests
      # this lane selects to soft-skip green. Treat rule4 as a ledger, and this
      # line as load-bearing on its own.
      AGENTDESK_REQUIRE_PG: "1"
      # Match the other test lanes: assertions and panic text are preserved,
      # only native debug symbols are dropped to cut link memory (#4245).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `check_fast` for rationale: `target/` excluded to protect the
      # sccache GHA cache quota.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # There is no execution-count floor here, deliberately. A floor is a
      # scalar summary of a set, and both measured evasions cleared one: a
      # 402-test narrowing of a single module and a 213-test module disable
      # each stayed above a floor of 6500 and reported a green lane. The
      # adjudicator instead derives the exact id set this lane must run from
      # scripts/lib_test_inventory_manifest.txt minus the --skip patterns
      # declared below, and names every id on either side of the difference --
      # the same set-comparison convention #5144 moved the inventory pin onto.
      #
      # --skip is declared to the adjudicator as well as to libtest, and the
      # two must match: a lane that told the adjudicator about a narrower
      # selection than it executed would shrink its own expectation to fit.
      #
      # --max-summaries 2 because `non_wait_relay_parent_subprocess_entry`
      # re-executes the test binary and its child libtest writes a second
      # "test result:" line to the inherited stdout. Any further nesting is an
      # error: child output is otherwise counted as if this run had produced it.
      - name: Library sweep (selection-set gated)
        timeout-minutes: 45
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          source scripts/ci/non-pg-test-filter.sh
          python3 scripts/run_test_lane.py --lane non-pg-sweep --max-summaries 2 "${NON_PG_SKIP_ARGS[@]}" -- env -u AGENTDESK_ROOT_DIR cargo test --lib -- "${NON_PG_SKIP_ARGS[@]}"
          run_non_pg_filter_false_positives

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  library_sweep_required_context:
    name: Library test sweep (ubuntu-latest)
    needs:
      - changes
      - library_sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror library sweep result across path-filter skips
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: rust_or_policy
          FILTER_OUTPUT: ${{ needs.changes.outputs.rust_or_policy }}
          UPSTREAM_JOB_NAME: library_sweep
          UPSTREAM_RESULT: ${{ needs.library_sweep.result }}
        run: ./scripts/required-check-mirror.sh

  lint:
    name: Lint
    needs: changes
    # Match check_fast's composite gate so relay-contract-only changes retain
    # fmt/clippy coverage after duplicate linting was removed from that job.
    if: needs.changes.outputs.rust_or_policy == 'true' || needs.changes.outputs.relay_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `check_fast` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: just fmt-check
        run: just fmt-check

      - name: just lint
        run: just lint

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  lint_required_context:
    name: Lint required context (ubuntu-latest)
    needs:
      - changes
      - lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror lint result for branch protection
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: rust_or_policy_or_relay_contract
          FILTER_OUTPUT: ${{ needs.changes.outputs.rust_or_policy == 'true' || needs.changes.outputs.relay_contract == 'true' }}
          UPSTREAM_JOB_NAME: lint
          UPSTREAM_RESULT: ${{ needs.lint.result }}
        run: ./scripts/required-check-mirror.sh

  check_fast_cross_os_required_context:
    name: Fast check cross OS required context (ubuntu-latest)
    needs:
      - changes
      - check_fast_cross_os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror check_fast_cross_os result for branch protection
        env:
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          # Mirror on `cross_os_rust`, NOT `rust_compile`: the cross-OS lane is
          # now gated on cross_os_rust, so a relay-only PR (rust_compile=true,
          # cross_os_rust=false) legitimately SKIPS the Windows job. Keying the
          # mirror on rust_compile would fail closed on that expected skip;
          # cross_os_rust=false lets required-check-mirror.sh treat the skip as
          # pass, while cross_os_rust=true still requires the lane to succeed.
          FILTER_NAME: cross_os_rust
          FILTER_OUTPUT: ${{ needs.changes.outputs.cross_os_rust }}
          UPSTREAM_JOB_NAME: check_fast_cross_os
          UPSTREAM_RESULT: ${{ needs.check_fast_cross_os.result }}
        run: ./scripts/required-check-mirror.sh

  scripts:
    name: Script checks runner
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --verify-lib-inventory invokes `cargo test --lib -- --list`, so this
      # required aggregate job must provision the same pinned toolchain and
      # cache used by the other Rust lanes before running ci-script-checks.sh.
      - name: Install Rust toolchain for lib inventory
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache for lib inventory
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies for lib inventory
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `scripts/check_pg_test_lane_membership.py` stays dependency-free on
      # purpose, but `tests/test_check_pg_test_lane_membership.py` uses PyYAML
      # as an independent oracle to prove the hand-written `tests/fixtures/
      # pg_lane/jobs_*.yml` inputs really are the YAML shapes the dependency-free
      # parser claims to handle. setup-python gives a clean interpreter, so the
      # oracle must be installed explicitly or the suite errors on import.
      - name: Install script-test Python deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Large file guard
        shell: bash
        run: |
          set -euo pipefail
          limit=$((10 * 1024 * 1024))
          failed=0
          while IFS= read -r path; do
            [ -f "$path" ] || continue
            size=$(git cat-file -s "HEAD:$path")
            if [ "$size" -gt "$limit" ]; then
              printf 'ERROR: tracked file exceeds 10 MiB: %s (%s bytes)\n' "$path" "$size"
              failed=1
            fi
          done < <(git ls-files)
          exit "$failed"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # This direct PR-job step is deliberately outside the aggregate it
      # inspects, so deleting an aggregate writer gate or its wiring test cannot
      # also prevent the deletion check from running.
      - name: Protect writer gate aggregate wiring (#5308)
        timeout-minutes: 10
        shell: bash
        run: |
          python3 scripts/check_writer_gate_ci_wiring.py
          python3 -m unittest tests.test_writer_gate_ci_wiring
          scripts/check-ci-runner-hardening.sh

      - name: Run script checks
        shell: bash
        run: ./scripts/ci-script-checks.sh
        env:
          # Keep the aggregate interpreter and non-interactive Bash startup
          # behavior explicit at the protected step boundary.
          BASH_ENV: /dev/null
          PYTHON: python3
          # Required Script checks only run on protected PR candidates. Their
          # synthetic merge first parent is the exact immutable base snapshot.
          TEST_LANE_BASELINE_REF: HEAD^1

      # Keep high-value relay ratchets as explicit named steps as well as in the
      # aggregate script suite so their failure surface is immediately visible.
      - name: Hotfile LOC ratchet (always, #3565)
        run: python3 scripts/check_hotfile_ratchet.py

      - name: Inflight blind-save ratchet (always, #4259)
        run: python3 scripts/check_inflight_blind_save_ratchet.py

      # Contract symbol-ref doc<->code sync checks verify that the contract's
      # `sym:` anchors exactly match the references parsed from the
      # `relay_state_contract_refs` blocks that `cargo check --all-targets`
      # compiles to prove those symbols exist. The `relay_contract` path filter
      # force-runs that compile for doc-only changes, so both halves stay on.
      - name: Contract symbol-ref sync gate (always, #4268)
        run: |
          python3 scripts/check_contract_symbol_refs.py
          python3 -m unittest tests.test_contract_symbol_refs

      - name: Upload maintainability audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainability-audit
          path: target/maintainability-audit.yaml
          if-no-files-found: ignore
          retention-days: 14

  scripts_required_context:
    name: Script checks
    needs:
      - changes
      - scripts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the shared result primitive out-of-band before running structural
      # checks. Intentional helper edits must update this value, the independent
      # relay-authority backstop below, and check-ci-runner-hardening.sh together.
      - name: Verify Script checks mirror contract (#5321)
        env:
          BASH_ENV: /dev/null
        shell: bash
        timeout-minutes: 10
        run: |
          helper_path=scripts/required-check-mirror.sh
          expected=57c78a2ea1d5587ff1c74d5d25e2e32d25814198c5ee966e2297845c6230a30d
          actual="$(sha256sum "$helper_path" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=$helper_path::content hash mismatch: expected $expected, found $actual; review the helper and update all three #5321 pins together"
            exit 1
          fi
          gate_path=scripts/check-ci-runner-hardening.sh
          expected=9be327684586ffccd0ccd5ac99db81cf4af45e6425bd4deab402fb9eb8f27a56
          actual="$(sha256sum "$gate_path" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=$gate_path::content hash mismatch: expected $expected, found $actual; review the gate and update both #5321 gate pins together"
            exit 1
          fi
          scripts/check-ci-runner-hardening.sh
          python3 scripts/check_writer_gate_ci_wiring.py

      # Keep the branch-protection context on an unconditional result mirror.
      # required-check-mirror.sh fails closed when either `changes` or the
      # execution job is skipped, failed, or cancelled, regardless of which
      # upstream primitive caused that result.
      - name: Mirror script checks result for branch protection
        env:
          BASH_ENV: /dev/null
          PYTHON: python3
          CHANGED_PATHS_RESULT: ${{ needs.changes.result }}
          FILTER_NAME: scripts
          FILTER_OUTPUT: true
          UPSTREAM_JOB_NAME: scripts
          UPSTREAM_RESULT: ${{ needs.scripts.result }}
        run: ./scripts/required-check-mirror.sh

  # #5071 T0: this required-context candidate is intentionally unconditional.
  # Its version-controlled manifest names every current T1-T5 contract target,
  # records explicit GAP rows, and owns the selection floors. Condition-3 fixed
  # mutations attach as a later step in this same job after target verification.
  relay-authority-contract:
    name: relay-authority-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify named relay-authority targets and selection floors
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 30
        run: python3 scripts/check_relay_authority_contract.py

      - name: Run named relay-authority contract targets
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 30
        run: |
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::session_relay_sink -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::relay_recovery::tests -- --test-threads=1
          env -u AGENTDESK_ROOT_DIR cargo test --lib services::discord::tui_prompt_relay::local_model_queue_wake_e2e -- --test-threads=1

      - name: Require relay-authority mutations to be killed
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 30
        run: bash scripts/run_relay_authority_mutations.sh

      # Independent out-of-band backstop: conditional helper or gate mutations
      # still change bytes and must fail this required, unconditional context.
      # Run the gate only after its bytes match the reviewed pin, so this job
      # catches a skipped Script checks publisher as well as helper tampering.
      - name: Pin required-check mirror content (#5321)
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        shell: bash
        timeout-minutes: 10
        run: |
          helper_path=scripts/required-check-mirror.sh
          expected=57c78a2ea1d5587ff1c74d5d25e2e32d25814198c5ee966e2297845c6230a30d
          actual="$(sha256sum "$helper_path" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=$helper_path::content hash mismatch: expected $expected, found $actual; review the helper and update all three #5321 pins together"
            exit 1
          fi
          gate_path=scripts/check-ci-runner-hardening.sh
          expected=9be327684586ffccd0ccd5ac99db81cf4af45e6425bd4deab402fb9eb8f27a56
          actual="$(sha256sum "$gate_path" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=$gate_path::content hash mismatch: expected $expected, found $actual; review the gate and update both #5321 gate pins together"
            exit 1
          fi
          scripts/check-ci-runner-hardening.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
