name: CI Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      resource_diagnostics:
        description: Collect boundary-only PostgreSQL resource snapshots (no periodic coverage)
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_WRITE
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  dashboard:
    name: Dashboard (Node 22) nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # PR-required gate: build + Vitest only (verify-dashboard.sh).
      # Playwright smoke is intentionally nightly-only — see issue #3316.
      - name: dashboard build/test (PR gate path)
        run: ./scripts/verify-dashboard.sh

  # Playwright smoke is a nightly-only lane: it requires a headed Chromium
  # browser and takes longer than the fast PR gate allows.  Kept separate so
  # PR-required branch protection is never affected by E2E flakiness.
  dashboard_playwright:
    name: Dashboard Playwright smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: dashboard

      - name: Dashboard Playwright smoke
        id: playwright
        run: npm run test:e2e
        working-directory: dashboard

      - name: Upload Playwright report on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 14

  full_macos:
    name: Full tests (macos-latest)
    # Nightly macOS uses GitHub-hosted runners.
    runs-on: macos-latest
    # #6006: ci-main.yml and ci-pr.yml already build their cargo test lanes with
    # debug information off; nightly never received it. Dropping native debug
    # symbols reduces test build/link overhead in this lane. Trade-off: native
    # backtrace frames lose symbol detail here; assertion and panic text are
    # unaffected. This is a mitigation, not a proven shutdown-cause fix.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Rollback rehearsal executes the runbook's literal rg command.
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Require ripgrep
        shell: bash
        run: rg --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Disable sccache on macOS
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      # #6006: three macOS failures reported `start tmux fixture: ... NotFound`.
      # ci-macos-trusted.yml already provisions tmux; this hosted lane did not.
      # `tmux -V` is direct provisioning evidence in the log, not an assumption.
      - name: Install Opus on macOS
        run: |
          brew install opus pkg-config tmux
          tmux -V
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — see docs/ci/sccache-setup.md
      # §4.2. sccache GHA backend handles compiled rustc output; caching
      # `target/` here starved the 10GB quota and collapsed the Rust hit rate.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      # The PR worker path on one native worker; the source PG classifier picks what runs without PG.
      - name: Compare and run non-PG lib tests
        timeout-minutes: 90
        shell: bash
        env:
          BASH_ENV: /dev/null
          RUST_BACKTRACE: 1
        run: bash scripts/ci/nextest-native.sh macos macos-lib pg-classifier

      - name: cargo test (non-PG, non-lib targets)
        shell: bash
        run: |
          cargo test --bins --examples --benches --test '*' -- --skip _pg --skip pg_ --skip postgres
        env:
          RUST_BACKTRACE: 1

      - name: sccache stats
        if: always() && runner.os != 'macOS'
        run: sccache --show-stats || true

  full_windows:
    name: Full tests (windows-latest)
    runs-on: windows-latest
    # #6006: see `full_macos` for the rationale and the backtrace trade-off.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Rollback rehearsal executes the runbook's literal rg command.
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Require ripgrep
        shell: bash
        run: rg --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      # The PR worker path on one native worker; the source PG classifier picks what runs without PG.
      - name: Compare and run non-PG lib tests
        timeout-minutes: 90
        shell: bash
        env:
          BASH_ENV: /dev/null
          RUST_BACKTRACE: 1
        run: bash scripts/ci/nextest-native.sh windows windows-lib pg-classifier

      - name: cargo test (non-PG, non-lib targets)
        shell: bash
        run: |
          cargo test --bins --examples --benches --test '*' -- --skip _pg --skip pg_ --skip postgres
        env:
          RUST_BACKTRACE: 1

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  # The same nextest build, workers and audit as ci-pr.yml and ci-main.yml; hardening keeps the jobs equal.
  rust_build:
    name: Rust tests build and plan
    runs-on: ubuntu-latest
    # Timeout, permissions and checkout depth match ci-pr.yml, whose base comparison needs them.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap
      - name: Check Rust test source wiring
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: python3 scripts/ci/rust_test_sources.py check
      - name: Archive, list, compare and plan
        timeout-minutes: 45
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          mkdir -p "$NEXTEST_DIR"
          cargo nextest archive --lib --archive-file "$NEXTEST_DIR/lib-tests.tar.zst"
          cargo nextest list --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --ignore-default-filter --message-format json > "$NEXTEST_DIR/universe.json"
          python3 scripts/check_relay_authority_contract.py --nextest-list "$NEXTEST_DIR/universe.json"
          python3 scripts/ci/rust_test_sources.py compare --platform linux --list "$NEXTEST_DIR/universe.json" \
            --json-out "$NEXTEST_DIR/compare.json"
          python3 scripts/ci/nextest_ci.py plan --universe "$NEXTEST_DIR/universe.json" \
            --archive "$NEXTEST_DIR/lib-tests.tar.zst" --workers 6 --sha "$GITHUB_SHA" --scope linux-lib \
            --rust-version 1.94.1 --nextest-version "$(cargo nextest --version | awk 'NR==1 {print $2}')" \
            --target x86_64-unknown-linux-gnu --build-option CARGO_PROFILE_DEV_DEBUG=0 \
            --build-option CARGO_PROFILE_TEST_DEBUG=0 --output "$NEXTEST_DIR/plan"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$NEXTEST_DIR/plan/plan.json"
      - name: Upload nextest plan
        uses: actions/upload-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
          if-no-files-found: error
          retention-days: 1

  # Every worker runs its planned exact IDs once, serially, against its own PostgreSQL server.
  rust_tests:
    name: Rust tests (worker ${{ matrix.worker }})
    needs: rust_build
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5]
    env:
      RUST_BACKTRACE: 1
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start
      # Rollback rehearsal executes the runbook's literal rg command.
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep
      - name: Require ripgrep
        run: rg --version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Verify archive and plan
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: >-
          python3 scripts/ci/nextest_ci.py verify-archive --plan "$RUNNER_TEMP/nextest/plan/plan.json"
          --worker ${{ matrix.worker }} --archive "$RUNNER_TEMP/nextest/lib-tests.tar.zst"
          --config "$RUNNER_TEMP/nextest/plan/worker-${{ matrix.worker }}.toml" --sha "$GITHUB_SHA"
          --record "$RUNNER_TEMP/nextest-result"
      - name: Run planned tests
        timeout-minutes: 60
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set +e
          NEXTEST_DIR="$RUNNER_TEMP/nextest"
          RESULT_DIR="$RUNNER_TEMP/nextest-result"
          mkdir -p "$RUNNER_TEMP/nextest-extract"
          cargo nextest run --archive-file "$NEXTEST_DIR/lib-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" \
            --extract-to "$RUNNER_TEMP/nextest-extract" --extract-overwrite \
            --config-file "$NEXTEST_DIR/plan/worker-${{ matrix.worker }}.toml" --profile ci --no-tests fail
          code=$?
          echo "$code" > "$RESULT_DIR/exit-code"
          junit="$(find "$RUNNER_TEMP/nextest-extract" "$GITHUB_WORKSPACE/target" -path '*/nextest/ci/junit.xml' 2>/dev/null | head -n 1)"
          [ -n "$junit" ] && cp "$junit" "$RESULT_DIR/junit.xml"
          exit "$code"
      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop
      # The attempt is part of the name so a rerun never reads an older attempt's results.
      - name: Upload worker results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: nextest-worker-${{ matrix.worker }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nextest-result
          if-no-files-found: warn
          retention-days: 7

  # Planned == executed per worker, retry policy, and the targeted selectors; any gap is red.
  test_evidence:
    name: Rust tests evidence
    needs: [rust_build, rust_tests]
    if: ${{ !cancelled() && needs.rust_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download nextest plan
        uses: actions/download-artifact@v4
        with:
          name: nextest-plan
          path: ${{ runner.temp }}/nextest
      - name: Download worker results
        uses: actions/download-artifact@v4
        with:
          pattern: nextest-worker-*
          path: ${{ runner.temp }}/nextest-artifacts
      - name: Audit worker results
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/nextest/plan/plan.json"
          python3 scripts/ci/nextest_ci.py collect-results --plan "$plan" --artifacts "$RUNNER_TEMP/nextest-artifacts" \
            --output "$RUNNER_TEMP/nextest-results"
          python3 scripts/ci/nextest_ci.py selector-audit --plan "$plan"
          status=0
          python3 scripts/ci/nextest_ci.py audit --plan "$plan" --results "$RUNNER_TEMP/nextest-results" \
            --json-out "$RUNNER_TEMP/verdict.json" --summary-out "$RUNNER_TEMP/summary.md" || status=$?
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  postgres_full:
    name: PostgreSQL full tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      # #6006: see `full_macos` for the rationale and the backtrace trade-off.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      # Lib tests, PG ones included, run in the nextest jobs above; the server refuses to boot
      # without PostgreSQL, so the e2e smoke suite runs here under the boundary diagnostics.
      - name: cargo test (e2e smoke against PostgreSQL)
        id: pg_cargo_test
        timeout-minutes: 30
        shell: bash
        env:
          PG_DIAG_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.resource_diagnostics == true }}
        run: |
          PG_DIAG_DIR=""
          pg_diag_note() {
            printf '::notice title=PostgreSQL resource diagnostics::%s\n' "$1" >&2 || :
          }
          pg_diag_snapshot() {
            [ -n "$PG_DIAG_DIR" ] || return 0
            python3 -u scripts/ci/pg-resource-diagnostics.py snapshot \
              --directory "$PG_DIAG_DIR" --phase "$1" --status "$2" \
              --run-id "${GITHUB_RUN_ID:-}" --run-attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --commit-sha "${GITHUB_SHA:-}" || pg_diag_note 'snapshot unavailable'
          }
          pg_diag_finish() {
            local status=$?
            trap - EXIT
            pg_diag_snapshot exit "$status"
            exit "$status"
          }
          trap 'pg_diag_finish' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if [ "${PG_DIAG_ENABLED:-false}" = "true" ]; then
            if PG_DIAG_DIR="$(mktemp -d "${RUNNER_TEMP}/pg-resource-diagnostics-XXXXXX")"; then
              if printf 'diagnostics-dir=%s\n' "$PG_DIAG_DIR" >> "$GITHUB_OUTPUT"; then
                pg_diag_snapshot before 0
              else
                pg_diag_note 'unavailable: cannot publish diagnostics directory'
                PG_DIAG_DIR=""
              fi
            else
              pg_diag_note 'unavailable: cannot create diagnostics directory'
            fi
          fi
          cargo test --test e2e -- --test-threads=1

      - name: Verify PostgreSQL resource diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.resource_diagnostics == true
        timeout-minutes: 1
        shell: bash
        env:
          PG_DIAG_DIR: ${{ steps.pg_cargo_test.outputs.diagnostics-dir }}
        run: |
          python3 -B scripts/ci/pg-resource-diagnostics.py verify \
            --directory "${PG_DIAG_DIR:-}" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --commit-sha "${GITHUB_SHA:-}"

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  scripts:
    name: Script checks nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck scripts
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r f; do
            shellcheck -S warning "$f" || FAILED=1
          done < <(find . -name '*.sh' -not -path './target/*' -not -path './.git/*')
          exit $FAILED

      - name: Check hardcoded port/path drift
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          echo "=== Checking for hardcoded ports ==="
          grep -rn '8791\|8799' --include='*.rs' --include='*.js' --include='*.yaml' --include='*.json' \
            --exclude-dir=target --exclude-dir=.git \
            | grep -v 'Cargo.lock' \
            | grep -v '// port' \
            | grep -v '# port' || true

          echo ""
          echo "=== Checking for hardcoded home paths (informational — see #100) ==="
          if grep -rn 'env!("HOME")' --include='*.rs' \
            --exclude-dir=target --exclude-dir=.git 2>/dev/null; then
            echo "NOTE: env!(\"HOME\") found — tracked in #100"
          else
            echo "OK: No env!(\"HOME\") found"
          fi
          exit $FAIL

      - name: Path integrity check
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          echo "=== Checking Cargo.toml paths ==="
          if grep -n '/Users/\|/home/' Cargo.toml 2>/dev/null; then
            echo "ERROR: Absolute paths found in Cargo.toml"
            FAIL=1
          fi

          echo "=== Checking policies/ exist ==="
          for f in policies/default-pipeline.yaml policies/kanban-rules.js policies/timeouts.js policies/auto-queue.js policies/review-automation.js; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required policy file missing: $f"
              FAIL=1
            fi
          done

          exit $FAIL

      - name: Generated tracked-doc drift (warn)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_inventory_docs.py
          if git diff --quiet -- ARCHITECTURE.md docs/generated/route-inventory.md docs/generated/worker-inventory.md; then
            echo "Tracked generated docs are up to date."
          else
            echo "::warning::Tracked generated docs drift detected. The weekly Regen inventory docs workflow opens a maintenance PR; this check is intentionally warning-only."
          fi

  cli_smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: CLI smoke test (agentdesk --help)
        run: cargo run --quiet -- --help
        env:
          AGENTDESK_ROOT_DIR: ${{ runner.temp }}/adk-smoke

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # Unfiltered backstop for the PR mutation gate: every row on main, so a judge weakened
  # from a file outside the PR path filter fails here within a day.
  relay_authority_mutations_full:
    name: Relay authority mutations full (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RELAY_AUTHORITY_MUTATION_SHARD_INDEX: ${{ matrix.shard }}
      RELAY_AUTHORITY_MUTATION_SHARD_TOTAL: "3"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ensure swap for the lib test build
        uses: ./.github/actions/ensure-swap

      - name: Fetch Cargo dependencies
        env:
          BASH_ENV: /dev/null
        shell: bash
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: Require relay-authority mutations to be killed
        env:
          BASH_ENV: /dev/null
        shell: bash
        timeout-minutes: 45
        run: bash scripts/run_relay_authority_mutations.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
