name: CI Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      resource_diagnostics:
        description: Collect boundary-only PostgreSQL resource snapshots (no periodic coverage)
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_RW_MODE: READ_WRITE
  POSTGRES_SERVICE_IMAGE: ${{ vars.AGENTDESK_POSTGRES_SERVICE_IMAGE }}

jobs:
  dashboard:
    name: Dashboard (Node 22) nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # PR-required gate: build + Vitest only (verify-dashboard.sh).
      # Playwright smoke is intentionally nightly-only — see issue #3316.
      - name: dashboard build/test (PR gate path)
        run: ./scripts/verify-dashboard.sh

  # Playwright smoke is a nightly-only lane: it requires a headed Chromium
  # browser and takes longer than the fast PR gate allows.  Kept separate so
  # PR-required branch protection is never affected by E2E flakiness.
  dashboard_playwright:
    name: Dashboard Playwright smoke (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: dashboard

      - name: Dashboard Playwright smoke
        id: playwright
        run: npm run test:e2e
        working-directory: dashboard

      - name: Upload Playwright report on failure
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 14

  full_macos:
    name: Full tests (macos-latest)
    # Nightly macOS always uses GitHub-hosted runners. Trusted self-hosted
    # macOS execution is isolated in ci-macos-trusted.yml, which has no
    # pull_request trigger and requires an org runner group.
    runs-on: macos-latest
    # #6006: ci-main.yml and ci-pr.yml already build their cargo test lanes with
    # debug information off; nightly never received it. Dropping native debug
    # symbols reduces test build/link overhead in this lane. Trade-off: native
    # backtrace frames lose symbol detail here; assertion and panic text are
    # unaffected. This is a mitigation, not a proven shutdown-cause fix.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Disable sccache on macOS
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      # #6006: three macOS failures reported `start tmux fixture: ... NotFound`.
      # ci-macos-trusted.yml already provisions tmux; this hosted lane did not.
      # `tmux -V` is direct provisioning evidence in the log, not an assumption.
      - name: Install Opus on macOS
        run: |
          brew install opus pkg-config tmux
          tmux -V
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Setup sccache
        if: runner.os != 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.10

      # `target/` is intentionally NOT cached — see docs/ci/sccache-setup.md
      # §4.2. sccache GHA backend handles compiled rustc output; caching
      # `target/` here starved the 10GB quota and collapsed the Rust hit rate.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test (non-PG)
        shell: bash
        run: |
          source scripts/ci/non-pg-test-filter.sh
          cargo test --all-targets -- "${NON_PG_SKIP_ARGS[@]}"
          run_non_pg_filter_replay
        env:
          RUST_BACKTRACE: 1

      - name: sccache stats
        if: always() && runner.os != 'macOS'
        run: sccache --show-stats || true

  full_windows:
    name: Full tests (windows-latest)
    runs-on: windows-latest
    # #6006: see `full_macos` for the rationale and the backtrace trade-off.
    # The focused Discord step below keeps its own explicit env block: it is a
    # reviewed local contract, and inherited values alone would erase it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # #4466: keep the real Win32 named-mutex ownership and cross-process
      # blocking proof off the PR critical path while retaining daily coverage.
      - name: Discord thread-create cross-process lock
        shell: bash
        env:
          BASH_ENV: /dev/null
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --lib discord_thread_create -- --test-threads=1

      - name: cargo test (non-PG)
        shell: bash
        run: |
          source scripts/ci/non-pg-test-filter.sh
          cargo test --all-targets -- "${NON_PG_SKIP_ARGS[@]}"
          run_non_pg_filter_replay
        env:
          RUST_BACKTRACE: 1

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  postgres_full:
    name: PostgreSQL full tests
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
      # #6006: see `full_macos` for the rationale and the backtrace trade-off.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 30 minutes is the old 15 + 15 arithmetic budget, not measured runtime: selected lib tests grow 385 -> 636 and PG-connected tests 276 -> 422 under `--test-threads=1`.
      - name: cargo test (PostgreSQL bootstrap and routes)
        id: pg_cargo_test
        timeout-minutes: 30
        shell: bash
        env:
          PG_DIAG_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.resource_diagnostics == true }}
        run: |
          PG_DIAG_DIR=""
          pg_diag_note() {
            printf '::notice title=PostgreSQL resource diagnostics::%s\n' "$1" >&2 || :
          }
          pg_diag_snapshot() {
            [ -n "$PG_DIAG_DIR" ] || return 0
            python3 -u scripts/ci/pg-resource-diagnostics.py snapshot \
              --directory "$PG_DIAG_DIR" --phase "$1" --status "$2" \
              --run-id "${GITHUB_RUN_ID:-}" --run-attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --commit-sha "${GITHUB_SHA:-}" || pg_diag_note 'snapshot unavailable'
          }
          pg_diag_finish() {
            local status=$?
            trap - EXIT
            pg_diag_snapshot exit "$status"
            exit "$status"
          }
          trap 'pg_diag_finish' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if [ "${PG_DIAG_ENABLED:-false}" = "true" ]; then
            if PG_DIAG_DIR="$(mktemp -d "${RUNNER_TEMP}/pg-resource-diagnostics-XXXXXX")"; then
              if printf 'diagnostics-dir=%s\n' "$PG_DIAG_DIR" >> "$GITHUB_OUTPUT"; then
                pg_diag_snapshot before 0
              else
                pg_diag_note 'unavailable: cannot publish diagnostics directory'
                PG_DIAG_DIR=""
              fi
            else
              pg_diag_note 'unavailable: cannot create diagnostics directory'
            fi
          fi
          source scripts/ci/non-pg-test-filter.sh
          cargo test --all-targets -- "${PG_INCLUDE_ARGS[@]}" --nocapture --test-threads=1

      - name: Verify PostgreSQL resource diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.resource_diagnostics == true
        timeout-minutes: 1
        shell: bash
        env:
          PG_DIAG_DIR: ${{ steps.pg_cargo_test.outputs.diagnostics-dir }}
        run: |
          python3 -B scripts/ci/pg-resource-diagnostics.py verify \
            --directory "${PG_DIAG_DIR:-}" \
            --run-id "${GITHUB_RUN_ID:-}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --commit-sha "${GITHUB_SHA:-}"

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  multinode_regression:
    name: Multinode regression lane
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust multinode invariants
        timeout-minutes: 15
        run: "cargo test --lib multinode_regression:: -- --nocapture --test-threads=1"

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  high_risk_recovery_full:
    name: High-risk recovery full
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_TEST_DATABASE_URL_BASE: postgresql://postgres:postgres@127.0.0.1:5432
      POSTGRES_TEST_ADMIN_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENTDESK_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL service
        run: ./scripts/ci/postgres-service.sh start

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: High-risk recovery lane
        run: "cargo test --lib high_risk_recovery:: -- --test-threads=1"

      - name: Stop PostgreSQL service
        if: always()
        run: ./scripts/ci/postgres-service.sh stop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  scripts:
    name: Script checks nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for script checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck scripts
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r f; do
            shellcheck -S warning "$f" || FAILED=1
          done < <(find . -name '*.sh' -not -path './target/*' -not -path './.git/*')
          exit $FAILED

      - name: Check hardcoded port/path drift
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          echo "=== Checking for hardcoded ports ==="
          grep -rn '8791\|8799' --include='*.rs' --include='*.js' --include='*.yaml' --include='*.json' \
            --exclude-dir=target --exclude-dir=.git \
            | grep -v 'Cargo.lock' \
            | grep -v '// port' \
            | grep -v '# port' || true

          echo ""
          echo "=== Checking for hardcoded home paths (informational — see #100) ==="
          if grep -rn 'env!("HOME")' --include='*.rs' \
            --exclude-dir=target --exclude-dir=.git 2>/dev/null; then
            echo "NOTE: env!(\"HOME\") found — tracked in #100"
          else
            echo "OK: No env!(\"HOME\") found"
          fi
          exit $FAIL

      - name: Path integrity check
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          echo "=== Checking Cargo.toml paths ==="
          if grep -n '/Users/\|/home/' Cargo.toml 2>/dev/null; then
            echo "ERROR: Absolute paths found in Cargo.toml"
            FAIL=1
          fi

          echo "=== Checking policies/ exist ==="
          for f in policies/default-pipeline.yaml policies/kanban-rules.js policies/timeouts.js policies/auto-queue.js policies/review-automation.js; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required policy file missing: $f"
              FAIL=1
            fi
          done

          exit $FAIL

      - name: Generated tracked-doc drift (warn)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_inventory_docs.py
          if git diff --quiet -- ARCHITECTURE.md docs/generated/route-inventory.md docs/generated/worker-inventory.md; then
            echo "Tracked generated docs are up to date."
          else
            echo "::warning::Tracked generated docs drift detected. The weekly Regen inventory docs workflow opens a maintenance PR; this check is intentionally warning-only."
          fi

  cli_smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # See `full_macos` for rationale.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: CLI smoke test (agentdesk --help)
        run: cargo run --quiet -- --help
        env:
          AGENTDESK_ROOT_DIR: ${{ runner.temp }}/adk-smoke

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
