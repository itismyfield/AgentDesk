name: 5071 implementation workspace (temporary)
on:
  push:
    branches: [fix/5071-cancel-handoff-20260915]
    paths: [.github/workflows/5071-implementation-workspace.yml]
permissions:
  contents: write
concurrency:
  group: 5071-implementation-workspace
  cancel-in-progress: false
jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt
      - name: Apply digest-verified implementation patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/5071-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          text = subprocess.check_output(['git', 'show', 'e45ef089ae3287aec1ec23c4dae4b83a86d0544f:.github/workflows/5071-implementation-workspace.yml'], text=True)
          payload = re.search(r"payload = '''(.*?)'''", text, re.S).group(1)
          payload = payload.replace('qPyaXnvRVTVBHRXi6', 'qPyaXnvRVWBHRXi6')
          patch = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '4c52d351f7f7f066463601d201e20fbb7a7609d30e1c3f1ac13497f685f87005', digest
          pathlib.Path('/tmp/5071.patch').write_bytes(patch)
          pathlib.Path('/tmp/5071-evidence/input-patch-sha256.txt').write_text(digest + '\n')
          PY
          git apply --check --unidiff-zero /tmp/5071.patch
          git apply --unidiff-zero /tmp/5071.patch
      - name: Format changed files and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add src/services/codex_tui/rollout_tail/parser.rs src/services/discord/relay_coord.rs src/services/discord/tmux_output_stream.rs src/services/discord/tmux_watcher.rs src/services/discord/tmux_watcher/cancel_handoff.rs src/services/discord/tmux_watcher/loop_poll_prologue.rs src/services/discord/tmux_watcher/loop_poll_prologue/post_terminal_disposal_tests.rs src/services/discord/tmux_watcher/no_result_exits.rs src/services/discord/tmux_watcher/streaming_status_tick/native_collector_tests.rs src/services/discord/tmux_watcher/turn_stream_collector.rs src/services/discord/tmux_watcher/utf8_chunk_decoder.rs scripts/lib_test_inventory_manifest.txt tests/test_delivery_journal_raw_writer.py
          git diff --cached --name-only -- '*.rs' | while read -r file; do rustfmt --edition 2024 --config skip_children=true "$file"; done
          git add -u
          git diff --cached --check
          git config user.name 'AgentDesk implementation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(relay): retain cancelled source, parser and body for successor consumption'
          git push origin HEAD:refs/heads/fix/5071-cancel-handoff-20260915
          git rev-parse HEAD | tee /tmp/5071-evidence/tested-sha.txt
          git diff 23eb9bba132ad71f0336645705ab8597a59d1c1c HEAD -- src scripts tests > /tmp/5071-evidence/implementation.patch
          git diff --name-only 23eb9bba132ad71f0336645705ab8597a59d1c1c HEAD -- src scripts tests > /tmp/5071-evidence/changed-files.txt
          tar -czf /tmp/5071-evidence/changed-source.tar.gz -T /tmp/5071-evidence/changed-files.txt
      - name: Native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libopus-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-dependencies-v2
          cache-targets: false
          cache-bin: false
          save-if: false
      - name: Source contracts
        run: |
          set -o pipefail
          python3 -m unittest tests.test_delivery_journal_raw_writer 2>&1 | tee /tmp/5071-evidence/source-contracts.log
      - name: Compile all targets
        run: |
          set -o pipefail
          cargo check --all-targets --locked 2>&1 | tee /tmp/5071-evidence/cargo-check.log
      - name: Execute original and cancellation native collector contracts
        run: |
          set -o pipefail
          cargo test --locked --lib native_collector_tests:: -- --test-threads=1 --nocapture 2>&1 | tee /tmp/5071-evidence/native-tests.log
          grep -Eq 'test result: ok\. 4 passed; 0 failed;' /tmp/5071-evidence/native-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5071-implementation-evidence
          path: /tmp/5071-evidence
          retention-days: 3
          if-no-files-found: warn
