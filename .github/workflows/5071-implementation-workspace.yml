name: 5071 implementation workspace (temporary)
on:
  push:
    branches: [fix/5071-cancel-handoff-20260915]
    paths: [.github/workflows/5071-implementation-workspace.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: 5071-implementation-workspace
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require completed native and all-target verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/5071-final
          gh api repos/itismyfield/AgentDesk/actions/runs/34915245444 --jq '{id,conclusion,head_sha,html_url}' | tee /tmp/5071-final/verification-run.json
          test "$(gh api repos/itismyfield/AgentDesk/actions/runs/34915245444 --jq .conclusion)" = success
          git merge-base --is-ancestor f09605902c633afb4091e5702ddde3c123e25fc6 HEAD
          git diff --exit-code f09605902c633afb4091e5702ddde3c123e25fc6 HEAD -- src tests Cargo.toml Cargo.lock .cargo scripts/lib_test_inventory_manifest.txt
      - name: Admit exact namespace growth without changing guard logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, tomllib
          p = Path('scripts/audit_maintainability_config.toml')
          s = p.read_text()
          for rel, expected in [('src/services/discord/tmux_watcher/turn_stream_collector.rs', 1161), ('src/services/discord/tmux_watcher/no_result_exits.rs', 824)]:
              old = tomllib.loads(s)['namespace_size_caps'][rel]
              assert old == expected
              new = len(Path(rel).read_text().splitlines())
              assert old < new <= old + 120, (rel, old, new)
              pattern = '^' + re.escape('"' + rel + '"') + r' = ' + str(old) + r'(?=\s|$)'
              replacement = '"' + rel + '" = ' + str(new) + ' # PR #5927 reviewable admission: cooperative continuation state / cancellation finalization separation; retain #4712 decomposition debt.'
              s, count = re.subn(pattern, replacement, s, flags=re.M)
              assert count == 1
              print(rel, old, '->', new)
          p.write_text(s)
          PY
      - name: Check maintenance and source guards
        run: |
          set -o pipefail
          python3 -m unittest tests.test_delivery_journal_raw_writer 2>&1 | tee /tmp/5071-final/source-contracts.log
          python3 scripts/check_destructive_call_site_ratchet.py --check 2>&1 | tee /tmp/5071-final/destructive-call-sites.log
          python3 scripts/check_hotfile_ratchet.py 2>&1 | tee /tmp/5071-final/hotfile.log
          python3 scripts/audit_maintainability.py --check --format json > /tmp/5071-final/maintainability.json 2> /tmp/5071-final/maintainability.stderr
      - name: Remove temporary workflow and commit final source metadata
        run: |
          set -euo pipefail
          git add scripts/audit_maintainability_config.toml
          git rm .github/workflows/5071-implementation-workspace.yml
          git diff --cached --check
          git config user.name 'AgentDesk implementation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(relay): record scoped size admissions and remove temporary verification workflow'
          git push origin HEAD:refs/heads/fix/5071-cancel-handoff-20260915
          git rev-parse HEAD | tee /tmp/5071-final/final-sha.txt
          git diff --exit-code f09605902c633afb4091e5702ddde3c123e25fc6 HEAD -- src tests Cargo.toml Cargo.lock .cargo scripts/lib_test_inventory_manifest.txt
          git diff --name-only 23eb9bba132ad71f0336645705ab8597a59d1c1c HEAD > /tmp/5071-final/changed-files.txt
          tar -czf /tmp/5071-final/changed-source.tar.gz -T /tmp/5071-final/changed-files.txt
          git diff 23eb9bba132ad71f0336645705ab8597a59d1c1c HEAD > /tmp/5071-final/implementation.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5071-final-source-and-guards
          path: /tmp/5071-final
          retention-days: 3
          if-no-files-found: warn
