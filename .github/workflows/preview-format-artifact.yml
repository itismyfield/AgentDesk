name: Preview candidate formatting artifact

on:
  push:
    branches: ['fix/5071-preview-settlement-review-20260914']
    paths: ['.github/workflows/preview-format-artifact.yml']

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'itismyfield/AgentDesk' && github.actor == 'itismyfield'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt
      - name: Format only the three verified files
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/services/discord/tmux_watcher.rs',
              'src/services/discord/tmux_watcher/streaming_status_tick/native_collector_tests.rs',
              'src/services/discord/tmux_watcher/terminal_commit_epilogue/continuation_marker_tests.rs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Refusing unexpected formatter scope: {changed}')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          PY
          cargo fmt --all --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(relay): apply Rust 1.94.1 formatter to reviewed preview candidate'
      - name: Fast-forward only the isolated review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/5071-preview-settlement-review-20260914
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push origin HEAD:refs/heads/fix/5071-preview-settlement-review-20260914
