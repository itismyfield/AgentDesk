name: PR5927 PostgreSQL budget preparation
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-pg-budget.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'c2c248303938ad218b0be6bec9feb2c9bbfb2cd2', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 -m pip install PyYAML
      - name: Update only the measured timeout and its exact guard pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.github/workflows/ci-pr.yml');s=p.read_text()
          old='      - name: just test-postgres\n        timeout-minutes: 20\n'
          assert s.count(old)==1
          new='      # Run 34926677210 selected 845 serial tests and completed 642 without\n      # failure before the 20-minute budget expired during active migrations.\n      # Preserve all tests and fail-closed results; bound the complete run at 40m.\n      - name: just test-postgres\n        timeout-minutes: 40\n'
          p.write_text(s.replace(old,new))
          p=Path('scripts/check-ci-runner-hardening.sh');s=p.read_text()
          old='      "just test-postgres" => {\n        "commands" => ["just test-postgres"],\n        "timeout_minutes" => 20,\n'
          assert s.count(old)==1
          s=s.replace(old,old.replace('=> 20,','=> 40,'))
          oldhash='1e10a6a98f3e9a9b1f89001ccc260f6759a36238bb4c36dda0d08f10fe17e406'
          assert s.count(oldhash)==1
          s=s.replace(oldhash,'ee22751e613fae89b25fa9e6c3237388666ceb867eda5a33f0dc1c9e460d452d')
          p.write_text(s);newhash=hashlib.sha256(p.read_bytes()).hexdigest()
          assert newhash=='9cf7a3fde3e74870c50a51ce11116698c52263e02451d2d10c56f53ab4ebb943'
          old='4ed961da85aea2875ef4f5c710a088d0c8a834a9e30d36f06c52d9a6d4e759db'
          for f,n in [('.github/workflows/ci-pr.yml',2),('tests/test_fast_check_ci_wiring.py',1)]:
              p=Path(f);s=p.read_text();assert s.count(old)==n;p.write_text(s.replace(old,newhash))
          PY
          bash scripts/check-ci-runner-hardening.sh
          python3 -m unittest tests.test_fast_check_ci_wiring > "$RUNNER_TEMP/wiring.log" 2>&1
          git diff --check
      - name: Publish only the validated three blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,base64,hashlib,os
          paths=['.github/workflows/ci-pr.yml','scripts/check-ci-runner-hardening.sh','tests/test_fast_check_ci_wiring.py']
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==sorted(paths)
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'source');out.mkdir()
          entries=[]
          for path in paths:
              p=pathlib.Path(path);data=p.read_bytes()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/itismyfield/AgentDesk/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()))
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert result['sha']==sha
              mode=subprocess.check_output(['git','ls-files','--stage',path],text=True).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              (out/p.name).write_bytes(data)
          (out/'entries.json').write_text(json.dumps(entries))
          (out/'budget.patch').write_bytes(subprocess.check_output(['git','diff','--',*paths]))
          print(json.dumps(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-pg-budget
          path: |
            ${{ runner.temp }}/source
            ${{ runner.temp }}/wiring.log
          retention-days: 2
