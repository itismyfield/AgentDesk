name: PR5927 preflight settlement verification
on:
  push:
    branches: [review/pr5927-rowless-20260915]
    paths: ['.github/workflows/pr5927-preflight.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: '1.94.1', components: rustfmt}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with: {cache-targets: false, cache-bin: false, shared-key: cargo-dependencies-v2, save-if: false}
      - name: Prepare source and unchanged giant gate inputs
        run: |
          set -euo pipefail
          cp .github/preflight-repair.py "$RUNNER_TEMP/repair.py"
          git checkout --detach 0d5febe7a465dad3e481e23fc860fa2beeb7b129
          python3 "$RUNNER_TEMP/repair.py"
          cargo fmt --all
          git add src/services/discord/tmux_watcher
          git diff --exit-code
          git diff --cached --check
          python3 - <<'PY'
          import pathlib,subprocess,sys
          sys.path.insert(0,'scripts')
          import generate_inventory_docs as inv
          p='src/services/discord/tmux_watcher/terminal_preflight.rs'
          before=inv.split_prod_test_lines(subprocess.check_output(['git','show','HEAD:'+p],text=True))[0]
          after=inv.split_prod_test_lines(pathlib.Path(p).read_text())[0]
          print('PREFLIGHT_PROD', before, after)
          assert after<=before
          PY
      - name: All seven actual native cases with outer preflight
        run: |
          set -euo pipefail
          cargo test --lib native_collector_tests -- --nocapture > "$RUNNER_TEMP/native.log" 2>&1 || { tail -100 "$RUNNER_TEMP/native.log"; exit 1; }
          grep -F '7 passed; 0 failed' "$RUNNER_TEMP/native.log"
      - name: Publish the tested four blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,subprocess,pathlib,hashlib
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==4
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'source');out.mkdir()
          entries=[]
          for p in paths:
              assert p.startswith('src/services/discord/tmux_watcher/')
              data=pathlib.Path(p).read_bytes()
              obj=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/itismyfield/AgentDesk/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()))
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest();assert obj['sha']==sha
              entries.append({'path':p,'mode':'100644','type':'blob','sha':sha})
          (out/'entries.json').write_text(json.dumps(entries,indent=2))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached']))
          subprocess.run(['tar','-czf',str(out/'changed-source.tar.gz'),*paths],check=True)
          (out/'tree.txt').write_bytes(subprocess.check_output(['git','write-tree']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-preflight-source
          path: |
            ${{ runner.temp }}/source
            ${{ runner.temp }}/native.log
          retention-days: 2
      - name: Original preflight skip must fail the same joined test
        run: |
          set -euo pipefail
          git show HEAD:src/services/discord/tmux_watcher/terminal_preflight.rs > src/services/discord/tmux_watcher/terminal_preflight.rs
          if cargo test --lib rowless_cancelled_native_body_reaches_exact_receipt_without_append -- --nocapture > "$RUNNER_TEMP/original-preflight.log" 2>&1; then
            echo 'ERROR: original preflight unexpectedly accepted the joined regression'; exit 1
          fi
          grep -F 'confirmed cancelled episode must reach the existing settlement epilogue' "$RUNNER_TEMP/original-preflight.log"
          grep -F 'test result: FAILED' "$RUNNER_TEMP/original-preflight.log"
          git checkout -- src/services/discord/tmux_watcher/terminal_preflight.rs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5927-preflight-opposite
          path: ${{ runner.temp }}/original-preflight.log
          retention-days: 2
