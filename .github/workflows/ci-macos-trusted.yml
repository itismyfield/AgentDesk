name: CI macOS Trusted

on:
  # Current main every 6 hours: a per-push run outlasts the gap between main pushes.
  # :17 avoids the top-of-hour cron rush; the hours stay clear of the 18:00 UTC nightly.
  schedule:
    - cron: "17 3,9,15,21 * * *"
  # Manual run on any branch, tag or commit, e.g. a deploy candidate SHA.
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA, branch or tag to check; empty checks the branch picked in the run form
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One group per event and ref, never cancelling: a manual run and a scheduled run cannot stop each other.
  group: ci-macos-trusted-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_hosted:
    name: Trusted macOS check (hosted)
    # Pin the arm64 image for H2 measurements; the host-triple check rejects image drift.
    runs-on: macos-15
    steps:
      # Heavy steps skip only on a successful run=false, which scheduled and manual runs never get.
      - uses: actions/checkout@v4
        with:
          # Empty unless a manual run names a ref; empty checks out the event's own commit.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether heavy steps are needed
        id: rust_filter
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/macos-trusted-rust-filter.py --event "$EVENT_NAME" --base-ref origin/main >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy

      - name: Disable sccache on hosted macOS
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      - name: Install Opus on macOS
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: |
          brew install opus pkg-config tmux
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache derives the final key from OS/arch/toolchain and the
          # dependency-only Cargo.lock/Cargo.toml hash. Keep target artifacts
          # under sccache instead of duplicating multi-GB target directories.
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: false

      - name: cargo check
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: cargo check --all-targets

      # H2 tmux boundary ratchet, macOS lane; inert until the baseline lands.
      - name: H2 tmux boundary measurement (macos, inert)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: bash scripts/ci/h2_measure.sh --lane macos --inert

      # H2 R-O module map, macOS lane; a no-op (no rustc-dev install) until the baseline lands.
      - name: H2 module map (macos, inert)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: python3 scripts/ci/h2_modmap.py --lane macos --inert

      - name: Install cargo-nextest
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      # The selector union keeps its scope; it now runs through the PR worker path with audit.
      - name: cargo nextest (non-PG, targeted lib selectors)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        timeout-minutes: 60
        shell: bash
        env:
          BASH_ENV: /dev/null
        run: bash scripts/ci/nextest-native.sh macos macos-trusted selectors:scripts/ci/macos-trusted-selectors.txt

      - name: cargo test (non-PG, non-lib targets)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: cargo test --bins --examples --benches --test '*' -- --skip _pg --skip pg_ --skip postgres --test-threads=1

      - name: Fresh user portable smoke
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: bash scripts/ci-macos-fresh-user-smoke.sh
