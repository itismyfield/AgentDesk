name: CI macOS Trusted

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-macos-trusted-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_hosted:
    name: Trusted macOS check (hosted)
    # Pin the arm64 image for H2 measurements; the host-triple check rejects image drift.
    runs-on: macos-15
    steps:
      # Skip heavy steps on docs-only pushes only when the filter succeeds with run=false.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether heavy steps are needed
        id: rust_filter
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/macos-trusted-rust-filter.py --event "$EVENT_NAME" --base-ref origin/main >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy

      - name: Disable sccache on hosted macOS
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_GHA_ENABLED="
          } >> "$GITHUB_ENV"

      - name: Install Opus on macOS
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: |
          brew install opus pkg-config tmux
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache derives the final key from OS/arch/toolchain and the
          # dependency-only Cargo.lock/Cargo.toml hash. Keep target artifacts
          # under sccache instead of duplicating multi-GB target directories.
          cache-targets: false
          cache-bin: false
          shared-key: cargo-dependencies-v2
          save-if: false

      - name: cargo check
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: cargo check --all-targets

      # H2 tmux boundary ratchet, macOS lane; inert until the baseline lands.
      - name: H2 tmux boundary measurement (macos, inert)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: bash scripts/ci/h2_measure.sh --lane macos --inert

      # H2 R-O module map, macOS lane; a no-op (no rustc-dev install) until the baseline lands.
      - name: H2 module map (macos, inert)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        run: python3 scripts/ci/h2_modmap.py --lane macos --inert

      - name: cargo test (non-PG, targeted subset)
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets transition -- --skip _pg --skip pg_ --skip postgres --test-threads=1
          cargo test --all-targets auto_queue -- --skip _pg --skip pg_ --skip postgres
          cargo test --all-targets cancel -- --skip _pg --skip pg_ --skip postgres
          cargo test --all-targets review_decision -- --skip _pg --skip pg_ --skip postgres
          cargo test --all-targets stall_recovery -- --skip _pg --skip pg_ --skip postgres
          env -u AGENTDESK_ROOT_DIR cargo test --lib placeholder_live_events -- --skip _pg --skip pg_ --skip postgres
          env -u AGENTDESK_ROOT_DIR cargo test --lib single_message_panel::tests -- --skip _pg --skip pg_ --skip postgres
          # Health must precede relay_recovery so fail-fast reports both surfaces.
          python3 scripts/ci-timeout.py 900 env -u AGENTDESK_ROOT_DIR cargo test --lib health -- --skip _pg --skip pg_ --skip postgres
          env -u AGENTDESK_ROOT_DIR cargo test --lib relay_recovery -- --skip _pg --skip pg_ --skip postgres
          cargo test --all-targets routines -- --skip _pg --skip pg_ --skip postgres
          env -u AGENTDESK_ROOT_DIR cargo test --lib _4888 -- --test-threads=1
          cargo test invariant --all-targets -- --skip _pg --skip pg_ --skip postgres

      - name: Fresh user portable smoke
        if: steps.rust_filter.outcome != 'success' || steps.rust_filter.outputs.run != 'false'
        shell: bash
        run: bash scripts/ci-macos-fresh-user-smoke.sh
