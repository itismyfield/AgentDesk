id: E-52
title: 일괄 활성화 연속 3턴, placeholder 잔존과 턴당 완료 카드 확인
agent_mode: real_live
coverage_class: live
cells: [claude-pipe, claude-tui, codex-pipe, codex-tui]
isolation: required
steps:
  - send_prompt: "응답에 정확히 한 줄로 [E2E:E52:TURN-1] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E52:TURN-1]"
    timeout_s: 240
  - wait_idle_s: 3
  - send_prompt: "응답에 정확히 한 줄로 [E2E:E52:TURN-2] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E52:TURN-2]"
    timeout_s: 240
  - wait_idle_s: 3
  - send_prompt: "응답에 정확히 한 줄로 [E2E:E52:TURN-3] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E52:TURN-3]"
    timeout_s: 240
assertions:
  - raw_message_count_between_markers:
      min: 3
      max: 36
  - relay_latency_within:
      max_seconds: 240
  - no_duplicate_content: true
  - text_present: "[E2E:E52:TURN-1]"
  - text_present: "[E2E:E52:TURN-2]"
  - text_present: "[E2E:E52:TURN-3]"
  - no_resume_prompt_chrome: true
  # Preserve turn ordering and reject marker republication.
  - ordered_text_present:
      - "[E2E:E52:TURN-1]"
      - "[E2E:E52:TURN-2]"
      - "[E2E:E52:TURN-3]"
  - no_duplicate_marker: "[E2E:E52:TURN-1]"
  - no_duplicate_marker: "[E2E:E52:TURN-2]"
  - no_duplicate_marker: "[E2E:E52:TURN-3]"
  - no_placeholder_left: true
  - completion_per_turn:
      exact: 1
      marker: "[E2E:E52:TURN-1]"
  - completion_per_turn:
      exact: 1
      marker: "[E2E:E52:TURN-2]"
  - completion_per_turn:
      exact: 1
      marker: "[E2E:E52:TURN-3]"
