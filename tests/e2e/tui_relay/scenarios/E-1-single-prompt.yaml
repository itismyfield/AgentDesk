id: E-1
title: 짧은 단일 프롬프트 → 응답 1회 relay
agent_mode: real_live
coverage_class: live
# Manual execution specification; not run in CI. Conditional post-deploy subset (E-1/E-35/E-50/E-51): see README.md.
cells: [claude-pipe, claude-tui, codex-pipe, codex-tui, claude-herdr, codex-herdr]
isolation: required
steps:
  - send_prompt: "응답에 정확히 한 줄로 [E2E:E1:OK] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E1:OK]"
    timeout_s: 240
assertions:
  - message_count_between_markers:
      min: 1
      max: 6
  - raw_message_count_between_markers:
      min: 1
      max: 12
  - relay_latency_within:
      max_seconds: 240
  - no_status_chrome: true
  - no_duplicate_content: true
  - no_control_chars: true
  - no_resume_prompt_chrome: true
  - no_suppressed_label_chrome: true
