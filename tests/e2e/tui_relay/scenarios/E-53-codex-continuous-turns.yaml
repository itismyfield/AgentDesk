id: E-53
title: Codex 연속 3턴 — 각 턴 본문 1회, kill 0, mailbox 정지 0
agent_mode: real_live
coverage_class: live
cells: [codex-pipe, codex-tui]
acceptance_criteria:
  - Send 3 consecutive prompts with distinct markers
  - Each prompt should result in exactly one Discord relay message
  - No kills or mailbox stalls between turns
  - Each marker should appear exactly once in Discord
  - Verify no warm follow-up kill logs (composer_not_detected = 0)
notes: |
  Tests Codex's ability to handle consecutive turns without losing
  messages, experiencing unexpected kills, or having mailbox stalls.
  Issue #6552 regression would show kills or mailbox stalls on each turn.
  This scenario detects the symptom where Codex kills on every turn.
steps:
  - send_prompt: |
      Turn 1: Respond with exactly one line: [E2E:E53:TURN1]
  - wait_for_discord_text: "[E2E:E53:TURN1]"
    timeout_s: 240
  - wait_idle_s: 2
  - send_prompt: |
      Turn 2: Respond with exactly one line: [E2E:E53:TURN2]
  - wait_for_discord_text: "[E2E:E53:TURN2]"
    timeout_s: 240
  - wait_idle_s: 2
  - send_prompt: |
      Turn 3: Respond with exactly one line: [E2E:E53:TURN3]
  - wait_for_discord_text: "[E2E:E53:TURN3]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      forbid_degraded_reasons:
        - global_active_counter_out_of_bounds
      global_active_max: 0
      global_finalizing_max: 0
assertions:
  - no_duplicate_content: true
  - text_present: "[E2E:E53:TURN1]"
  - text_present: "[E2E:E53:TURN2]"
  - text_present: "[E2E:E53:TURN3]"
  - ordered_text_present:
      - "[E2E:E53:TURN1]"
      - "[E2E:E53:TURN2]"
      - "[E2E:E53:TURN3]"
  - no_duplicate_marker: "[E2E:E53:TURN1]"
  - no_duplicate_marker: "[E2E:E53:TURN2]"
  - no_duplicate_marker: "[E2E:E53:TURN3]"
  - raw_message_count_between_markers:
      min: 3
      max: 150
