id: E-50
title: Claude !clear 전이 시 본문이 정확히 1회만 도착
agent_mode: real_live
coverage_class: live
cells: [claude-pipe, claude-tui]
acceptance_criteria:
  - Send an initial prompt with a required marker
  - Wait for the first Discord relay message containing the marker
  - Send !clear command to clear conversation history
  - Send a second prompt with a different marker
  - Verify the second marker appears in Discord exactly once
  - Verify no duplicate content between first and second relay messages
notes: |
  Tests the !clear command functionality for Claude.
  Issue #6551 is fixed if body arrives after !clear (not held).
  This scenario detects the symptom where body is withheld after !clear.
steps:
  - send_prompt: |
      Respond with exactly one line: [E2E:E50:PART1]
  - wait_for_discord_text: "[E2E:E50:PART1]"
    timeout_s: 240
  - wait_idle_s: 2
  - send_prompt: |
      !clear
  - wait_idle_s: 3
  - send_prompt: |
      Respond with exactly one line: [E2E:E50:PART2]
  - wait_for_discord_text: "[E2E:E50:PART2]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      forbid_degraded_reasons:
        - global_active_counter_out_of_bounds
      global_active_max: 0
      global_finalizing_max: 0
assertions:
  - no_duplicate_content: true
  - text_present: "[E2E:E50:PART1]"
  - text_present: "[E2E:E50:PART2]"
  - ordered_text_present:
      - "[E2E:E50:PART1]"
      - "[E2E:E50:PART2]"
  - no_duplicate_marker: "[E2E:E50:PART1]"
  - no_duplicate_marker: "[E2E:E50:PART2]"
  - raw_message_count_between_markers:
      min: 2
      max: 50
