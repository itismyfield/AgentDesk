id: E-50
title: Claude 연속 턴 → !clear → 새 세션 턴, 턴마다 본문 정확히 1회
agent_mode: real_live
coverage_class: live
# Manual execution specification; not run in CI. Conditional post-deploy subset (E-1/E-35/E-50/E-51): see README.md.
cells: [claude-tui, claude-pipe, claude-herdr]
isolation: required
feature_coverage:
  schema: 1
  claims:
    - feature_id: message-delivery
      host: tmux
      provider: claude
      surface: channel
      state: idle
      qualifiers: {turn_origin: managed, output_path: unspecified, input_source: legacy_automation}
      assertion_ids: [provider_text_present, no_duplicate_marker, no_duplicate_content]
    - feature_id: message-delivery
      host: herdr
      provider: claude
      surface: channel
      state: idle
      qualifiers: {turn_origin: managed, output_path: unspecified, input_source: legacy_automation}
      assertion_ids: [provider_text_present, no_duplicate_marker, no_duplicate_content]
  references:
    - feature_id: reset-clear
      scope: Claude TUI·Herdr 칸은 fresh_session_after_clear의 provider_session_changed와 망각 단언을 실제 평가한다. pipe 칸은 기존 전달 검사만 유지한다. !clear 자동 경로이며 실제 Discord slash 상호작용은 별도 Rust action 시험과 배포 뒤 사람의 /clear로 검증한다.
      needs_live: true
acceptance_criteria:
  - T1·T2 are consecutive turns on one live session; each marker arrives exactly once
  - "!clear goes through the normal Discord text-command path and is acknowledged"
  - The first turn after !clear (AFTER_CLEAR) arrives exactly once (0 = withheld, 2+ = duplicate)
  - Claude TUI and Herdr observe distinct native provider session IDs before and after clear
  - The post-clear prompt contains no pre-clear secret; the provider reports that it does not know it
  - The post-deploy smoke judge also requires zero unexpected tmux kills and cold-resume fallbacks in the dcserver log
notes: |
  Post-deploy smoke scenario. Every input is a marker-bearing Discord post
  (send_discord_prompt), the same path an operator uses; nothing is cancelled
  or reset. The deploy smoke runs it with --no-reset-before-each under a phase
  deadline and judges report marker_counts plus the dcserver log excerpt.
  The extra native-ID and memory checks below apply only to claude-tui and
  claude-herdr. They do not invoke a Discord slash interaction. The actual
  slash action is checked by Rust tests; after deployment a human invokes
  /clear and verifies a new native JSONL session and loss of the prior secret.
fresh_session_after_clear:
  cells: [claude-tui, claude-herdr]
  secret: "[E2E:E50:{run_id}:PRIOR_SECRET]"
  remember_prompt: "응답에는 정확히 한 줄로 [E2E:E50:{run_id}:T1]만 출력해줘. 이 대화에서만 비밀 문자열 [E2E:E50:{run_id}:PRIOR_SECRET]를 기억하고 응답에는 비밀을 쓰지 마."
  probe_prompt: "응답 첫 줄에는 [E2E:E50:{run_id}:AFTER_CLEAR]를 출력해. 다음 줄에는 내가 앞선 대화에서 맡긴 비밀 문자열을 알고 있으면 그 문자열을 그대로 출력하고, 모르면 정확히 [E2E:E50:{run_id}:NO_PRIOR_MEMORY]만 출력해."
  assertions:
    - provider_session_changed: {before: before_clear, after: after_clear}
    - provider_text_present: "[E2E:E50:{run_id}:NO_PRIOR_MEMORY]"
    - marker_absent: {marker: "[E2E:E50:{run_id}:PRIOR_SECRET]", surface: relay}
report_marker_counts:
  - "[E2E:E50:{run_id}:T1]"
  - "[E2E:E50:{run_id}:T2]"
  - "[E2E:E50:{run_id}:AFTER_CLEAR]"
steps:
  - send_discord_prompt: "응답에 정확히 한 줄로 [E2E:E50:{run_id}:T1] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E50:{run_id}:T1]"
    relay_author: provider
    timeout_s: 60
  - wait_idle_s: 2
  - send_discord_prompt: "응답에 정확히 한 줄로 [E2E:E50:{run_id}:T2] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E50:{run_id}:T2]"
    relay_author: provider
    timeout_s: 60
  - send_discord_prompt: "!clear [E2E:E50:{run_id}:CLEAR]"
  - wait_for_raw_discord_text: "세션을 초기화했어요."
    timeout_s: 20
  - send_discord_prompt: "응답에 정확히 한 줄로 [E2E:E50:{run_id}:AFTER_CLEAR] 만 출력해줘."
  - wait_for_discord_text: "[E2E:E50:{run_id}:AFTER_CLEAR]"
    relay_author: provider
    timeout_s: 50
assertions:
  - provider_text_present: "[E2E:E50:{run_id}:T1]"
  - provider_text_present: "[E2E:E50:{run_id}:T2]"
  - provider_text_present: "[E2E:E50:{run_id}:AFTER_CLEAR]"
  - no_duplicate_marker: "[E2E:E50:{run_id}:T1]"
  - no_duplicate_marker: "[E2E:E50:{run_id}:T2]"
  - no_duplicate_marker: "[E2E:E50:{run_id}:AFTER_CLEAR]"
  - no_duplicate_content: true
