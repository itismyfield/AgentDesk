id: E-51
title: Codex !clear 전이 시 본문이 정확히 1회만 도착
agent_mode: real_live
coverage_class: live
cells: [codex-pipe, codex-tui]
acceptance_criteria:
  - Send an initial prompt with a required marker
  - Wait for the first Discord relay message containing the marker
  - Send !clear command to clear conversation history
  - Send a second prompt with a different marker
  - Verify the second marker appears in Discord exactly once
  - Verify no duplicate content between first and second relay messages
  - Verify no Codex warm follow-up kill logs (composer_not_detected = 0)
notes: |
  Tests the !clear command functionality for Codex.
  Issue #6551 is fixed if body arrives after !clear (not held).
  Issue #6552 is fixed if no warm follow-up kills occur.
  This scenario detects symptoms where body is withheld or kills happen.
steps:
  - send_prompt: |
      Respond with exactly one line: [E2E:E51:PART1]
  - wait_for_discord_text: "[E2E:E51:PART1]"
    timeout_s: 240
  - wait_idle_s: 2
  - send_prompt: |
      !clear
  - wait_idle_s: 3
  - send_prompt: |
      Respond with exactly one line: [E2E:E51:PART2]
  - wait_for_discord_text: "[E2E:E51:PART2]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      forbid_degraded_reasons:
        - global_active_counter_out_of_bounds
      global_active_max: 0
      global_finalizing_max: 0
assertions:
  - no_duplicate_content: true
  - text_present: "[E2E:E51:PART1]"
  - text_present: "[E2E:E51:PART2]"
  - ordered_text_present:
      - "[E2E:E51:PART1]"
      - "[E2E:E51:PART2]"
  - no_duplicate_marker: "[E2E:E51:PART1]"
  - no_duplicate_marker: "[E2E:E51:PART2]"
  - raw_message_count_between_markers:
      min: 2
      max: 50
