id: E-37
title: Codex /model completes locally, then an ordinary message is answered exactly once
agent_mode: real_live
coverage_class: live
cells: [codex-pipe, codex-tui]
isolation: required
acceptance_criteria:
  - Warm the Codex channel and wait until the target mailbox is idle.
  - Send a content-only `/model` through Discord and observe the local-control notice.
  - Right after the notice, the target mailbox is still idle (no inflight, no active turn, queue 0).
  - Send an ordinary message; its answer is relayed exactly once after the notice.
  - The target mailbox drains back to idle with queue 0.
notes: |
  The post-notice health probe is deliberately a single attempt: polling would
  wait out a provider turn that `/model` wrongly opened and hide it.
steps:
  - send_discord_prompt: "Reply with exactly [E2E:E37:WARM] and nothing else."
  - wait_for_discord_text: "[E2E:E37:WARM]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      timeout_s: 45
      poll_interval_s: 1
      global_active_max: 0
      global_finalizing_max: 0
  - send_discord_prompt: "/model"
  - wait_for_raw_discord_text: "provider 턴을 만들지 않았습니다"
    timeout_s: 60
  - assert_health:
      global_active_max: 0
      global_finalizing_max: 0
  - send_discord_prompt: "Reply with exactly [E2E:E37:AFTER-MODEL] and nothing else."
  - wait_for_discord_text: "[E2E:E37:AFTER-MODEL]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      timeout_s: 45
      poll_interval_s: 1
      global_active_max: 0
      global_finalizing_max: 0
assertions:
  - chrome_count:
      text: "provider 턴을 만들지 않았습니다"
      exact: 1
  - ordered_text_present:
      - "[E2E:E37:WARM]"
      - "provider 턴을 만들지 않았습니다"
      - "[E2E:E37:AFTER-MODEL]"
  - no_duplicate_marker: "[E2E:E37:WARM]"
  - no_duplicate_marker: "[E2E:E37:AFTER-MODEL]"
  - no_duplicate_content: true
  - no_resume_prompt_chrome: true
