id: E-37
title: Codex /model completes locally, then an ordinary message is admitted at once and answered exactly once
agent_mode: real_live
coverage_class: live
cells: [codex-pipe, codex-tui]
isolation: required
acceptance_criteria:
  - Warm the Codex channel and wait until the target mailbox is idle.
  - Send a content-only `/model` through Discord; the local-control notice arrives and no inflight row is sampled until the quiet period ends with queue 0.
  - Send an ordinary message; the first inflight row sampled is its own, with no foreign source id and queue 0 when admission is observed, within the admission bound.
  - After `/model`, the only relay bodies are the notice and the ordinary answer, each exactly once.
  - The target mailbox drains back to idle with queue 0.
notes: |
  local_control_then_prompt samples the provider inflight row on a background
  thread every 0.1s from before the `/model` send to the ordinary admission, so
  blocking HTTP calls do not open a blind interval; a sampling gap over 1s is
  reported as unevaluable. A turn shorter than one sampling gap is not seen.
steps:
  - send_discord_prompt: "Reply with exactly [E2E:E37:WARM] and nothing else."
  - wait_for_discord_text: "[E2E:E37:WARM]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      timeout_s: 45
      poll_interval_s: 1
      global_active_max: 0
      global_finalizing_max: 0
  - local_control_then_prompt:
      control: "/model"
      notice: "provider 턴을 만들지 않았습니다"
      prompt: "Reply with exactly [E2E:E37:AFTER-MODEL] and nothing else."
      notice_timeout_s: 60
      quiet_s: 5
      admission_timeout_s: 30
  - wait_for_discord_text: "[E2E:E37:AFTER-MODEL]"
    timeout_s: 240
  - wait_idle_s: 3
  - assert_health:
      timeout_s: 45
      poll_interval_s: 1
      global_active_max: 0
      global_finalizing_max: 0
assertions:
  - chrome_count:
      text: "provider 턴을 만들지 않았습니다"
      exact: 1
  - relay_bodies_after_local_control:
      containing: ["provider 턴을 만들지 않았습니다"]
      exact: ["[E2E:E37:AFTER-MODEL]"]
  - ordered_text_present:
      - "[E2E:E37:WARM]"
      - "provider 턴을 만들지 않았습니다"
      - "[E2E:E37:AFTER-MODEL]"
  - text_present: "[E2E:E37:AFTER-MODEL]"
  - no_duplicate_marker: "[E2E:E37:WARM]"
  - no_duplicate_marker: "[E2E:E37:AFTER-MODEL]"
  - no_duplicate_content: true
  - no_resume_prompt_chrome: true
