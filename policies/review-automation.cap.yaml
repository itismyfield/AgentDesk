version: 1
policy: review-automation
trust: trusted-automation
source_events:
  - onReviewEnter
  - onDispatchCompleted
  - onReviewVerdict
  - onTick5min
db:
  read:
    tables:
      - card_review_state
      - kanban_cards
      - kanban_reviews
      - pr_tracking
      - task_dispatches
  write:
    tables:
      - kanban_cards
      - pr_tracking
  raw_sql:
    mode: legacy
    capabilities:
      - review_lifecycle_legacy_raw_db
    markers_required: false
    rationale: broad legacy review lifecycle DB access pinned by no-silent-growth baseline
    no_silent_growth:
      callsites: 28
      fingerprint: sha256:e6b57d40887ba7fcd07c9d5b67f9b9bed865550673fc24e657753ba820675e41
exec:
  allow:
    - gh
    - git
http:
  loopback_only: true
session:
  kill: false
