version: 1
policy: review-automation
trust: trusted-automation
source_events:
  - onReviewEnter
  - onDispatchCompleted
  - onReviewVerdict
  - onTick5min
db:
  read:
    tables:
      - card_review_state
      - kanban_cards
      - kanban_reviews
      - pipeline_stages
      - pr_tracking
      - task_dispatches
  write:
    tables:
      - kanban_cards
      - pr_tracking
  raw_sql:
    mode: legacy
    capabilities:
      - review_lifecycle_legacy_raw_db
    markers_required: false
    rationale: broad legacy review lifecycle DB access pinned by no-silent-growth baseline
    no_silent_growth:
      callsites: 31
      fingerprint: sha256:5cb69e9f5a582d122a14aa23f185ca4ee4427eea8e95757519415d76948707f8
exec:
  allow:
    - gh
    - git
http:
  loopback_only: true
session:
  kill: false
