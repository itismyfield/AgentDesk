version: 1
policy: review-automation
trust: trusted-automation
source_events:
  - onReviewEnter
  - onDispatchCompleted
  - onReviewVerdict
db:
  read:
    tables:
      - card_review_state
      - kanban_cards
      - kanban_reviews
      - pipeline_stages
      - task_dispatches
  write:
    tables:
      - kanban_cards
  raw_sql:
    mode: legacy
    capabilities:
      - review_lifecycle_legacy_raw_db
    markers_required: false
    rationale: broad legacy review lifecycle DB access pinned by no-silent-growth baseline
    no_silent_growth:
      callsites: 31
      fingerprint: sha256:1623a50a036bb6f9c4b0959ab41aad48df3998b7bbf4fdced2125697a4566eee
exec:
  allow:
    - gh
    - git
http:
  loopback_only: true
session:
  kill: false
