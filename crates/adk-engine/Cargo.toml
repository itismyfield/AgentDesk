[package]
name = "adk-engine"
version = "0.1.3"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "../../src/adk_engine_lib.rs"

[features]
test-support = ["dep:adk-test-support", "adk-base/test-support", "adk-runtime/test-support", "tokio/test-util"]

[dependencies]
adk-base = { path = "../adk-base", optional = true }
adk-runtime = { path = "../adk-runtime", optional = true }
adk-test-support = { path = "../adk-test-support", optional = true }
tokio = { version = "1", optional = true }

[dev-dependencies]
adk-base = { path = "../adk-base", features = ["test-support"] }
adk-runtime = { path = "../adk-runtime", features = ["test-support"] }
adk-test-support = { path = "../adk-test-support" }
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "deny", priority = -1 }
await_holding_lock = "deny"
drop_non_drop = "deny"
mistyped_literal_suffixes = "deny"
large_enum_variant = "deny"
result_large_err = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
